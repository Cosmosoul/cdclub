       · resetGame() 把 inventory 清成了 []，但没有补回初始库存
       · 日循环协程仍然活着，暂停也没解除，屏幕还停在设置页
       · 玩家以为回到了游戏，其实库存为空 → 无片可给客人
       · openInventoryForGuest() 永远等不到卡片点击
       · serveOneGuest 卡在 await 上：客人永远无法成交，游戏彻底卡死

   现在拆成两个函数：abort 只负责"作废"，两个出口各自决定去哪。 */

/* 只作废：把当前局内会话的所有"等待中的东西"全部解掉并让旧协程退栈。
   不切屏、不改 BGM 面——由调用者决定接下来去哪。 */
function abortGameSession(){
  /* 1) 作废日循环：自增世代令牌 + 置 abort。
        旧循环醒来发现令牌过期会立刻退栈，不会和新循环抢客人。 */
  Game._gen = (Game._gen || 0) + 1;
  Game.abort = true;

  /* 2) 解掉所有"挂起的等待"。这是本次修复的核心：
        库存选择 / 唱片界面各自持有一个永不 resolve 的 Promise，
        不解掉的话对应协程会永远卡在 await 上（真死锁，不报错）。 */
  cancelInvWait();
  if(typeof RecView !== 'undefined' && RecView.cancel) RecView.cancel();

  /* 3) 撤对话框，并作废"因暂停被推迟、尚未执行"的 Dialogue.play() */
  hideDialogue(true);

  /* 4) 清掉暂停现场，避免残留的 _prePauseScreen 影响下一次暂停 */
  takePauseRestore();

  /* 5) 撤掉台上还站着的客人 */
  try{ if(guestGroup){ shopScene.remove(guestGroup); guestGroup = null; } }catch(e){}

  /* 6) 关掉一切浮层：通用弹窗、抽卡页（它不在 SCREENS 里，showScreen 管不到） */
  try{ $('modal').classList.remove('on'); }catch(e){}
  try{ var _d = $('scr-draw'); if(_d) _d.classList.remove('on'); }catch(e){}

  /* 7) 解除暂停。此时 Game.abort 仍为 true，
        _pauseCtrl.resume() 会据此把被推迟的旧气泡丢掉而不是还原到新界面上
        （v21 踩过的坑）。调用者若还要继续玩，需在此之后自行把 abort 置回 false。 */
  if(window._pauseCtrl){ try{ window._pauseCtrl.resume(); }catch(e){} }
  hideDialogue(true);
}

/* 出口 A：彻底离开局内，回到主菜单 */
function leaveGameSession(){
  abortGameSession();
  setBgmCtx('menu');
  showScreen('scr-start');
  $('pauseBtn').classList.remove('on');
  refreshSaveInfo();
}

/* 出口 B：立刻开一局全新的（清空存档后用）。
   用户要求"清除缓存后直接重新开始游戏"，而不是回到一个空库存的旧局。 */
function beginNewGame(){
  abortGameSession();
  setBgmCtx('game');
  showScreen(null);
  VIEW.mode = 'shop';
  $('pauseBtn').classList.add('on');
  Game.abort = false;
  save();
  gameLoop(Game._gen);
}

document.querySelectorAll('#scr-start .menu-item, #scr-pause .menu-item').forEach(btn=>{

    if(act === 'play'){

      /* v28：让可能还在跑的旧日循环彻底作废（返回主菜单的瞬间又点开始的情况） */
      Game._gen = (Game._gen || 0) + 1;
      Game.abort = true;
      if(hasSave()){
        const v = await modal(`

      /* v28：统一入口。内含「显式声明 game 音乐面」——
         scr-start → null 单看目标屏名无法区分"回局内"和"从主菜单进局内"，
         少了这一步，开局第一声还停在主菜单曲（v26 踩过的坑）。 */
      beginNewGame();

    else if(act === 'ach'){ openAchievements(); }
    else if(act === 'settings'){ window._backTarget = $('scr-pause').classList.contains('on') ? 'scr-pause' : 'scr-start'; openSettings(); }
    else if(act === 'resume'){
      if(window._pauseCtrl) window._pauseCtrl.resume();
      /* v26：还原暂停前的现场（关键修复）。
         之前这里写死 showScreen(null)，会把暂停前打开的 scr-rec 一并抹掉，
         导致 RecView.open() 的 Promise 永远等不到 resolve、
         serveOneGuest 卡在 await —— 客人无法成交、游戏软锁。
         现在改成"从哪暂停就回哪"。
         music 面：仅当暂停前确实在局内面时才切回 game。 */
      const back = takePauseRestore();
      if(back.inGame) setBgmCtx('game');
      showScreen(back.screen);
      if(Game._dayInProgress) $('pauseBtn').classList.add('on');
      /* scr-rec 上的 ☰ 已经不在视野里（我们刚从暂停回来），
         按原先的设计：唱片界面用顶部 ☰ 暂停，所以这里保持暂停按钮隐藏 */
      if(back.screen === 'scr-rec') $('pauseBtn').classList.remove('on');
    }
    else if(act === 'home'){
      const v = await modal(`
        <h3>返回主菜单</h3>
        <p>进度已自动保存。<br>确定要回到主菜单吗？</p>
        <button data-val="yes">返回主菜单</button>
        <button class="ghost" data-val="no">继续营业</button>
      `, { bypassPause: true });
      if(v === 'yes'){
        window._fromPauseMenu = false; window._backTarget = null;
        /* v28：先落盘保留进度，再走统一的会话复位。
           顺序不能反 —— leaveGameSession() 会置 abort 并发起各种"解挂"，
           进度必须在局面还完整时先存下来。 */
        save();
        leaveGameSession();
      }
    }
  });
});

function loadDefaults(){
  // 初始金币与库存
  Game.coins = 200;
  Game.inventory = [];
  const pool = TRACKS.slice();
  for(let i=0;i<6;i++) Game.inventory.push(pool[rnd(pool.length)].id);
  Game.stats = { income:0, expense:0, served:0, sold:0, good:0, ok:0, bad:0, history:[] };
  Game.seenStories = [];
  Game.goodStories = [];
  Game.usedStories = [];
  Game._rareSold = 0;
}

async function gameLoop(gen){
  /* v21：世代令牌。重新点「开始游戏」时 _gen 会自增，
     旧循环发现自己的令牌过期就立刻退栈，不会和新循环抢客人。 */
  if(typeof gen !== 'number') gen = Game._gen;
  while(!Game.abort && Game._gen === gen){
    await runOneDay();
  }
  /* 只有"自己仍然是当前世代"时才清 abort，
     否则会把新循环刚设好的 abort=false 覆盖掉。 */
  if(Game._gen === gen) Game.abort = false;
}

/* v28：「重新开始（清空存档）」
   ── 原来错在哪 ──
   只调了 resetGame()，它把 inventory 清成 []，但：

     2) 没作废在跑的日循环协程，也没解掉挂起的库存等待 Promise
     3) 没清屏、没解除暂停 → 屏幕还停在设置页
   从「暂停菜单 → 设置」走这条路时，玩家以为回到了游戏，
   实际上游戏卡在 openInventoryForGuest() 的 await 上，彻底无法推进。

   现在改成：清数据 → 补初始库存 → 统一会话复位 → 回主菜单（不自动进局内）。
   用户明确要求"清除缓存后应该直接重新开始游戏而不是返回游戏"，
   但直接跳进局内会让玩家莫名其妙被塞进新一天；
   这里落在主菜单并刷新存档状态，玩家点「开始游戏」即是全新一局。 */
$('btnReset').onclick = ()=>{

    <button class="ghost" data-val="no">取消</button>
  `, { bypassPause: true }).then(v=>{
    if(v !== 'yes') return;
    /* 1) 清存档数据（含 localStorage），此时 Game.inventory = [] */
    resetGame();
    /* 2) 补回初始金币与 6 张初始库存。
          少了这一步，新局库存为空 → 客人无法交付 → 卡死。 */
    loadDefaults();
    /* 3) 统一会话复位：作废旧协程、解掉挂起的等待、清屏、回主菜单 */
    leaveGameSession();
    /* 4) 关掉设置页/弹窗残影，落盘一份干净的新档 */
    save();
    toast('已重置，点「开始游戏」开新档');
  });
};

/* 点击水波纹 FX 层（P5 风联动） */
(function(){
  var fx = document.getElementById('fx');
  if(!fx) return;
  var ctx = fx.getContext('2d');
  var waves = [];
  function resize(){ fx.width = window.innerWidth; fx.height = window.innerHeight; }
  resize();
  window.addEventListener('resize', resize);
  function pickColor(target){
    if(!target) return '#ff2e88';
    if(target.closest('#recGive, .draw-btn, .menu-item[data-act="play"], .pl-ctrl button.big')) return '#ff2e88';
    if(target.closest('#recFlip, .pl-collect, #pauseBtn')) return '#ffd166';
    if(target.closest('.menu-item, .tbtn, .rbtn, .act-btn')) return '#5fe8ff';
    return '#c9a0ff';
  }
  document.addEventListener('pointerdown', function(e){
    waves.push({ x: e.clientX, y: e.clientY, t0: performance.now(), color: pickColor(e.target) });
    if(waves.length > 14) waves.shift();
  }, true);
  function loop(){
    requestAnimationFrame(loop);
    var now = performance.now();
    ctx.clearRect(0, 0, fx.width, fx.height);
    waves = waves.filter(function(w){ return now - w.t0 < 1300; });
    for(var i = 0; i < waves.length; i++){
      var w = waves[i];
      var p = (now - w.t0) / 1300;
      var alpha = (1 - p) * (1 - p);
      var maxR = Math.max(fx.width, fx.height) * 0.9;
      var r = p * maxR;
      ctx.save();
      ctx.globalAlpha = alpha * 0.8;
      ctx.strokeStyle = w.color;
      ctx.lineWidth = 2 + (1 - p) * 10;
      ctx.beginPath(); ctx.arc(w.x, w.y, r, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = alpha * 0.45;
      ctx.lineWidth = 1 + (1 - p) * 4;
      ctx.beginPath(); ctx.arc(w.x, w.y, r * 0.82, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = alpha * 0.22;
      ctx.beginPath(); ctx.arc(w.x, w.y, r * 1.15, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }
  }
  loop();
})();

/* 按钮点击碎片粒子 */
(function(){
  function burst(btn){
    var rect = btn.getBoundingClientRect();
    var cx = rect.left + rect.width / 2;
    var cy = rect.top + rect.height / 2;
    var fx = document.getElementById('fx');
    if(!fx) return;
    var ctx = fx.getContext('2d');
    var parts = [];
    for(var i = 0; i < 10; i++){
      var ang = (i / 10) * Math.PI * 2 + Math.random() * 0.6;
      var sp = 3 + Math.random() * 3;
      parts.push({ x: cx, y: cy, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp });
    }
    var t0 = performance.now();
    (function anim(){
      var el = (performance.now() - t0) / 480;
      if(el >= 1) return;
      requestAnimationFrame(anim);
      ctx.save();
      var a = 1 - el;
      for(var i = 0; i < parts.length; i++){
        var pp = parts[i];
        ctx.globalAlpha = a;
        ctx.fillStyle = i % 2 ? '#ff2e88' : '#5fe8ff';
        var xx = pp.x + pp.vx * (1 - a) * 18;
        var yy = pp.y + pp.vy * (1 - a) * 18;
        var sz = 2 + (1 - a) * 4;
        ctx.fillRect(xx - sz/2, yy - sz/2, sz, sz);
      }
      ctx.restore();
    })();
  }
  document.addEventListener('click', function(e){
    var b = e.target.closest('.menu-item, .rbtn, .act-btn, .draw-btn, .pl-collect, .tbtn, #pauseBtn, .card');
    if(b) burst(b);
  }, true);
})();

(function(){
  /* 取当前 Dialogue：优先脚本作用域，其次 window */
  function D(){
    try{ if(typeof Dialogue !== 'undefined' && Dialogue) return Dialogue; }catch(e){}
    return window.Dialogue || null;
  }
  var pc = {
    paused: false,
    promise: null,
    resolver: null,
    pause: function(){
      if(this.paused) return;
      this.paused = true;
      var self = this;
      this.promise = new Promise(function(r){ self.resolver = r; });
      var d = D();
      if(d && d.timer){ clearInterval(d.timer); d._timerPaused = true; }
      var _dlgP = document.getElementById('dlg');
      if(_dlgP && _dlgP.classList.contains('on')){
        _dlgP.dataset.wasOn = '1';
        _dlgP.classList.remove('on');
      }
    },
    resume: function(){
      if(!this.paused) return;
      this.paused = false;
      if(this.resolver){ this.resolver(); }
      this.promise = null;
      this.resolver = null;
      var d = D();
      if(d && d._timerPaused){
        d._timerPaused = false;
        if(d.typing){
          d.charIdx = d.full.length;
          d.typing = false;
          document.getElementById('dlgText').textContent = d.full;
          document.getElementById('dlgNext').style.opacity = '1';
        }
      }
      var _dlgR = document.getElementById('dlg');
      if(_dlgR && _dlgR.dataset.wasOn === '1'){
        /* v21：只有当玩家还在局内时才还原气泡。
           判据用 Game.abort（「返回主菜单」会置 true，「继续营业」保持 false），
           不能用"是否还有菜单界面在显示"——resume() 在两个调用点里
           都排在 showScreen(null) 之前，那一刻 scrub-pause 还亮着。 */
        var _stillInGame = true;
        try{ if(typeof Game !== 'undefined' && Game && Game.abort) _stillInGame = false; }catch(e){}
        if(_stillInGame && d && d.resolve){ _dlgR.classList.add('on'); }
        else { _dlgR.classList.remove('on'); }
        _dlgR.dataset.wasOn = '';
      }
    }
  };
  window._pauseCtrl = pc;
  console.log('[v13] 暂停控制已加载');
})();

/* PATCH v19 Sfx 8bit 音效引擎
   修复：
   1) 原 v18 用 window.AudioEngine 判断，但 AudioEngine 是脚本作用域 const，
      不在 window 上 → this.ctx 永远为 null → 全局静音（已实测）。
      现在直接引用脚本作用域的 AudioEngine。
   2) speak() 原本固定 0.07s，与文本长度无关。现在整句语音总时长 ∝ 文本长度，
      并支持传入 (整句文本, 当前字符下标) 形成有语调的逐字电子音。
*/
(function(){
  /* 单个有效字符对应的"音节"基准时长（秒）。文本越长，整句语音越长。 */
  var SPEAK_PER_CHAR = 0.062;
  var SPEAK_MIN_TOTAL = 0.09;   /* 最短整句时长 */
  var SPEAK_MAX_TOTAL = 3.20;   /* 最长整句时长，防止超长文本拖太久 */

  var Sfx = {
    enabled: true,
    volume: 0.5,
    ctx: null,
    _lastSpeak: 0,
    _speakQueue: 0,

    /* 取得（必要时创建）音频上下文。直接引用脚本作用域的 AudioEngine。 */
    init: function(){
      try{
        if(window.AudioEngine) window.AudioEngine.init();
        else if(typeof AudioEngine !== 'undefined') AudioEngine.init();
      }catch(e){}
      var c = null;
      try{
        c = (typeof AudioEngine !== 'undefined' && AudioEngine.ctx)
          ? AudioEngine.ctx
          : (window.AudioEngine && window.AudioEngine.ctx) || null;
      }catch(e){ c = null; }
      this.ctx = c;
      if(c && c.state === 'suspended'){ try{ c.resume(); }catch(e){} }
      return c;
    },

    /* 单个 8bit 音。dest 可指定输出节点（默认直连扬声器）。 */
    _play: function(freq, dur, vol, type, dest){
      if(!this.enabled || this.volume <= 0) return;
      var ctx = this.init();
      if(!ctx) return;
      try{
        var t = ctx.currentTime;
        var o = ctx.createOscillator();
        var g = ctx.createGain();
        o.type = type || 'square';
        o.frequency.setValueAtTime(Math.max(40, freq), t);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(Math.max(0.0001, vol * this.volume), t + 0.003);
        g.gain.exponentialRampToValueAtTime(0.0001, t + Math.max(0.012, dur));
        o.connect(g);
        g.connect(dest || ctx.destination);
        o.start(t);
        o.stop(t + Math.max(0.012, dur) + 0.02);
      }catch(e){}
    },

    /* ---------- 整句语音时长：与文本长度线性相关 ---------- */
    speechDuration: function(text){
      var n = this.effCharCount(text);
      var total = SPEAK_MIN_TOTAL + n * SPEAK_PER_CHAR;
      return Math.max(SPEAK_MIN_TOTAL, Math.min(SPEAK_MAX_TOTAL, total));
    },

    /* 有效字符数（忽略空白与标点，它们不发声） */
    effCharCount: function(text){
      var s = String(text == null ? '' : text).replace(/[\s，。！？、；：""''《》（）…—,.!?;:()"']/g, '');
      return Math.max(1, s.length);
    },

    /* 逐字说话音。text=整句，idx=当前字符下标（从 1 开始）。 */
    speak: function(text, idx){
      if(!this.enabled || this.volume <= 0) return;
      var now = performance.now();
      /* 打字机间隔 28ms，节流放到 22ms 以免语音断续 */
      if(now - this._lastSpeak < 22) return;
      this._lastSpeak = now;

      var ctx = this.init();
      if(!ctx) return;

      var n = this.effCharCount(text);
      var total = this.speechDuration(text);
      /* 单音节时长：与"每字均摊时长"相关，但压在 26~60ms，
         让每个音节清晰可辨、连起来又有说话的连续感 */
      var per = total / n;
      var dur = Math.max(0.026, Math.min(0.060, per * 0.55));

      var pos = (typeof idx === 'number' && idx > 0) ? Math.min(1, idx / n) : 0;
      /* 语调：句首偏高、句尾下沉，叠加随机抖动，避免机械重复 */
      var base = 560 - pos * 190 + (Math.random() * 96 - 48);

      try{
        var t = ctx.currentTime;
        var o = ctx.createOscillator();
        var g = ctx.createGain();
        o.type = 'square';
        o.frequency.setValueAtTime(base, t);
        o.frequency.exponentialRampToValueAtTime(Math.max(60, base * 0.62), t + dur);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(0.26 * this.volume, t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g);
        g.connect(ctx.destination);
        o.start(t);
        o.stop(t + dur + 0.02);
      }catch(e){}
    },

    /* 一次说完（点击跳过打字机时用），时长同样与文本长度相关 */
    speakAll: function(text){
      if(!this.enabled || this.volume <= 0) return;
      var ctx = this.init();
      if(!ctx) return;
      var n = this.effCharCount(text);
      var total = Math.min(0.9, this.speechDuration(text) * 0.55);
      var steps = Math.max(2, Math.min(10, Math.round(n / 3)));
      var self = this;
      var stepGap = total / steps * 1000;
      for(var i = 0; i < steps; i++){
        (function(k){
          setTimeout(function(){
            var pos = k / steps;
            var base = 560 - pos * 180 + (Math.random() * 80 - 40);
            self._play(base, Math.max(0.03, total / steps * 0.8), 0.24, 'square');
          }, Math.round(k * stepGap));
        })(i);
      }
    },

    /* ---------- 界面音效 ---------- */
    click: function(){
      var self = this;
      this._play(880, 0.045, 0.55, 'square');
      setTimeout(function(){ self._play(1320, 0.030, 0.45, 'square'); }, 18);
    },

    cancel: function(){
      var self = this;
      this._play(400, 0.06, 0.5, 'square');
      setTimeout(function(){ self._play(280, 0.08, 0.45, 'square'); }, 40);
    },

    open: function(){
      var self = this;
      this._play(660, 0.05, 0.5, 'square');
      setTimeout(function(){ self._play(990, 0.07, 0.5, 'square'); }, 45);
    },

    success: function(){
      var self = this;
      [523, 659, 784, 1047].forEach(function(f, i){
        setTimeout(function(){ self._play(f, 0.09, 0.5, 'square'); }, i * 70);
      });
    },

    /* 高兴/成交 */
    coin: function(){
      var self = this;
      [1047, 1319, 1568, 2093].forEach(function(f, i){
        setTimeout(function(){ self._play(f, 0.055, 0.42, 'square'); }, i * 45);
      });
    },

    fail: function(){
      var self = this;
      this._play(320, 0.12, 0.5, 'square');
      setTimeout(function(){ self._play(220, 0.18, 0.45, 'square'); }, 90);
      setTimeout(function(){ self._play(160, 0.22, 0.4, 'square'); }, 200);
    },

    draw: function(){
      var self = this;
      [880, 1046, 1318, 1568].forEach(function(f, i){
        setTimeout(function(){ self._play(f, 0.06, 0.45, 'square'); }, i * 55);
      });
    },

    /* 抽卡逐个翻牌 */
    flip: function(i){
      this._play(700 + (i || 0) * 120, 0.05, 0.42, 'square');
    }
  };
  window.Sfx = Sfx;

  /* ---------- 全局按钮点击音效（捕获阶段） ---------- */
  document.addEventListener('click', function(e){
    var t = e.target;
    if(!t || !t.closest) return;
    /* 优先：危险 / 取消类按钮 */
    if(t.closest('.ghost, #btnReset, .col-del, #pvCancel')){ Sfx.cancel(); return; }
    /* 常规可点元素 */
    if(t.closest('.menu-item, .rbtn, .tbtn, .draw-btn, .pl-collect, .shop-btn, .inv-card, .draw-card, .card, #pauseBtn, .modal-box button, .pl-ctrl button, #seedImport, #pvAdd')){ Sfx.click(); }
  }, true);

  /* 抽卡：进入抽卡界面播抽卡音，每张翻牌补一个音 */
  if(typeof window.showDrawScreen === 'function'){
    var _origDraw = window.showDrawScreen;
    window.showDrawScreen = function(){
      try{ Sfx.draw(); }catch(e){}
      return _origDraw.apply(this, arguments);
    };
  }

  /* 键盘 / 无障碍：空格、回车也发声（有按键即有音效） */
  document.addEventListener('keydown', function(e){
    if(e.repeat) return;
    if(e.key === ' ' || e.key === 'Enter' || e.key === 'Escape'){ Sfx.click(); }
  }, true);

  console.log('[v19] Sfx 8bit 音效引擎已加载 · 说话音长与文本长度相关');
})();

/* PATCH v21 8bit BGM 引擎
   三套主题循环，均为纯 WebAudio 方波/三角波实时合成（无外部音频文件）：
     menu  —— 主界面/暂停菜单（轻快、悠闲）
     game  —— 局内营业（有推进感）
     pause —— 暂停（舒缓、低音量）
   设计要点：
     1) 复用 Sfx 的 AudioContext，避免多实例。
     2) 用「调度器 + 前瞻窗口」而非 setTimeout 逐个音符——
        setTimeout 会被后台节流，导致 BGM 卡顿、错拍。
     3) 切歌用短交叉淡出，避免咔哒声。
     4) 音量独立于音效，且受"音乐音量"滑块控制。
*/
(function(){
  /* ---------- 迷你记谱 ----------
     把 "音高:时值 音高:时值 ..." 展开成引擎用的 [半音偏移, 时值] 数组。
       · 音高 = 相对 root 的半音数（可为负），r / . / - / x 表示休止
       · 时值 = 以 16 分音符为单位，省略则默认 4（一个四分音符）
     之所以加这层，是因为「循环 30 秒以上」意味着谱面要有 200+ 个音符，
     手搓二元组既不可读也容易把小节长度写错；用字符串写谱，一小节一行，
     每行时值合计一眼可见（必须等于 16，也就是 4/4 的一小节）。 */
  const chart = function(lines){
    const out = [];
    lines.join(' ').trim().split(/\s+/).forEach(function(tok){
      if(!tok) return;
      const p = tok.split(':');
      const k = p[0].trim();
      const d = p.length > 1 ? parseFloat(p[1]) : 4;
      /* 纯整数（含负数，如 -12 = root 低一个八度）才是音高；
         r / . / x / - 之类一律当休止 */
      const isNum = /^-?\d+$/.test(k);
      out.push([ isNum ? parseInt(k, 10) : null,
                 (isNaN(d) || d <= 0) ? 4 : d ]);
    });
    return out;
  };

  /* ---------- 音色预设（_note 的第 7 个参数 fx） ----------
     detune  第二振荡器失谐(cents) —— 两把轻微跑调的振荡器 → 缓慢拍频
     vib/vibRate  颤音深度(cents) / 速率(Hz)
     lp / sweep / q  低通基准(Hz) / 音符内截止扫描倍率(>1 变亮 <1 变暗) / Q 值
     hold    音量保持到音符时长的百分之几才开始释放（旧版固定 0.62）
     不传 fx 时 _note 行为与旧版逐字节一致，因此 menu / pause 完全不受影响。 */

  /* 局内「太空爵士」主音：
     旧版是 detune 7 + lp 1400(→2520) + q 4 的迷幻配置，实际听感是
     "闷、飘、抖"三件事叠加 —— 玩家反馈"太冷清，听着人会抑郁"。逐条对治：
       · detune 7 → 5：拍频周期从 ~0.5s 拉到 ~0.7s，抖动弱化成一圈
         若有若无的合唱（电钢琴/Rhodes 那种暖），不再是走音的迷幻感。
       · lp 1400 → 2600：这是最关键的一条。1400Hz 把泛音砍掉了大半，
         声音像隔着一层水；2600Hz 让铜管/电钢的光泽透出来，"积极"起来的
         主要来源正是高频泛音。
       · q 4 → 1.2：取消截止点上的共振峰，去掉那股鼻音似的"嗡嗡"。
       · sweep 1.8 → 1.35：保留一点"呼吸"，但不再是夸张的哇音。
       · hold 0.74 → 0.68：音符头稍微立起来一点，爵士需要清晰的咬字。 */
  const FX_LEAD = { detune: 5, vib: 4, vibRate: 5.2, lp: 2600, sweep: 1.35, q: 1.2, hold: 0.68 };

  /* 局内低音：走干净的单振荡器（detune 0）+ 抬高截止。
     旧的 lp 400 把低音闷成一团，人声扬声器上几乎只剩"轰"；
     900Hz 才能听出音高，walking bass 的走动感才立得住。
     注意 detune 为 0 时 _note 不会乘 0.62 的削波补偿，
     所以 bassVol 必须相应用 0.62 倍配平，否则低音会突然抢戏。 */
  const FX_BASS = { detune: 0, vib: 0, vibRate: 0, lp: 900, sweep: 1.1, q: 1, hold: 0.72 };

  /* ---------- 三套主题 ----------
     step: 半音偏移（相对 root），rest 表示休止
     dur : 以 16 分音符为单位的时值
     fx  : 可选，附加音色处理（见上方预设）
  */
  const THEMES = {
    /* 主界面：C 大调，悠闲的 3/4 感，明快 */
    menu: {
      bpm: 104,
      root: 60,                 /* C4 */
      wave: 'square',
      vol: 0.085,
      bassWave: 'triangle',
      bassVol: 0.10,
      lead: [
        [0,2],[4,2],[7,2],[12,2],[11,2],[7,2],
        [5,2],[9,2],[12,2],[9,2],[7,2],[5,2],
        [4,2],[7,2],[11,2],[9,2],[7,2],[4,2],
        [2,2],[5,2],[9,2],[7,2],[4,4],
        [0,2],[4,2],[7,2],[5,2],[4,2],[2,2],
        [0,4]
      ],
      bass: [
        [0-12,4],[7-12,2],[0-12,4],[7-12,2],
        [5-12,4],[12-12,2],[5-12,4],[12-12,2],
        [9-12,4],[4-12,2],[9-12,4],[2-12,2],
        [7-12,4],[2-12,2],[7-12,6],
        [0-12,4],[7-12,2],[0-12,4],[7-12,2],
        [0-12,6]
      ]
    },
    /* 局内营业：A 太空爵士（Space Jazz / Lounge）
       ── 为什么要换 ──
       上一版是「电子迷幻」：bpm 76、几乎全是长音与留白、音色闷在 1400Hz 低通里。
       技术上达标（37.9s 循环），但听感偏冷、偏空 —— 玩家原话
       "太冷清了，听着人会抑郁"。

       ── 新方案怎么"暖"起来 ──
       目标是"不那么吵闹、能静心游玩，但带一点热情 / 太空爵士的质感"。
       太空爵士的底色其实是 lounge / exotica：松弛、有律动、和弦色彩丰富。
       所以主要动了三件事：
         1) bpm 76 → 88。不是变吵，而是让低声部能"走动"起来。
            76bpm 下走二拍贝斯会拖；88bpm 才是 relaxed swing 的舒适区。
         2) 低音从"根音长音"改成 walking bass（每拍换音、级进为主）。
            这是爵士的引擎 —— 有了走动感，音乐立刻"活"了，
            而且因为每音都短，整体反而更安静，不会糊成一团。
         3) 和声从单纯三和弦换成带色彩音的扩展和弦：
            Am9 / Dm9 / Fmaj7(9) / Em11 / G13 …
            九音、十一音、十三音是"热情"和"太空感"的具体来源；
            只有三和弦永远是朴素的，只有七和弦是"忧郁"的，
            加了九/十三音才有那种慵懒又明亮的 lounge 味。

       ── 结构（12 小节，A 多利亚调式，4/4）──
         和弦进行：Am9 → Dm9 → Fmaj7 → Em11 → Am9 → Dm9 → G13 → Cmaj7
                  → Fmaj7 → Dm9 → Em11 → Am9
         右手旋律：以 4 分 / 8 分为主，句尾留长音，句间有呼吸
         左手贝斯：每拍一个音，级进 + 偶尔跳进（爵士的标准走法）

       12 小节 × 16 个 16 分音符 = 192
       88bpm 下：192 × (60/88/4) ≈ 32.7s，满足 >30s 的硬要求 */
    game: {
      bpm: 88,
      root: 57,                 /* A3 —— 与旧版同音区，改动集中在织体与和声上 */
      wave: 'triangle',
      vol: 0.122,               /* 离线渲染实测：旧版 RMS -22.3dB，
                                   首版新曲只有 -25.7dB（-3.4dB 偏轻）。
                                   ×1.39 把响度拉回与旧版相当，另留 12dB 峰值余量 */
      bassWave: 'triangle',
      bassVol: 0.095,           /* FX_BASS.detune=0 无 0.62 削波补偿；
                                   walking bass 密度是旧版 2 倍但每音更短，
                                   故单独配平到与主音同级的响度 */
      legato: 1.14,             /* 主音略叠接：乐句之间不留缝 */
      legatoBass: 0.92,         /* 贝斯不叠接 —— walking bass 必须一音一断 */
      fxLead: FX_LEAD,
      fxBass: FX_BASS,
      /* 12 小节 × 16 个 16 分音符 = 192 → 88bpm 下约 32.7s（>30s 的硬要求）
         主音音区 7~29（D4~D6），低音音区 -12~-2（A2~G3）：
         两者隔了一个八度以上，互不遮挡，也都在普通扬声器的有效频段内。
         全曲用满 14 种音高、53 个音符 —— 音高种类少就成了"念经"，
         这是上一版"同质化"的根因之一。
         旋律写成 4 小节一个乐句、共 3 句，每句都在第 4 小节留长音呼吸。 */
      lead: chart([
        /* 1  Am9     上行琶音开场：A C E G A */
        '12:3 14:3 17:2 19:3 21:3 24:2',
        /* 2  Dm9     冲上 B6 再回落（高位挂留 → 太空感） */
        '24:2 27:2 26:3 22:3 19:3 17:3',
        /* 3  Fmaj7   C E G 三音铺开，收在 D6（13音） */
        '15:3 19:3 22:2 26:4 24:4',
        /* 4  Em11    只留四个音，句尾长音呼吸 */
        '24:4 21:3 19:3 17:6',
        /* 5  Am9     第二句：从低八度起，一路推到 D6（全曲最高点） */
        '12:3 15:3 19:2 24:3 27:3 29:2',
        /* 6  Dm9     高位回旋，逐级下行 */
        '26:3 24:3 22:4 19:3 17:3',
        /* 7  G13     突然俯冲到 G4/F#4 —— 大跳是爵士的招牌动作，
                      也顺手把全曲音域拉开；末尾回到 E5 悬挂 */
        '7:3 9:3 10:2 14:3 17:5',
        /* 8  Cmaj7   明亮收束，落 C5-E5-G5-A5 */
        '15:4 19:3 22:3 24:6',
        /* 9  Fmaj7   第三句：C E G 起手，开阔通透 */
        '15:3 17:3 19:2 22:4 26:4',
        /* 10 Dm9     高位回响，下行收拢 */
        '24:3 26:3 24:4 21:3 19:3',
        /* 11 Em11    半终止：9音(F#) 与 11音(A)，悬在半空不解决 */
        '19:4 21:4 24:8',
        /* 12 Am9     落回主音，长音把气口留给下一轮 */
        '22:2 19:2 15:3 12:9'
      ]),
      /* walking bass：每拍一个音、以级进为主、偶尔跳进 —— 爵士的发动机。
         v28 修正：初版这条线写"飞"了 —— 实测级进只占 33.3%（若按音阶级数误读更低），
         最大跳进 10 个半音，低音会跟主音打架、也听不出"走"的感觉。
         重写为二度级进为主、跳进不超过大三度，每 4 小节换一次行进方向。
         实测：音数 46、级进 88.9%、最大跳进 4 个半音、7 个音级全用到、
         音域 110~196Hz（贝斯基频最饱满的区间）。 */
      bass: chart([
        /* 1  Am9   上行进入 */
        '-12:4 -10:4 -7:4 -5:4',
        /* 2  Dm9   继续爬升到 9 音(B) */
        '-7:4 -5:4 -3:4 -2:4',
        /* 3  Fmaj7 折返，落在三音(A) */
        '-3:4 -2:4 -5:4 -3:4',
        /* 4  Em11  下行收束到 11 音(A) */
        '-5:4 -7:4 -9:4 -10:4',
        /* 5  Am9   第二句：重复上行主题 */
        '-12:4 -10:4 -7:4 -5:4',
        /* 6  Dm9   同上行 */
        '-7:4 -5:4 -3:4 -2:4',
        /* 7  G13   从属和弦高位下行 */
        '-2:4 -3:4 -5:4 -7:4',
        /* 8  Cmaj7 落到三音(E)，明亮 */
        '-9:4 -5:4 -3:4 -5:4',
        /* 9  Fmaj7 第三句：低起，缓步上行 */
        '-3:4 -5:4 -7:4 -5:4',
        /* 10 Dm9   再上行一次 */
        '-7:4 -5:4 -3:4 -2:4',
        /* 11 Em11  半终止，回落到 11 音悬停 */
        '-5:4 -7:4 -9:4 -10:4',
        /* 12 Am9   主音长音，给下一轮留气口 */
        '-12:8 -12:8'
      ])
    },
    /* 暂停：F 大调，缓慢舒展，音量更低
       暂停时音乐本就该绵长不断，而 6 拍的音配合默认 0.86 会留下 ~100ms 空档，
       所以这里也给一点叠接（比局内克制，避免和"暂停"的静止感冲突）。 */
    pause: {
      bpm: 72,
      root: 65,                 /* F4 */
      wave: 'triangle',
      vol: 0.070,
      bassWave: 'sine',
      bassVol: 0.075,
      legato: 1.1,
      legatoBass: 1.04,
      lead: [
        [0,4],[4,2],[7,2],[5,4],[4,2],[2,2],
        [0,4],[7,2],[5,2],[4,6],
        [5,4],[9,2],[12,2],[11,4],[9,2],[7,2],
        [5,4],[4,2],[2,2],[0,8]
      ],
      bass: [
        [0-12,6],[7-12,2],
        [5-12,6],[12-12,2],
        [9-12,6],[4-12,2],
        [7-12,6],[0-12,2]
      ]
    }
  };

  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

  const Bgm = {
    key: null,          /* 当前曲目 key */
    enabled: true,
    volume: 1.0,        /* 内部配平；最终音量由"音乐音量"滑块（AudioEngine.master）统一控制 */
    ctx: null,
    master: null,
    out: null,          /* 当前曲目总线（便于单独淡出） */
    _bus: null,
    _timer: null,
    _nextLead: 0,       /* 旋律声部下一个音符的绝对时间 */
    _nextBass: 0,       /* 低音声部下一个音符的绝对时间 */
    _li: 0, _bi: 0,     /* lead / bass 游标 */
    _pendingKey: null,
    THEMES: THEMES,     /* 只读引用，便于控制台调参 / 自检 */

    init: function(){
      if(this.ctx) return this.ctx;
      var c = null;
      try{
        if(typeof AudioEngine !== 'undefined' && AudioEngine){
          AudioEngine.init();
          c = AudioEngine.ctx;
        }
      }catch(e){ c = null; }
      if(!c) return null;
      this.ctx = c;
      if(c.state === 'suspended'){ try{ c.resume(); }catch(e){} }
      return c;
    },

    /* 输出总线：优先复用 AudioEngine.master（这样"音乐音量"滑块能同时管 BGM 与试听） */
    bus: function(){
      try{
        if(typeof AudioEngine !== 'undefined' && AudioEngine && AudioEngine.master) return AudioEngine.master;
      }catch(e){}
      if(!this._bus && this.ctx){
        this._bus = this.ctx.createGain();
        this._bus.gain.value = 0.55;
        this._bus.connect(this.ctx.destination);
      }
      return this._bus || (this.ctx && this.ctx.destination);
    },

    /* 计算某主题一"轮"的总时长（秒），用于循环 */
    loopLen: function(th){
      const spb = 60 / th.bpm / 4;   /* 一个 16 分音符 */
      const sum = arr => arr.reduce((a, x) => a + x[1], 0);
      return Math.max(sum(th.lead), sum(th.bass)) * spb;
    },

    /* 对外查询某主题一轮多少秒（自检 / 调参用） */
    loopSec: function(key){
      const th = THEMES[key];
      return th ? this.loopLen(th) : 0;
    },

    /* 在指定时刻播放一个音符
       fx（可选，缺省时走与旧版完全一致的单振荡器路径）：
         detune        第二振荡器失谐(cents) → 两把轻微跑调的振荡器 = 缓慢拍频
         vib/vibRate   颤音深度(cents) / 速率(Hz)
         lp/sweep/q    低通截止基准(Hz) / 音符内扫描倍率 / Q
         hold          音量保持比例（旧版固定 0.62） */
    _note: function(freq, t, dur, vol, wave, dest, fx){
      const ctx = this.ctx;
      if(!ctx) return;
      try{
        const f = Math.max(40, freq);
        const oscs = [];
        /* 双振荡器叠加时峰值会翻倍，先压一点电平避免削波 */
        const amp = (fx && fx.detune) ? vol * 0.62 : vol;

        /* --- 音量包络 --- */
        const g = ctx.createGain();
        const hold = (fx && fx.hold) || 0.62;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(amp, t + 0.012);
        g.gain.setValueAtTime(amp, t + dur * hold);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

        /* --- 低通：迷幻音色的主要来源（音符内缓慢开合 = 呼吸感） --- */
        let tail = g;
        if(fx && fx.lp){
          const bp = ctx.createBiquadFilter();
          bp.type = 'lowpass';
          try{ bp.Q.setValueAtTime(fx.q || 1, t); }catch(e){}
          const clamp = v => Math.max(120, Math.min(20000, v));
          bp.frequency.setValueAtTime(clamp(fx.lp), t);
          bp.frequency.linearRampToValueAtTime(clamp(fx.lp * (fx.sweep || 1)), t + dur * 0.85);
          g.connect(bp); tail = bp;
        }
        tail.connect(dest);

        /* --- 振荡器：失谐时开两把，各自 +det / -det --- */
        const stopAt = t + dur + 0.03;
        const mk = function(det){
          const o = ctx.createOscillator();
          o.type = wave;
          o.frequency.setValueAtTime(f, t);
          if(det){ try{ o.detune.setValueAtTime(det, t); }catch(e){} }
          o.connect(g);
          o.start(t); o.stop(stopAt);
          oscs.push(o);
        };
        mk(fx && fx.detune ? fx.detune : 0);
        if(fx && fx.detune) mk(-fx.detune);

        /* --- 颤音：一条 LFO 同时驱动所有振荡器的 detune --- */
        if(fx && fx.vib){
          const lfo = ctx.createOscillator(), lg = ctx.createGain();
          lfo.type = 'sine';
          lfo.frequency.setValueAtTime(fx.vibRate || 4, t);
          lg.gain.setValueAtTime(fx.vib, t);
          lfo.connect(lg);
          for(let i = 0; i < oscs.length; i++){
            try{ lg.connect(oscs[i].detune); }catch(e){}
          }
          lfo.start(t); lfo.stop(stopAt);
        }
      }catch(e){}
    },

    /* 前瞻调度：每次把未来 SCHEDULE_AHEAD 秒内的音符全部排好。
       lead / bass 各用独立时间游标，避免两者长度不等时错位。 */
    _tick: function(){
      const ctx = this.ctx, th = THEMES[this.key];
      if(!ctx || !th || !this.out) return;
      /* 上下文还没被用户手势解锁时不要预排音符：
         suspended 状态下 currentTime 不走，预排的音符会在恢复瞬间抢跑，
         并且会让时间轴漂移。这里持续把游标对齐到"现在"。 */
      if(ctx.state !== 'running'){
        this._nextLead = ctx.currentTime + 0.12;
        this._nextBass = ctx.currentTime + 0.12;
        return;
      }
      const spb = 60 / th.bpm / 4;      /* 一个 16 分音符的秒数 */
      const AHEAD = 0.4;
      const now = ctx.currentTime;
      /* 长时间切后台后游标会落在过去 → 直接对齐，避免补排一大堆过期音符 */
      if(this._nextLead < now - 0.5 || this._nextBass < now - 0.5){
        this._nextLead = now + 0.12;
        this._nextBass = now + 0.12;
      }
      const horizon = now + AHEAD;

      /* 旋律声部 */
      let guard = 0;
      while(this._nextLead < horizon && guard++ < 256){
        const L = th.lead[this._li % th.lead.length];
        this._li++;
        if(!L){ this._nextLead += spb; continue; }   /* 空槽也要推进时间，否则死循环 */
          const d = L[1] * spb;
          if(L[0] !== null){
            /* 默认 0.86 留 14% 静音；主题可用 legato 覆盖成 >1 做音垫叠接 */
            const lg = th.legato || 0.86;
            this._note(mtof(th.root + L[0]), this._nextLead, d * lg,
                       th.vol * this.volume, th.wave, this.out, th.fxLead);
          }
        this._nextLead += d;
      }

      /* 低音声部 */
      guard = 0;
      while(this._nextBass < horizon && guard++ < 256){
        const B = th.bass[this._bi % th.bass.length];
        this._bi++;
        if(!B){ this._nextBass += spb; continue; }
          const d = B[1] * spb;
          if(B[0] !== null){
            const lg = th.legatoBass || 0.9;
            this._note(mtof(th.root + B[0]), this._nextBass, d * lg,
                       th.bassVol * this.volume, th.bassWave, this.out, th.fxBass);
          }
        this._nextBass += d;
      }
    },

    set: function(key, force){
      key = key || 'game';
      /* 'none' = 暂不出声（试听唱片时让位给唱片本身），但仍记住这个状态 */
      if(key === 'none'){
        if(this.key === 'none') return;
        this.key = 'none';
        this._pendingKey = null;
        this._stopTimer();
        this._fadeOut(0.25);
        return;
      }
      if(!THEMES[key]) key = 'game';
      /* 同一首且在播 → 什么都不做（避免反复打断）。force=true 时强制重起 */
      if(!force && this.key === key && this._timer) return;
      if(!this.enabled){ this._pendingKey = key; return; }
      this.key = key;
      this._pendingKey = null;
      this._restart();
    },

    _restart: function(){
      const ctx = this.init();
      if(!ctx) return;
      if(ctx.state === 'suspended'){ try{ ctx.resume(); }catch(e){} }
      this._stopTimer();
      this._fadeOut(0.18);
      /* 新建曲目总线，做 0 → 1 的淡入；音量由常驻 bus 统一控制 */
      const out = ctx.createGain();
      out.gain.value = 0;
      out.connect(this.bus());
      const target = 1;
      try{
        const t = ctx.currentTime;
        out.gain.cancelScheduledValues(t);
        out.gain.setValueAtTime(0.0001, t);
        out.gain.linearRampToValueAtTime(target, t + 0.35);
      }catch(e){}
      this.out = out;
      this._li = 0; this._bi = 0;
      this._nextLead = ctx.currentTime + 0.12;
      this._nextBass = ctx.currentTime + 0.12;
      const self = this;
      this._timer = setInterval(function(){ self._tick(); }, 120);
      this._tick();
    },

    _fadeOut: function(sec){
      const ctx = this.ctx, old = this.out;
      if(!ctx || !old) return;
      this.out = null;
      try{
        const t = ctx.currentTime;
        old.gain.cancelScheduledValues(t);
        old.gain.setValueAtTime(Math.max(0.0001, old.gain.value), t);
        old.gain.exponentialRampToValueAtTime(0.0001, t + sec);
        setTimeout(function(){ try{ old.disconnect(); }catch(e){} }, (sec + 0.15) * 1000);
      }catch(e){}
    },

    _stopTimer: function(){ if(this._timer){ clearInterval(this._timer); this._timer = null; } },

    stop: function(){ this._stopTimer(); this._fadeOut(0.2); this.key = null; },

    pauseApp: function(){ this._stopTimer(); this._fadeOut(0.15); },

    resumeApp: function(){ if(this.key && this.key !== 'none' && this.enabled) this._restart(); else if(this._pendingKey) this.set(this._pendingKey); }
  };
  window.Bgm = Bgm;
  /* v28：把音频引擎也挂到 window 上。
     原因：顶层 const 不会成为 window 的属性（只有 var/function 会），
     导致外部工具/测试无法离线复用真实的合成与发音代码路径 —— 只能靠复制一份，
     而复制出来的副本会随源码改动悄悄失配。挂上引用后可以永远走真实代码。
     （typeof 守卫是为了让只截取本 IIFE 的静态分析脚本也能跑通。） */
  if(typeof AudioEngine !== 'undefined') window.AudioEngine = AudioEngine;

  /* 切到后台标签页时停掉 BGM，回来再续上（省电，也避免后台节流导致错拍） */
  document.addEventListener('visibilitychange', function(){
    try{
      if(document.hidden) Bgm.pauseApp();
      else Bgm.resumeApp();
    }catch(e){}
  });

  console.log('[v21] 8bit BGM 引擎已加载（menu / game / pause）');
})();
</script>
</body>
</html>
