/* ------------------------- 7.2 三种护符（v30） -------------------------
   ── 三条规则里有两处是"对玩家隐藏的"或"抽任务时才执行"，务必分清 ──
     · 蓝：**结算时**判定 —— 客人不满意时也照付 BLUE_PAY 金币。
     · 黄：**结算时**判定 —— 满意（good/ok）时收入 ×1.10 并四舍五入。
           数值规则**不告诉玩家**（描述只说"提高获得的金币数量"），
           因为揭示 10% 会让"选唱片策略"退化成算术题。
     · 绿：**抽任务时**判定 —— 见 stockScreen 里的重抽循环，不是结算时补钱。
           它保证的是"店内唱片有可能让所有人满意"，即存在一种分配让
           5 位客人全部不落空（nonBad === 5），而不是保证客人一定满意。
   全部 **仅下一局生效**：在店铺管理里买下，第二天抽任务前消耗掉。 */
const TALISMANS = [
  { id:'blue',  name:'海蓝护符', cls:'bl', cost:80,
    short:'不满意也照付 50 金币',
    desc:'即使客人不满意，也会支付你 50 金币' },
  { id:'amber', name:'琥珀护符', cls:'yl', cost:120,
    short:'提高满意时获得的金币',
    /* 注意：这里刻意不写 +10%，见上方说明 */
    desc:'客人满意时，提高你获得的金币数量' },
  { id:'jade',  name:'翠玉护符', cls:'gr', cost:150,
    short:'保证店内唱片人人有份',
    desc:'下一天分配客人时，保证店内的唱片有可能让所有人都满意' }
];
const TAL_BY_ID = {};
TALISMANS.forEach(t => TAL_BY_ID[t.id] = t);
const BLUE_PAY   = 50;    /* 蓝护符：不满意时的安慰金 */
const AMBER_MULT = 1.10;  /* 黄护符：满意时的收入倍率（对玩家隐藏） */
function hasTal(id){ return (Game.talismans || []).indexOf(id) >= 0; }

/* 结算完成、进入下一天前调用：护符只保一局，用完即焚 */
function consumeTalismans(){
  if((Game.talismans || []).length){
    Game.talismanUses = (Game.talismanUses || 0) + Game.talismans.length;
    Game.talismans = [];
  }
}

function rarityMult(r){ return r===3 ? 1.8 : (r===2 ? 1.3 : 1); }

/* ------------------------- 7.3 金边唱片（v30） -------------------------
   金边 = 唱片多一个 `gold:true` 标记：
     · CD 建模多一圈金黄包边（buildRecord 里的环 + 封面 canvas 的描边）
     · 库存/收藏卡右上角加「金边」角标，卡片描金
     · 抽卡时金色光晕，并且**满足客人需求时给更多金币**
   它和 rarity（★ 稀有度）是两个正交的属性：一张普通唱片也可能是金边。
   这样可以保证付费进货「稀有」档的承诺（一定含一张金边）不依赖运气。 */
const GOLD_GOOD_MULT = 1.35;   /* 金边 + 满意(good) 时的额外倍率 */
const GOLD_OK_MULT   = 1.15;   /* 金边 + 还算满意(ok) 时的额外倍率 */

/* 金边标记不是 track 上的固有字段（TRACKS 是共享对象，不能就地改，
   否则下一局抽到同一张还会带着上一局的金边）。
   改成**会话级标记表**：每局开始时清空。 */
let GOLD_IDS = new Set();
function markGold(track){
  if(!track) return;
  GOLD_IDS.add(String(track.id));
  track.gold = true;
}
function isGold(track){
  if(!track) return false;
  return GOLD_IDS.has(String(track.id)) || !!track.gold;
}
function clearGoldMarks(){
  GOLD_IDS.forEach(function(id){
    /* v31.3：改用 getTrackById —— 动态生成的专辑（id 形如 's…'）不在 TRACK_BY_ID 里，
       直接查表会拿到 undefined，导致它的 gold 标记永远清不掉。 */
    const t = getTrackById(id);
    if(t) delete t.gold;
  });
  GOLD_IDS = new Set();
}
function goldMult(track, result){
  if(!isGold(track)) return 1;
  if(result === 'good') return GOLD_GOOD_MULT;
  if(result === 'ok')   return GOLD_OK_MULT;
  return 1;
}
/* v30：抽卡/库存/收藏三处共用同一个标签文本，避免各写一份导致不一致 */
function rarityLabel(t){
  if(!t) return '';
  const base = t.rarity === 3 ? '珍稀' : (t.rarity === 2 ? '稀有' : '普通');
  return isGold(t) ? (base + ' · 金边') : base;
}

/* v30/v31：新手教程的"已看过"标记。
   ── 为什么定义在这里（存档节）而不是和 Tutorial 放一起 ──
   它要**先于**使用者出现。v30 曾把它放在 4600 行附近，而 2690 行的
   resetGame() 就要读它 —— 那是一次真实的 TDZ（ReferenceError），

   放在这里，常量先于所有使用者，不需要任何防御性包裹。
   ── v31：resetGame() 已经不再删除它 ──
   理由见 resetGame() 内的说明（它是"人"的属性，不是"存档"的属性）。 */
const TUTORIAL_KEY = 'record_shop_tutorial_v1';
function tutorialDone(){ try{ return localStorage.getItem(TUTORIAL_KEY) === '1'; }catch(e){ return false; } }

/* ── v31.1 会话取消令牌（Canceller）──
   ── 为什么必须有它 ──
   abortGameSession() 靠"把挂起的 Promise 解掉"来让旧协程退栈：
   解掉之后旧协程只是排进微任务队列，**还没真的返回**。
   如果紧接着又开一局（清档后立刻重启 / 返回主菜单后马上点开始游戏），
   那批微任务就会在新会话开始**之后**才恢复执行 ——
   此时 Game.abort 已经被新会话复位成 false，于是：
     · 旧协程的 `if(Game.abort) return` 检查全部失效
     · 它继续往下跑：重新 openInventoryForGuest() → 把 scr-inv 又打开一次
       → 玩家看到"新的一局刚开，库存界面莫名其妙浮在外面"
     · 更糟的变体：它跑完整套接待，给旧故事发钱、扣不存在的库存
   ── 怎么修 ──
   给每个会话发一个世代令牌，abort 时**自增**。旧协程每一处守卫都同时
   检查"我的令牌是否还是当前的"，一旦不是就无条件退栈 ——
   不再依赖 Game.abort 这个会被新会话复用的标志。
     · `_gen`（Game 上，已有）负责日循环层面
     · `sessionGen`（这里）负责"这一局会话"层面，覆盖 await 中的散点检查
   ── 与 _gen 的区别 ──
   _gen 是 gameLoop 的 while 条件；sessionGen 是**每一处 await 之后**的散点。
   两者互补：只靠 _gen 的话，循环体内的 await 恢复执行时不会被拦住。 */
let sessionGen = 0;
function currentSessionGen(){ return sessionGen; }
function bumpSessionGen(){ sessionGen++; return sessionGen; }
window.currentSessionGen = currentSessionGen;

      seenTracks: (Game.seenTracks instanceof Set) ? Array.from(Game.seenTracks) : [],

      _curGuest: (typeof Game._curGuest === 'number' ? Game._curGuest : -1),

      theme: THEME_BY_ID[d.theme] ? d.theme : 'neon',

      repGood: d.repGood ?? 0, repBad: d.repBad ?? 0,
      stats: d.stats ?? Game.stats, collection: d.collection ?? [],

      _dayInProgress: !!d._dayInProgress,

      /* v31.3：恢复"已出现过的专辑"表。

         只是会多送玩家几批"可能重复"的货，不会损坏任何状态。 */
      seenTracks: new Set(Array.isArray(d.seenTracks) ? d.seenTracks.map(String) : []),
      _rareSold: d._rareSold || 0,
      _bigSale: !!d._bigSale,
      _perfectDay: !!d._perfectDay,
      _usedAd: !!d._usedAd,
      /* v21：局内进度原子性 */
      _curGuest: (typeof d._curGuest === 'number' ? d._curGuest : -1),
      _curGuestDone: !!d._curGuestDone
      /* v31：不再读 d._tutorialDay（字段已删除）。
         旧存档里残留的这个键会被自然忽略，不写迁移代码。 */
    });

       因为它写的是模块级 GOLD_IDS 而不是 Game 的字段）。 */
    clearGoldMarks();

      const t = getTrackById(id);

    if(Game._curGuestDone && Game._curGuest >= 0 && Game._curGuest >= Game.guestsToday){
      Game.guestsToday = Math.min(5, Game._curGuest + 1);
    }
    Game._curGuest = -1;
    Game._curGuestDone = false;
    return true;
  }catch(e){ return false; }

  Game.seenStories = []; Game.goodStories = []; Game.usedStories = [];
  Game._rareSold = 0; Game._bigSale = false; Game._perfectDay = false; Game._usedAd = false;
  Game._curGuest = -1; Game._curGuestDone = false;
  /* v31.2：日终退出的一次性锁也要复位，否则新一局第一次到结算页时
     那个「返回主菜单」会被当成"已经收尾过"而静默失效。 */
  Game._dayEndLeft = false;

  clearGoldMarks();
  /* ── v31 修复：**不再**删除 TUTORIAL_KEY ──
     v30 在这里删了它，理由是"清档 = 我要从头再来，所以重看教程"。
     但那正是用户报告的 bug 源头：
       主菜单「开始游戏」→ 有存档 → 弹窗选「重新开始」→ resetGame()
       → TUTORIAL_KEY 被删 → beginNewGame() → Tutorial.shouldRun()

     所以它必须比存档更持久。想重看请用设置里的「重看新手教程」。 */
  localStorage.removeItem(SAVE_KEY);

     resetGame 有三个调用点（设置页清档 / 主菜单「重新开始」/「重看教程」），
     修在这里才能一次覆盖全部，将来新增调用点也不会漏。 */
  syncShopThemeToState();
}

/* ------------------------- 10. 对话系统 ------------------------- */
const Dialogue = {
  lines: [], idx:0, typing:false, charIdx:0, timer:null, resolve:null,
  /* v21：世代号。离开局内会话（回主菜单/启动页）时自增，
     用来作废"暂停期间被推迟、解除暂停后才执行"的 _do。
     否则气泡会在主菜单上被重新挂出来。 */
  _epoch: 0,

  play(lines){
    var self = this;
    var ep = this._epoch;          /* 捕获发起时的世代 */
    return new Promise(function(resolve){
      var _do = function(){
        /* v21：等待暂停解除的这段时间里，玩家可能已经离开局内会话
           （走「暂停 → 返回主菜单」这条路）。此时必须让这次对话作废，
           否则气泡会被挂到主菜单上。
           判据只用两个，不能用"是否有菜单界面在显示"——
           「继续营业」路径里 showScreen(null) 排在 resume() 之后，
           那一刻 scr-pause 还亮着，那样会误伤正常恢复。 */
        var leftGame = false;
        try{
          if(typeof Game !== 'undefined' && Game && Game.abort) leftGame = true;
        }catch(e){}
        if(ep !== self._epoch || leftGame){ resolve(); return; }
        self.lines = lines;
        self.idx = 0;
        self.resolve = resolve;
        $('dlg').classList.add('on');
        /* v19：对话开场提示音 */
        if(window.Sfx) Sfx.open();
        self.render();
      };
      if(window._pauseCtrl && window._pauseCtrl.paused && window._pauseCtrl.promise){ window._pauseCtrl.promise.then(_do); } else { _do(); }
    });
  },

  render(){
    const line = this.lines[this.idx];
    if(!line){ this.finish(); return; }
    const [who, text] = line;
    const nameEl = $('dlgName');
    if(who === 'g'){ nameEl.textContent = '客人'; nameEl.classList.remove('me'); }
    else { nameEl.textContent = '店主'; nameEl.classList.add('me'); }

    this.full = text;
    this.charIdx = 0;
    this.typing = true;
    $('dlgNext').style.opacity = '0';
    $('dlgText').textContent = '';

    clearInterval(this.timer);
    this.timer = setInterval(()=>{
      this.charIdx++;
      /* PATCH v19 逐字说话音效：时长与整句文本长度相关 */
      if(window.Sfx && this.full){
        var ch = this.full.charAt(this.charIdx - 1);
        if(ch && !/[\s，。！？、；：""''《》（）…—]/.test(ch)){
          Sfx.speak(this.full, this.charIdx);
        }
      }
      $('dlgText').textContent = this.full.slice(0, this.charIdx);
      if(this.charIdx >= this.full.length){
        clearInterval(this.timer);
        this.typing = false;
        $('dlgNext').style.opacity = '1';
      }
    }, 28);
  },

  advance(){
    if(this.typing){
      clearInterval(this.timer);
      this.typing = false;
      $('dlgText').textContent = this.full;
      $('dlgNext').style.opacity = '1';
      /* 跳过打字机时，补一段与整句长度相符的电子音 */
      if(window.Sfx && this.full) Sfx.speakAll(this.full);
      return;
    }
    this.idx++;
    if(this.idx >= this.lines.length){ this.finish(); return; }
    this.render();
  },

  finish(){
    clearInterval(this.timer);
    $('dlg').classList.remove('on');
    const r = this.resolve;
    this.resolve = null;
    if(r) r();
  }
};

function pickStory(){
  const pool = (window.STORIES || []).filter(s => !Game.usedStories.includes(s.id));
  const list = pool.length ? pool : (window.STORIES || []);
  if(!list.length) return null;
  const s = list[rnd(list.length)];
  Game.usedStories.push(s.id);
  if(Game.usedStories.length > 40) Game.usedStories.shift();
  if(!Game.seenStories) Game.seenStories = [];
  if(!Game.seenStories.includes(s.id)) Game.seenStories.push(s.id);
  return s;
}

/* ------------------------- 12. 契合度判定 ------------------------- */
function judge(track, story){
  const wants = story.wants || {};
  let score = 0;
  const genreHit = (wants.genres||[]).includes(track.genre);
  if(genreHit) score += 2;
  let moodHits = 0;
  (wants.moods||[]).forEach(m => { if(track.moods.includes(m)) moodHits++; });
  score += moodHits;

  let result;
  if(score >= 3) result = 'good';
  else if(score >= 1) result = 'ok';
  else result = 'bad';
  return { result, score, genreHit, moodHits };
}

/* PATCH v10 可视化 */
function hexA(hex, a){
  const hh = hex.replace('#','');
  const r = parseInt(hh.substr(0,2), 16);
  const g = parseInt(hh.substr(2,2), 16);
  const b = parseInt(hh.substr(4,2), 16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
}
function drawViz(track){
  var c = document.getElementById('viz');
  if(!c) return;
  var ctx = c.getContext('2d');
  if(!c.width){ c.width = Math.floor(window.innerWidth * 0.6); c.height = Math.floor(window.innerHeight * 0.6); }
  var w = c.width, hh = c.height;
  ctx.fillStyle = 'rgba(10,6,18,0.26)';
  ctx.fillRect(0, 0, w, hh);
  var vol = 0.35;
  if(AudioEngine.analyser && AudioEngine.freq){
    AudioEngine.analyser.getByteFrequencyData(AudioEngine.freq);
    var sum = 0;
    for(var i=0;i<32;i++) sum += AudioEngine.freq[i];
    vol = clamp(sum / (32*255), 0.1, 1);
  }
  var t = performance.now() / 1000;
  var cx = w/2, cy = hh*0.40;
  var c1 = (track && track.colors[0]) || '#ff2e88';
  var c2 = (track && track.colors[1]) || '#5fe8ff';
  for(var k=0;k<5;k++){
    var p = ((t*0.32 + k*0.2) % 1);
    var radius = p * Math.max(w,hh) * 0.75;
    var alpha = (1-p) * (0.16 + vol*0.42);
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI*2);
    ctx.strokeStyle = k%2 ? hexA(c1, alpha) : hexA(c2, alpha);
    ctx.lineWidth = 2 + vol*14;
    ctx.stroke();
  }
  if(AudioEngine.freq){
    var n = 40, bw = w / n;
    for(var j=0;j<n;j++){
      var v = AudioEngine.freq[j*2] / 255;
      var bh = v * hh * 0.22;
      ctx.fillStyle = hexA(c1, 0.55);
      ctx.fillRect(j*bw + bw*0.18, hh - bh - hh*0.06, bw*0.64, bh);
    }
  }
}

/* ── v31 修复：走路/转身动画必须防"客人中途被撤下" ──
   ── 原 bug（真实崩溃）──
   walkTo / tweenRot 直接在 requestAnimationFrame 回调里读
   `guestGroup.position`。而 abortGameSession() 第 5 步会把
   guestGroup 置为 null（"撤掉台上还站着的客人"）。
   如果玩家在客人**正走进来时**点了「暂停 → 返回主菜单」
   （或清档、或点开始游戏触发 abortGameSession），
   下一帧就会抛：
       TypeError: Cannot read properties of null (reading 'position')
   更糟的是它不是"只是一条报错"：RAF 循环被异常打断后
   resolve() 永远不会被调用 → spawnGuest 的 await 永久挂起 →
   serveOneGuest → runOneDay → gameLoop **整条协程链死锁**。
   玩家看到的就是"点了开始游戏却一直没有进入第二天"。
   ── 修法 ──
    · 捕获一个本地引用 g，并在每帧开头判空
    · 一旦发现目标已消失，立刻 resolve() 让调用方继续走下去
      （调用方紧接着的 if(Game.abort) return 会干净退栈） */
function walkTo(tx, tz, dur){
  return new Promise(resolve => {
    const g = guestGroup;
    if(!g){ resolve(); return; }
    const sx = g.position.x, sz = g.position.z;
    const t0 = performance.now();
    const step = () => {
      /* 每一帧都要重新确认：guestGroup 可能已被 abortGameSession 撤掉，
         也可能被下一次 spawnGuest 换成了新对象。两种都不该继续动。 */
      if(!guestGroup || guestGroup !== g){ resolve(); return; }
      const p = clamp((performance.now()-t0)/dur, 0, 1);
      const e = p<0.5 ? 2*p*p : 1-Math.pow(-2*p+2,2)/2;
      g.position.x = sx + (tx-sx)*e;
      g.position.z = sz + (tz-sz)*e;
      // 走路摆动
      const sw = Math.sin(performance.now()/110) * 0.35 * (1-p);
      const u = g.userData;
      if(u.legL){ u.legL.rotation.x = sw; u.legR.rotation.x = -sw; }
      if(u.armL){ u.armL.rotation.x = -sw*0.7; u.armR.rotation.x = sw*0.7; }
      if(p < 1) requestAnimationFrame(step);
      else {
        if(u.legL){ u.legL.rotation.x = 0; u.legR.rotation.x = 0; }
        if(u.armL){ u.armL.rotation.x = 0; u.armR.rotation.x = 0; }
        resolve();
      }
    };
    step();
  });
}

function tweenRot(obj, from, to, dur){
  return new Promise(resolve => {
    /* 同 walkTo：obj 可能是 guestGroup，而它随时可能被撤下 */
    if(!obj){ resolve(); return; }
    const t0 = performance.now();
    const step = () => {
      if(!obj || (obj === guestGroup && !guestGroup)){ resolve(); return; }
      const p = clamp((performance.now()-t0)/dur, 0, 1);
      obj.rotation.y = from + (to-from) * (1-Math.pow(1-p,3));
      if(p<1) requestAnimationFrame(step); else resolve();
    };
    step();
  });
}

async function guestLeave(){
  if(!guestGroup) return;
  await tweenRot(guestGroup, 0, Math.PI/2, 380);
  await walkTo(4.6, 0.15, 1200);
  shopScene.remove(guestGroup);
  guestGroup = null;
}

  var hudVal = document.getElementById('hudRevenueVal');
  if(hudVal){

  if(!resuming){

  $('pauseBtn').classList.add('on');

  for(let i = Game.guestsToday; i < maxGuests; i++){
    if(dead()) return;
    /* v21：记录"正在服务第几位客人"+成交是否已落定。
       中途返回主菜单时，若这位客人已经成交（金币/库存已扣），
       就把她算作已服务，避免重新接待时二次计价。 */
    Game._curGuest = i;
    Game._curGuestDone = false;
    save();
    await serveOneGuest(stories[i] || null);
    /* v31.1：这里原本只看 Game.abort。但"清档后立刻重启"会在同一个同步块里
       把 Game.abort 复位成 false，于是旧协程恢复执行时看到的是 false，
       于是它继续往下跑完整套接待（给已经不存在的局面发钱/扣库存）。
       改成 dead() 后，只要会话令牌变了就无条件退栈。 */
    if(dead()){
      if(Game._curGuestDone){ Game.guestsToday = i + 1; }
      Game._curGuest = -1;
      Game._curGuestDone = false;
      save();
      return;
    }
    Game._curGuestDone = false;
    Game._curGuest = -1;
    Game.guestsToday = i + 1;
    save();
    checkAchievements();
    if(dead()) return;
    await wait(300);
  }

  $('pauseBtn').classList.remove('on');

  /* 当天所有客人服务完毕 → 清掉"进行中"标记，避免下次重进时误续跑 */
  Game._dayInProgress = false;
  /* v31.2：新的一天进入日终流程，解除 finishDayAndLeave() 的一次性锁。
     不清的话，玩家第二次走到结算页时那个「返回主菜单」会被静默吞掉。 */
  Game._dayEndLeft = false;
  save();

  if(dead()) return;
  await reportScreen();
  if(dead()) return;

  /* v31 修复：护符只保一局，必须真的销毁。
     ── 为什么消费点在这里（报告之后、店铺管理之前）──
     护符是在第 N 天的店铺管理里买下的，第 N+1 天抽卡时生效、
     接待客人时产生效果，日结报告里显示"已生效"。

     店铺管理时会看到护符重新变成"买下"，也就是"第二天要重新买"。

     那一段在玩家中途 abort 时不会被执行，而 abort 恰恰是最容易

  consumeTalismans();
  save();
  /* 护符使用次数会推动成就 a17「护符常客」，所以消费后要立刻判一次 */
  checkAchievements();
  if(dead()) return;

  await shopManageScreen();
  if(dead()) return;

  Game.day++;
  Game._dayInProgress = false;
  save();
  checkAchievements();

async function serveOneGuest(story){

    story = pool[rnd(pool.length)];
  }

  const myGen = currentSessionGen();

  /* v31：教程阶段被「跳过」时也要立刻退栈。
     _aborted 与 Game.abort 的区别：前者只结束"教程这一段"，
     后者是整局会话作废。跳过教程后 serveOneGuest 必须干净返回，
     否则它会在教程清场之后继续跑一整套接待（还会发金币）。 */
  if(dead()) return;
  /* v30 教程：客人进门时挂出教练条与需求面板。
     这三处 if(Tutorial.active) 是教程与正片之间**唯一**的耦合点，
     教程未激活时它们不产生任何行为变化。
     这里 await 是必要的：guestEnter() 内部要给"开场欢迎语"留出阅读时间，
     否则它会立刻被"听对话"的提示覆盖掉（玩家一个字都没看清）。 */
  if(Tutorial.active) await Tutorial.guestEnter();
  if(dead()) return;
  await Dialogue.play(story.lines);
  if(dead()) return;

  let chosen = null, j = null;
  while(!chosen){
    if(dead()) return;
    if(Tutorial.active) Tutorial.beforeInventory();

    /* v28：null = 会话被作废（清空存档 / 回主菜单），干净退栈。

    if(track === null || track === undefined) return;
    if(dead()) return;

       RecView.cancel() 把 action 解成 'abort'，但旧协程要等微任务恢复才检查。
       如果这期间新会话已经把 Game.abort 复位，`action !== 'give'` 分支里的

    if(action !== 'give'){ if(dead()) return; continue; }

    /* v30 教程：交错了**不消耗唱片**，先讲清楚为什么不对，再让玩家重来一次。

       只在教程里做 —— 正片里"交错"是有代价的，那才是玩法。 */
    if(Tutorial.active && j.result === 'bad' && !Tutorial._retried){
      Tutorial._retried = true;

    }

    if(dead()) return;

       · 删掉 decorMult()/shopMult()（旧经济的两个来源），换成唯一的 themeMult()
       · 新增金边加成 goldMult()（只有这张唱片是金边才有）
       · 新增黄护符加成：直接内联为 `hasTal('amber') ? AMBER_MULT : 1`

           一个名字直白的函数反而更容易被随手复用到别处、

     相乘顺序不影响结果（都是乘法），但**四舍五入只做最后一次**，

  const tMult = themeMult();

     故意交烂片的收益越高，玩法会被带偏。 */
  const bluePaid = (j.result === 'bad' && hasTal('blue'));
  if(bluePaid) price = BLUE_PAY;
  const goldHit = isGold(chosen) && j.result !== 'bad';

  const idx = Game.inventory.indexOf(chosen.id);
  if(idx >= 0) Game.inventory.splice(idx, 1);

  Game.daySoldList.push({ track:chosen, result:j.result, price:price, gold:isGold(chosen) });
  if(price > 0){
    Game.coins += price;
    var _hrv = document.getElementById('hudRevenueVal');
    if(_hrv){ var _t=0; for(var _i=0;_i<Game.daySoldList.length;_i++) _t += Game.daySoldList[_i].price; _hrv.textContent = '+' + _t; }
    Game.dayIncome += price;
    Game.stats.income += price;
    Game.stats.sold++;
  }
  if(goldHit) Game.goldSold = (Game.goldSold || 0) + 1;
  if(j.result === 'good'){
    Game.stats.good++; Game._dayGood++; Game.repGood++;
    if(!Game.goodStories) Game.goodStories = [];
    if(Game.goodStories.indexOf(story.id) < 0) Game.goodStories.push(story.id);
  }
  else if(j.result === 'ok'){ Game.stats.ok++; }
  else { Game.stats.bad++; Game.repBad++; }

  Game.stats.served++;
  if(chosen.rarity >= 3 && j.result !== 'bad') Game._rareSold = (Game._rareSold||0) + 1;
  if(price >= 300) Game._bigSale = true;
  chosen.moods.forEach(function(m){ Game._dayMoods.add(m); });

  /* v21：到此为止这位客人的交易已经全部落定（金币已加、库存已扣、统计已记）。
     这段全是同步代码，中途不会被打断，所以在这里打标记是原子的。
     若之后玩家中途返回主菜单，runOneDay 会据此把这位客人计为"已服务"。 */
  Game._curGuestDone = true;

  const endingText = story.endings[j.result];
  await Dialogue.play([['g', endingText]]);

  /* v19：成交结果音效 */
  if(window.Sfx){
    if(j.result === 'good') Sfx.success();
    else if(j.result === 'ok') Sfx.coin();
    else Sfx.fail();
  }

  const icon = j.result === 'good' ? '💖' : (j.result === 'ok' ? '🙂' : '💔');
  let title = j.result === 'good' ? '非常满意' : (j.result === 'ok' ? '还算满意' : '被拒绝了');
  /* v30：金边成交要显式说出来，否则玩家不会把"多出来的钱"归因到金边 */
  if(goldHit && j.result === 'good') title = '非常满意 · 金边';
  const sub = j.result === 'bad' ? '客人失落地离开了，但故事还在。' :
              (j.result === 'good' ? '你找到了那个声音。' : '嗯，还不错。');

       蓝护符的安慰金要单独说明（玩家会疑惑"不满意为什么还给钱"），

/* PATCH v12 进货配平（v30 重做三档进货）
   ── 配平条件为什么要分两套 ──
   基线（good>=2 && nonBad>=3）是"每天都有牌可打"的宽松保证，实测天然命中率
   26.78%（见 tools/econ-calib.js），所以普通进货几乎一次就中。
   绿护符承诺更强："店内唱片有可能让所有人满意" —— 必须存在一种分配使
   5 位客人**全部不落空**（nonBad === 5）。实测单次命中只有 34.15%，
   所以要重抽（平均 4.9 次，上限 300 次内命中率 100%）。
   两套条件共用同一个"最优一对一分配"搜索，避免各写一份走样。 */
function permute5(){
  const result = [];
  const perm = [];
  const used = [false, false, false, false, false];
  function bt(){
    if(perm.length === 5){ result.push(perm.slice()); return; }
    for(let i = 0; i < 5; i++){
      if(used[i]) continue;
      used[i] = true;
      perm.push(i);
      bt();
      perm.pop();
      used[i] = false;
    }
  }
  bt();
  return result;
}
const ALL_PERMS = permute5();

/* 在库存里搜最优一对一分配，返回 {good, nonBad}。
   库存可能多于 5 张（精选/稀有给 6 张），所以从全库里选 5 张配对。 */
function bestMatch(inventory, stories){
  const n = inventory.length, m = Math.min(5, stories.length);
  const R = [];
  for(let i = 0; i < m; i++){
    const row = [];
    for(let j = 0; j < n; j++){
      /* v31.3：必须走 getTrackById()，不能直接查 TRACK_BY_ID。
         动态专辑（id 形如 's2000123'）不在 TRACK_BY_ID 里，
         只有 getTrackById 会按 seed 现场重建它们。
         用 TRACK_BY_ID 的话 t 是 undefined → 一律判 'bad'，
         于是"配平检查"会把每一批含动态专辑的进货都误判成配不出好牌，
         轻则白重抽 400 次、重则整批货都是烂的。 */
      const t = getTrackById(inventory[j]);
      row.push(t ? judge(t, stories[i]).result : 'bad');
    }
    R.push(row);
  }
  let bestGood = 0, bestNonBad = 0;
  const used = new Array(n).fill(false);
  let cg = 0, cn = 0;
  function dfs(i){
    if(i === m){
      if(cg > bestGood || (cg === bestGood && cn > bestNonBad)){ bestGood = cg; bestNonBad = cn; }
      return;
    }
    for(let j = 0; j < n; j++){
      if(used[j]) continue;
      used[j] = true;
      const r = R[i][j];
      const g = r === 'good' ? 1 : 0, nb = r === 'bad' ? 0 : 1;
      cg += g; cn += nb;
      dfs(i + 1);
      cg -= g; cn -= nb;
      used[j] = false;
    }
  }
  dfs(0);
  return { good: bestGood, nonBad: bestNonBad };
}
function checkMatch(inventory, stories){
  const q = bestMatch(inventory, stories);
  return q.good >= 2 && q.nonBad >= 3;
}
/* 绿护符的强条件：存在一种分配让 5 位客人全部不落空 */
function checkAllServe(inventory, stories){
  if(stories.length < 5) return false;
  return bestMatch(inventory, stories).nonBad === 5;
}

     rare  250 金币   随机 6 张，**必定含 1 张金边**，金边概率最高
   金边与稀有度正交：一张普通唱片也可能是金边（见 7.3）。
   金边概率给在"张"上而不是"批次"上，这样 6 张的批次自然更容易出金边，

const NEW_TRACK_SEED_BASE = 2000000;      /* 与固定曲库的 seed（7777+i*7919）错开，避免撞 id */

   为什么不能只用 seenTracks（那一张表存的是 id）——
   id 与名字不是双射：两张**不同 id** 的专辑完全可能同名
   （实测 350 张撞 1.3 组）。要保证玩家不看到重名，
   必须按**名字**去重，而不只是按 id 去重。
   ── 为什么不把名字也直接存进存档 ──
   名字是 seed 的纯函数，任何一个已见过的 id 都能还原出它当时的名字，
   所以这张表可以现场推导，不必进存档（也不会因为改名而失效）。
   ── 性能 ──
   drawBatch 每次进货最多被调 400 次，每次都重建这张表会很浪费。
   所以加一个"增量缓存"：记住上次同步的是**哪个 Set 对象**、同步到多少个 id，
   之后只处理新增部分。
   ── v31.5 修正：缓存失效必须看"对象身份"，不能只看 size ──
   旧实现只在 `seen.size < _seenNameCacheLen` 时重建。这是错的：
   load() 会用 `new Set(...)` 换掉 Game.seenTracks，
   若新 Set 恰好与旧 Set **size 相同**（存档里张数没变，
   例如"第 5 天 8 张"的存档覆盖了内存里另一个"8 张"的集合），
   旧实现会认为"没变化"直接返回缓存 —— 缓存里装的是**上一个 Set** 的名字，
   于是本局会把已经发过的名字当成没用过，重新发一遍 → 玩家看到重名。
   现在改为按 Set 对象身份比对：只要不是同一个对象，无条件重建。
   增量优化保留（同一个 Set 只是长大时仍走"只处理新增"的快路径）。 */
let _seenNameCache = new Set();
let _seenNameCacheLen = 0;
let _seenNameCacheSet = null;      /* 上次同步的 Set 对象（身份比对用） */
function seenNamesFromSeenTracks(seen){
  if(!(seen instanceof Set)){
    _seenNameCache = new Set(); _seenNameCacheLen = 0; _seenNameCacheSet = null;
    return new Set();
  }
  /* 换了对象（读档/清档/新局）→ 缓存整份作废重建。
     这一步必须用身份判断：size 相同不代表内容相同。 */
  if(seen !== _seenNameCacheSet){
    _seenNameCache = new Set(); _seenNameCacheLen = 0; _seenNameCacheSet = seen;
  } else if(seen.size < _seenNameCacheLen){
    /* 同一个对象却被清空过（seen.clear()）→ 同样作废 */
    _seenNameCache = new Set(); _seenNameCacheLen = 0;
  }
  if(seen.size === _seenNameCacheLen) return _seenNameCache;
  let n = 0;
  seen.forEach(function(id){
    if(n++ < _seenNameCacheLen) return;       /* 跳过已经处理过的 */
    const nm = nameForId(String(id));
    if(nm) _seenNameCache.add(nm);
  });
  _seenNameCacheLen = seen.size;
  return _seenNameCache;
}
window.seenNamesFromSeenTracks = seenNamesFromSeenTracks;

/* 只取名字，不构造完整唱片对象 —— 固定曲库直接读表，
   动态专辑只需算 trackNameFrom（不跑 composeTrack 等重活）。 */
function nameForId(id){
  const s = String(id);
  const t = TRACK_BY_ID[s];
  if(t) return t.name;
  if(s.charAt(0) === 's'){
    const sd = parseInt(s.slice(1), 10);
    if(!isNaN(sd)) return trackNameFrom(sd);
  }
  return null;
}
window.nameForId = nameForId;

function drawBatch(size, goldChance, guarantee){
  const ids = [], goldIdx = [];
  const picked = new Set();
  const seen = (typeof Game !== 'undefined' && Game && Game.seenTracks instanceof Set)
    ? Game.seenTracks : new Set();
  /* 已用过的名字（只读，共享缓存）—— 这是"不重名"的真正判据。
     注意不能直接往它里面 add：它是跨调用共享的缓存，
     污染了会让"新增了哪些名字"的增量判断失去意义。
     所以本批次新增的名字放进另一个小集合 batchNames，两边一起查。 */
  const usedNames = seenNamesFromSeenTracks(seen);
  const batchNames = new Set();
  function nameTaken(nm){ return usedNames.has(nm) || batchNames.has(nm); }
  /* 当前库存里的唱片也要避开：结转之后玩家手里可能还留着昨天的货，
     今天再发一张同名的，玩家在库存界面就会看到两个一样的名字。 */
  const held = new Set((Game.inventory || []).map(String));
  (Game.inventory || []).forEach(function(id){
    const nm = nameForId(id);
    if(nm) batchNames.add(nm);
  });

  /* 1) 先从未出现过的固定曲库里抽 —— 优先用"造好"的那 100 张。
     同时按"名字没用过"过滤：固定曲库建库时已经内部避让过，
     但它可能与动态生成的专辑撞名，所以这里再过一遍。
     ── v31.5 修正：seenTracks / held 里存的都是 String(id)，
        而 TRACKS[i].id 是 **number**（见 TRACKS 构造：id:i）。
        `seen.has(t.id)` 拿 number 去查字符串集合**永远返回 false**，
        所以这一条过滤此前实际是失效的（靠下面 nameTaken 兜住了，
        因为固定曲库名字唯一，按名字查等价）。
        但"靠巧合成立"是隐患：将来若出现两张同名不同 id 的固定唱片，
        或 seenTracks 的写入端改成 number，就会漏。
        统一成 String(id) 查询，语义就与写入端严格对齐了。 */
  const pool = TRACKS.filter(t => !seen.has(String(t.id)) && !held.has(String(t.id))
    && !picked.has(t.id) && !nameTaken(t.name));
  /* 洗牌后取前 size 张（随机但不是纯随机：保证不重复、且避开已用过的） */
  for (let i = pool.length - 1; i > 0; i--) {
    const j = rnd(i + 1);
    const tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
  }
  for (let i = 0; i < pool.length && ids.length < size; i++) {
    picked.add(pool[i].id);
    ids.push(pool[i].id);
    batchNames.add(pool[i].name);          /* 同批次内也不许重名 */
    if (Math.random() < goldChance) goldIdx.push(ids.length - 1);
  }

  /* 2) 固定曲库用光了 → 现场按 seed 生成新专辑（这就是"接近无限"的来源）。
     关键是 seedWithFreshName：先按名字避让挑一个 seed，再生成。
     这样 id ↔ 名字的映射依然是纯函数，但实际发出的名字互不相同。 */
  let guard = 0;
  while (ids.length < size && guard++ < 400) {
    const baseSeed = NEW_TRACK_SEED_BASE + (Game.day || 1) * 100000 + (_newTrackSeq++);
    const seed = seedWithFreshName(baseSeed, avoidSet(usedNames, batchNames));
    const t = generateTrackFromSeed(seed);
    if (!t) continue;
    if (picked.has(t.id) || seen.has(String(t.id)) || held.has(String(t.id))) continue;
    if (nameTaken(t.name)) continue;   /* 避让失败（极端）→ 换下一个 seed */
    picked.add(t.id);
    ids.push(t.id);
    batchNames.add(t.name);
    if (Math.random() < goldChance) goldIdx.push(ids.length - 1);
  }

  if (guarantee && goldIdx.length === 0 && ids.length) {
    goldIdx.push(rnd(ids.length));
  }
  return { ids: ids, goldIdx: goldIdx };
}

/* 把两个集合并成一个"查得到就行"的视图，供 seedWithFreshName 使用。
   只在 batchNames 非空时才真合并 —— 常见情况（没带库存）直接返回原集合，
   省掉一次拷贝。 */
function avoidSet(usedNames, batchNames){
  if(!batchNames || batchNames.size === 0) return usedNames;
  const merged = new Set(usedNames);
  batchNames.forEach(function(n){ merged.add(n); });
  return merged;
}

/* 把"这一批已经发给玩家的专辑"登记进 seenTracks，下次进货不再发。 */
function markTracksSeen(idList){
  if (!(Game.seenTracks instanceof Set)) Game.seenTracks = new Set();
  (idList || []).forEach(function (id) { if (id !== undefined && id !== null) Game.seenTracks.add(String(id)); });
}
window.markTracksSeen = markTracksSeen;

/* ── v31.5：每日清空库存，再抽卡录入 ──
   ── 玩家的要求（推翻了 v31.4 的跨天结转）──
   「建议修改为每天开始前都清空一次库存，再抽卡录入新库存。
     实际上每天开始游戏抽取的库存最多只有 6 张，我遇到了卡 bug 卡出 11 张 12 张的情况」
   ── 为什么删掉结转 ──
   v31.4 我按"存货应该保留"的理解做了跨天结转，但引入了两个真问题：
   1) 第 1 天库存里有 loadDefaults() 送的 6 张开局唱片，再 +5 = 11 张，
      正好就是玩家看到的"11 张 12 张"；跳过教程与不跳过教程两条路径
      拿到的张数还不一样。
   2) 结转上限 INV_CAP=12 与新品叠加后，库存张数变成"看历史"而不是
      "看今天进了什么"，玩家无法预期自己手上该有几张牌。
   现在改为无状态设计：每天进货 = 清空旧库存 + 录入本批新货。
   单日库存张数 === 本批进货张数（normal 5 / fine 6 / rare 6），恒定可预期。
   ── 顺带的硬保证 ──
   下面 stockScreen() 末尾用 sanitizeInventory() 再做一次防御性截断，
   任何路径（存档被改、旧存档遗留、未来改动引入的叠加）都不可能让
   单日库存超过本批进货张数。 */
/* 防御性净化：去重 + 丢弃明显非法项 + 截断到 maxCount。
   ── 它真正保证的两条不变量（也是唯一的价值）──
     1) 去重：同一个 id 只保留一张 —— 库存里绝不会出现两张同款唱片。
     2) 截断：长度不超过 maxCount（= 本批进货张数）。
   ── 关于"丢弃解析不出的 id" ──
   null / undefined / 空串这类会被下面的守卫丢掉。
   但要注意 getTrackById('s<任意数字>') 是**永远能解析成功**的
   （动态生成器按设计就是"给个 seed 就还原出一张专辑"），
   所以"解析失败"这条路几乎不会触发。这不影响上面两条不变量成立，
   守卫留着是为了 getTrackById 将来若收紧语义时仍能防御。 */
function sanitizeInventory(list, maxCount){
  const out = []; const seen = new Set();
  (list || []).forEach(function(id){
    if(id === undefined || id === null) return;
    const key = String(id);
    if(key === '') return;
    if(seen.has(key)) return;                 /* 重复 id 只留一张 */
    if(!getTrackById(key)) return;            /* 解析不出来的脏数据丢掉 */
    seen.add(key); out.push(key);
  });
  if(maxCount > 0 && out.length > maxCount) out.length = maxCount;
  return out;
}
window.sanitizeInventory = sanitizeInventory;

function stockScreen(){
  /* v31.1：进货弹窗是"清档后立刻重启"最容易撞上的 await 点 ——
     玩家很可能就停在「今日进货」这个弹窗上，此时从设置里清档。
     旧会话的弹窗 Promise 不会被 abortGameSession 解掉（modal 不在解挂清单里），
     一旦它稍后 resolve（例如玩家点到残留按钮），回调会照常执行：
     扣金币、覆盖 Game.inventory、把旧的一批故事塞进新局。
     所以回调进来先核对自己的会话令牌，不是自己的会话就整段放弃。 */
  const myGen = currentSessionGen();
  return new Promise(resolve => {
    const day = Game.day;
    const bal = '<b style="color:var(--gold)">' + Game.coins + '</b>';
    function row(id, disabled, extra){
      const r = RESTOCK[id];
      const note = r.note + (extra || '');
      return '<button data-val="' + id + '"' + (disabled ? ' disabled style="opacity:.4"' : '') + '>' +
        r.label + (r.cost ? ' · ' + r.cost + ' 金币' : ' · 免费') +
        '<br><span style="font-size:11px;opacity:.8">' + note + '</span></button>';
    }
    /* 金边唱片是 v30 的新东西，第 1 天直接在文案里点明"更好看、更值钱"，
       否则玩家抽到金边也不知道它意味着什么。 */
    const goldTip = '<p style="font-size:11px;color:var(--gold);line-height:1.7;margin-bottom:14px">' +
      '★ 金边唱片：CD 带金黄包边，满足客人需求时给更多金币</p>';
    /* 护符生效提示：让玩家清楚知道"这一局我带了什么" */
    let talTip = '';
    if((Game.talismans || []).length){
      talTip = '<p style="font-size:11px;color:#7cf5a0;line-height:1.7;margin-bottom:14px">' +
        '本局护符：' + Game.talismans.map(function(id){
          const t = TAL_BY_ID[id]; return t ? t.name : '';
        }).filter(Boolean).join(' · ') + '</p>';
    }
    const html = '<h3>今日进货</h3><p>第 ' + day + ' 天 · 金币 ' + bal + '</p>' + goldTip + talTip +
      row('normal', false) + row('fine', false) + row('rare', false);
    modal(html).then(async val => {
      /* v31.1：会话已被换掉 → 这一批进货属于已经作废的局面，直接放弃。
         不做这一步的话，旧弹窗的回调会扣新局的金币、并把新局的库存
         覆盖成旧会话抽出来的那批唱片。 */
      if(Game.abort || sessionGen !== myGen){ resolve(); return; }
      if(!RESTOCK[val]) val = 'normal';
      let cfg = RESTOCK[val];
      /* 金币不足自动降级：不要因为一次误点就把玩家卡在"没进货"的状态 */
      if(Game.coins < cfg.cost){
        toast('金币不足，改为普通进货');
        cfg = RESTOCK.normal; val = 'normal';
      }
      Game.coins -= cfg.cost;
      if(cfg.cost){
        Game.dayExpense += cfg.cost;
        Game.stats.expense += cfg.cost;
      }

      /* ── v31.5：每日开始前先清空一次库存，再抽卡录入新库存 ──
         玩家的原话就是这个顺序，代码也照这个顺序写，不再有"隐含叠加"。
         在这一行之前，Game.inventory 里可能残留：
           · loadDefaults() 给的 6 张开局占位唱片；
           · 上一局读档带上来的旧货。
         先清空有两个实际作用：
           1) 语义直白 —— "今天的库存 = 今天抽到的这批"，没有历史包袱；
           2) drawBatch 会把 Game.inventory 里的 id 当作 held 排除掉，
              不清空的话这 6 张占位唱片会在第 1 天被"免费锁定"，
              玩家永远抽不到它们（真实的池子污染）。 */
      Game.inventory = [];
      if(!(Game.seenTracks instanceof Set)) Game.seenTracks = new Set();

      /* ── 循环抽取直到满足两个约束 ──
         1) 基线配平（每天都要有牌可打）
         2) 绿护符的强配平（若本局带了绿护符）
         第 2 条命中率只有 34%，所以循环上限要给足；仍失败则退而用第 1 条，
         并把绿护符标记为"已尽力"（不会崩，也不会卡住游戏）。
         v31.5：配平检查只看本批新货 —— 库存每天清空重建，
         玩家手上确实只有这一批，判定口径必须和玩家的实际牌面一致。 */
      const wantAllServe = hasTal('jade');
      const storyPoolMaster = (window.STORIES || []).slice();
      let finalInv = null, finalGold = [], finalStories = null;
      let allServeOk = !wantAllServe;
      for(let attempt = 0; attempt < 400; attempt++){
        const batch = drawBatch(cfg.count, cfg.goldChance, val === 'rare');
        /* 抽 5 个不重复故事 */
        const pool = storyPoolMaster.slice();
        const stories = [];
        for(let i = 0; i < 5 && pool.length > 0; i++){
          const idx = rnd(pool.length);
          stories.push(pool[idx]);
          pool.splice(idx, 1);
        }
        if(stories.length < 5) continue;
        const merged = batch.ids;
        const baseOk = checkMatch(merged, stories);
        if(!baseOk) continue;
        if(wantAllServe && !checkAllServe(merged, stories)){
          /* 强条件没中：先记住这批作为兜底，继续重抽 */
          if(!finalInv){ finalInv = batch.ids; finalGold = batch.goldIdx; finalStories = stories; }
          continue;
        }
        finalInv = batch.ids; finalGold = batch.goldIdx; finalStories = stories;
        allServeOk = true;
        break;
      }
      /* 兜底：连基线都没中（理论概率极低），随便发一批保证能玩 */
      if(!finalInv){
        const batch = drawBatch(cfg.count, cfg.goldChance, val === 'rare');
        finalInv = batch.ids; finalGold = batch.goldIdx;
        finalStories = [];
        const pool = storyPoolMaster.slice();
        for(let i = 0; i < 5; i++){ const idx = rnd(pool.length); finalStories.push(pool[idx]); pool.splice(idx,1); }
        allServeOk = false;
      }

      /* 应用金边标记。先清旧的：本局换了一批货，上一批的金边不该留。
         v31.5：库存每天清空重建，所以旧金边一律清掉，只标本批。 */
      clearGoldMarks();
      finalGold.forEach(function(i){
        const t = getTrackById(finalInv[i]);
        if(t) markGold(t);
      });

      /* ── v31.5：每日清空库存，再录入本批新货 ──
         直接赋值，不叠加。sanitizeInventory 再做一次防御性截断：
         去重 + 丢弃解析不出的脏 id + 截到本批张数上限。
         这样"单日库存张数 = 本批进货张数"是一条硬不变量，
         无论是新开游戏、重新开始、还是读旧存档，都不可能卡出 11/12 张。 */
      Game.inventory = sanitizeInventory(finalInv, cfg.count);
      Game.dayStories = finalStories;
      /* v31.3：把这一批发出去的专辑登记为"已出现"，
         下次进货就不会再抽到它们（玩家要的"几乎不见重复"）。 */
      markTracksSeen(Game.inventory);
      const drawn = finalInv.map(function(id){ return getTrackById(id); }).filter(Boolean);
      save();
      await showDrawScreen(drawn);
      if(wantAllServe && !allServeOk){
        toast('翠玉护符未能配出人人满意的牌面', 2400);
      }
      resolve();
    });
  });
}
function showDrawScreen(drawn){
  return new Promise(resolve => {
    let scr = $('scr-draw');
    if(!scr){
      scr = document.createElement('div');
      scr.id = 'scr-draw'; scr.className = 'screen';
      scr.innerHTML = '<div class="draw-bg"></div><div class="draw-header">今日进货</div><div class="draw-grid" id="drawGrid"></div><div class="draw-footer"><button class="draw-btn" id="drawDone" disabled>收入库存</button></div>';
      document.body.appendChild(scr);
    }
    const grid = $('drawGrid');
    const done = $('drawDone');
    grid.innerHTML = ''; done.disabled = true; done.textContent = '收入库存';
    /* v19：6 张（付费/广告进货）改用 3 列布局，保证小屏按钮可见 */
    grid.classList.toggle('n6', drawn.length > 5);
    done.onclick = () => { $('scr-draw').classList.remove('on'); resolve(); };
    drawn.forEach((t, i) => {
      const card = document.createElement('div');
      card.className = 'draw-card';
      const inner = document.createElement('div'); inner.className = 'draw-inner';
      const back = document.createElement('div'); back.className = 'draw-face draw-back'; back.innerHTML = '<span>?</span>';
      const front = document.createElement('div'); front.className = 'draw-face draw-front';
      front.style.backgroundImage = 'url(' + getCoverCanvas(t, 200).toDataURL('image/jpeg', 0.85) + ')';
      inner.appendChild(back); inner.appendChild(front); card.appendChild(inner);
      /* v30：金边用专属的 gold 光晕（比 r2/r3 更亮更金），
           并优先于稀有度光晕 —— 一张金边的 ★★★ 只会显示金光，
           否则两圈光叠在一起反而看不清"金"这个信息。 */
      if (isGold(t)) { const glow = document.createElement('div'); glow.className = 'draw-glow rg'; card.appendChild(glow); }
      else if (t.rarity >= 2) { const glow = document.createElement('div'); glow.className = 'draw-glow r' + t.rarity; card.appendChild(glow); }
      grid.appendChild(card);
      setTimeout(() => { card.classList.add('flipped'); if(window.Sfx && Sfx.flip) Sfx.flip(i); }, 400 + i * 250);
    });
    setTimeout(() => { done.disabled = false; }, 400 + drawn.length * 250 + 200);
    /* PATCH v05b */ scr.classList.add('on');
  });
}
/* ------------------------- 18. 日结报告 ------------------------- */
function reportScreen(){
  return new Promise(resolve => {
    const good = Game.daySoldList.filter(function(x){return x.result==='good'}).length;
    const total = Game.daySoldList.length;
    if(good === 5 && total === 5) Game._perfectDay = true;
    const perfect = (good === 5 && total === 5);

    /* 今日收藏列表 */
    let colRows = '';
    var dayCol = Game.dayCollected || [];
    if(dayCol.length){
      colRows = dayCol.map(function(tid){
        var t = getTrackById(tid);
        if(!t) return '';
        return '<div class="rep-row rep-anim" style="animation-delay:.5s"><span>《' + t.name + '》</span><b style="color:var(--gold)">' + t.genre + '</b></div>';
      }).join('');
    } else {
      colRows = '<div style="color:var(--muted);font-size:13px;padding:12px 0;text-align:center">今日未收藏任何唱片</div>';
    }

    /* v30：今日售出明细 —— 把"这一天卖了什么、卖了多少钱"摊开。
       结算页原本只有一个总数，玩家看不出金币从哪来；加了明细之后
       "金边唱片确实更值钱"这件事才有地方可以被验证。 */
    let soldRows = '';
    if((Game.daySoldList || []).length){
      soldRows = Game.daySoldList.map(function(x, i){
        const nm = (x.track && x.track.name) ? x.track.name : '—';
        const ic = x.result === 'good' ? '💖' : (x.result === 'ok' ? '🙂' : '💔');
        const tag = x.gold ? ' <b style="color:var(--gold)">金边</b>' : '';
        const pay = x.price > 0
          ? '<b style="color:var(--gold)">+' + x.price + '</b>'
          : '<b style="color:var(--muted)">0</b>';
        return '<div class="rep-row rep-anim" style="animation-delay:' + (0.52 + i * 0.06).toFixed(2) + 's">' +
          '<span>' + ic + ' 《' + nm + '》' + tag + '</span>' + pay + '</div>';
      }).join('');
    } else {
      soldRows = '<div style="color:var(--muted);font-size:13px;padding:12px 0;text-align:center">今天没有成交</div>';
    }

    /* v30：护符结算提示。护符买了就一定会被消耗，所以要说清楚"它起作用了吗"。 */
    let talRows = '';
    if((Game.talismans || []).length){
      talRows = '<div class="sep"></div><div class="h-sec">本局护符</div>' +
        Game.talismans.map(function(id){
          const t = TAL_BY_ID[id];
          return t ? '<div class="rep-row rep-anim"><span>' + t.name + '</span><b style="color:#7cf5a0">已生效</b></div>' : '';
        }).join('');
    }

    /* v31 修复：结算页不走 showScreen()（它是直接 classList.add('on')），
       所以拿不到 hookShowScreen() 的那把锁。这很危险 —— 结算页是
       "客人告别弹窗 → 页面整体换掉"的落点，正好接着一串连点。
       表现为：结算页刚出现，玩家最后那一下 click 已经落在
       #repNext（"进入店铺管理"）上了，于是直接跳过了看营业额。
       这里补一把同款的锁。 */
    lockInput(INPUT_LOCK_MS);
    $('scr-report').classList.add('on');
    $('scr-report').innerHTML = `
      <div class="rep-burst"></div>
      <div class="rep-sweep"><i></i></div>
      <div class="topbar"><h2>第 ${Game.day} 天 · 营业结束</h2></div>
      <div class="body-scroll">
        <div style="text-align:center;padding:28px 0 18px;position:relative;z-index:2">
          <div class="rep-head" style="font-size:11px;letter-spacing:.3em;color:var(--muted);margin-bottom:8px">TODAY REVENUE</div>
          <div class="rep-num" id="repIncome" style="font-size:56px;font-weight:900;font-style:italic;color:var(--gold);text-shadow:3px 3px 0 rgba(255,209,102,.25);line-height:1">+0</div>
          <div class="rep-lbl" style="font-size:11.5px;color:var(--muted);letter-spacing:.2em;margin-top:10px">今日营业额 · 金币</div>
          ${perfect ? '<div class="rep-perfect" style="margin-top:14px;font-size:13.5px;font-weight:900;letter-spacing:.22em;color:var(--gold)">✦ 完美的一天 ✦</div>' : ''}
        </div>
        <div class="sep"></div>
        <div class="h-sec rep-anim" style="animation-delay:.44s">今日成交</div>
        ${soldRows}
        <div class="sep"></div>
        <div class="h-sec rep-anim" style="animation-delay:.48s">今日收藏</div>
        ${colRows}
        ${talRows}
        <div class="sep"></div>
        <div class="rep-pop" style="display:flex;gap:16px;justify-content:center;font-size:12px;color:var(--muted);padding:10px 0;animation-delay:.6s">
          <span>💖 满意 <b style="color:var(--magenta)">${good}</b></span>
          <span>📀 售出 <b style="color:var(--cyan)">${total}</b></span>
          <span>💰 余额 <b style="color:var(--gold)">${Game.coins}</b></span>
        </div>
        <button class="menu-item rep-pop" style="width:100%;margin-top:24px;animation-delay:.7s" id="repNext"><span class="idx">→</span><span class="tx">进入店铺管理</span></button>
        <button class="menu-item gd rep-pop" style="width:100%;margin-top:10px;animation-delay:.76s" id="repHome"><span class="idx">🏠</span><span class="tx">返回主菜单</span></button>
      </div>
    `;

    /* 特效与音效：数字滚动 + 结算旋律。
       两者同时起，节奏上"数字滚完刚好听到落袋那一下"。
       为什么要等 120ms：先让弹入动画（repBurst / repNumIn）起来，
       音效再进，否则视觉和听觉同时"炸"在 0ms 反而糊成一团。 */
    if(window.rollNumber){
      setTimeout(function(){
        rollNumber($('repIncome'), Game.dayIncome, 760);
      }, 160);
    }
    if(window.sfxSettle){
      setTimeout(function(){ sfxSettle(good); }, 120);
    }

    $('repNext').onclick = function(){
      $('scr-report').classList.remove('on');
      resetReportFx();
      resolve();
    };

    /* v31.2：结算页的「返回主菜单」。
       走 finishDayAndLeave()（先收尾这一天再离开），
       不是直接 leaveGameSession() —— 否则玩家能靠"结算页退出→继续游戏"
       反复重玩同一天刷金币。详见 finishDayAndLeave() 的说明。 */
    $('repHome').onclick = async function(){
      const v = await confirmLeaveFromDayEnd('（还没进店铺管理，直接离开不会少赚。）');
      if(v !== 'yes') return;
      $('scr-report').classList.remove('on');
      resetReportFx();
      /* finishDayAndLeave() 是同步的：它内部已经把这一天收尾完
         （消费护符 → day++ → 落盘）并作废了当前会话。
         所以这里紧接着 resolve() 是安全的：
         runOneDay 恢复后会先撞上 `if(dead()) return;`
         （dead 里 sessionGen 已变），直接退栈，**不会**再 day++ 一次。
         仍要 resolve() 而不是丢弃 —— 丢弃会让协程永远停在 await 上，
         那正是 skill 里记过的"永不结束的协程"反模式。 */
      finishDayAndLeave();
      resolve();
    };

    /* 清掉内联的 animation-delay，避免下次进结算页时继承上一轮的延迟。
       （scr-report 的 innerHTML 每次都会被重写，理论上不需要；
         但这行让"某个元素被复用"时也不会出问题，代价为零。） */
    function resetReportFx(){}
  });
}
function shopManageScreen(){
  return new Promise(resolve => {
    /* v30 全新店铺管理。
       ── 旧版为什么"花了钱没感觉" ──
       旧版把金币全砸在"店铺 Lv/唱片机 Lv/5 件家具各 3 级"上，
       价格是 4000 / 9000 / 500~1800 这种量级，而日均营业额只有 ~500。
       数学上就是"永远买不起"，所以玩家从没见过它生效 —— 等于没有升级。

       ── 新版的两条花钱路径 ──
       ① 室内装潢（永久）：4 套主题，1000~4800 金币，倍率 1.15~1.70。
          回本周期按日均 500 算：1000/(500*0.15)≈13 天，3200/(500*0.48)≈13 天。
          刻意让每一档回本周期都在 10~15 天，这样"买得起"和"值得买"同时成立。
       ② 护符（仅下一局）：80 / 120 / 150 金币，单局增益实测
          蓝 +45、黄 +50、绿 +90（见 tools/talisman-calib.js）。
          绿护符增益最高所以最贵；蓝护符增益最低但有"兜底"的心理价值。
          注意三者都**低于**自己的实测增益之外的期待值 —— 也就是说
          护符不是稳赚的（黄 120 买 +50 是亏的），它的定价逻辑是
          "花小钱买一局的确定性"，而不是"投资"。
          这样金币才会被持续消耗，不会一路累积。 */

    /* 主题卡片：同时展示色板，让"换装潢"在下单前就看得见长什么样 */
    function themeCards(){
      return '<div class="theme-grid">' + THEMES.map(function(t){
        const own = hasTheme(t.id);
        const cur = Game.theme === t.id;
        const able = Game.coins >= t.cost;
        const sw = t.sw.map(function(c){ return '<i style="background:' + c + '"></i>'; }).join('');
        let btn;
        if(cur) btn = '<button class="theme-btn" disabled>使用中</button>';
        else if(own) btn = '<button class="theme-btn gd" data-use="' + t.id + '">换上这套</button>';
        else btn = '<button class="theme-btn" data-buy="' + t.id + '"' + (able ? '' : ' disabled') + '>' +
          (able ? '买下 · ' + t.cost : '金币不足 · ' + t.cost) + '</button>';
        return '<div class="theme-card' + (own ? ' own' : '') + (cur ? ' cur' : '') + '">' +
          (cur ? '<span class="tag-cur">使用中</span>' : '') +
          '<div class="theme-sw">' + sw + '</div>' +
          '<div class="theme-nm">' + t.name + '</div>' +
          '<div style="font-size:10.5px;color:var(--muted);line-height:1.5;margin-top:5px">' + t.desc + '</div>' +
          '<div class="theme-mt">' + t.tone + '</div>' +
          btn +
        '</div>';
      }).join('') + '</div>';
    }

    /* 护符卡片：只写"它能做什么"，不写具体数值规则。
       黄护符的 +10% 是刻意隐藏的（写出来玩法会退化成算术题）。 */
    function talCards(){
      return '<div class="tal-list">' + TALISMANS.map(function(t){
        const owned = hasTal(t.id);
        const able = Game.coins >= t.cost;
        return '<div class="tal-card ' + t.cls + (owned ? ' own' : '') + '">' +
          '<span class="tal-orb ' + t.cls + '"></span>' +
          '<div class="tal-info"><div class="tal-nm">' + t.name + '</div>' +
          '<div class="tal-ds">' + t.desc + '</div></div>' +
          (owned
            ? '<button class="tal-btn" disabled>已装备</button>'
            : '<button class="tal-btn" data-tal="' + t.id + '"' + (able ? '' : ' disabled') + '>' +
              (able ? '买下 · ' + t.cost : '金币不足') + '</button>') +
        '</div>';
      }).join('') + '</div>';
    }

    /* v31 修复：店铺管理也不走 showScreen()，同样缺锁。
       它是"结算页 → 开始新的一天"的落点，紧跟着一串连点。
       ⚠ 只在**首次打开**时上锁：render() 在每次买装潢/护符之后都会被
       再调一次，若每次都锁，玩家买完东西会觉得"卡了一下才反应"。
       用 _shopEntered 把"进屏"和"重绘"区分开。 */
    let shopEntered = false;
    function render(){
      const ownedThemes = ownsThemeCount();
      const equipped = Game.talismans || [];
      let eqTip = '';
      if(equipped.length){
        eqTip = '<div class="h-sec">本局已装备</div><div style="font-size:12px;color:#7cf5a0;font-weight:800;' +
          'padding:10px 12px;background:rgba(124,245,160,.08);border-left:3px solid #7cf5a0;line-height:1.8">' +
          equipped.map(function(id){ return TAL_BY_ID[id] ? TAL_BY_ID[id].name : ''; }).filter(Boolean).join(' · ') +
          '<div style="font-size:10.5px;color:var(--muted);font-weight:600;margin-top:4px">' +
          '这些护符会在下一天开始时生效，当天结算后消耗</div></div>';
      }

      if(!shopEntered){
        shopEntered = true;
        lockInput(INPUT_LOCK_MS);
      }
      $('scr-shop').classList.add('on');
      $('scr-shop').innerHTML = `
        <div class="topbar"><h2>店铺管理</h2><span style="color:var(--gold);font-weight:900;font-size:14px" class="num">${Game.coins} 金币</span></div>
        <div class="body-scroll" style="padding:18px 18px calc(30px + env(safe-area-inset-bottom))">
          <div class="h-sec">室内装潢 · 永久生效（已拥有 ${ownedThemes}/${THEMES.length}）</div>
          <div style="font-size:11px;color:var(--muted);line-height:1.7;margin-bottom:10px">
            换一套装潢会改变店内的灯光、配色与陈设，同时提高唱片的基准售价。
          </div>
          ${themeCards()}

          ${eqTip}
          <div class="h-sec">护符 · 仅下一局生效</div>
          <div style="font-size:11px;color:var(--muted);line-height:1.7;margin-bottom:10px">
            护符一局用完即失效，需要为新的一天再买一次。
          </div>
          ${talCards()}

          <div style="margin-top:30px">
            <button class="menu-item" style="width:100%" id="nextDay"><span class="idx">→</span><span class="tx">开始新的一天</span></button>
            <button class="menu-item gd" style="width:100%;margin-top:10px" id="shopHome"><span class="idx">🏠</span><span class="tx">返回主菜单</span></button>
          </div>
        </div>
      `;

      document.querySelectorAll('[data-buy]').forEach(function(b){
        b.onclick = function(){
          const t = THEME_BY_ID[b.getAttribute('data-buy')];
          if(!t || hasTheme(t.id)) return;
          if(Game.coins < t.cost){ toast('金币不足'); return; }
          Game.coins -= t.cost;
          Game.stats.expense += t.cost;
          Game.themes.push(t.id);
          Game.theme = t.id;              /* 买完立刻换上，花钱马上看得见 */
          applyShopTheme();
          save(); render();
          if(window.Sfx) Sfx.open();
          toast('已换装：' + t.name + ' · 基准价 ' + t.tone);
        };
      });
      document.querySelectorAll('[data-use]').forEach(function(b){
        b.onclick = function(){
          const t = THEME_BY_ID[b.getAttribute('data-use')];
          if(!t || !hasTheme(t.id)) return;
          Game.theme = t.id;
          applyShopTheme();
          save(); render();
          if(window.Sfx) Sfx.click();
          toast('已换上：' + t.name);
        };
      });
      document.querySelectorAll('[data-tal]').forEach(function(b){
        b.onclick = function(){
          const t = TAL_BY_ID[b.getAttribute('data-tal')];
          if(!t || hasTal(t.id)) return;
          if(Game.coins < t.cost){ toast('金币不足'); return; }
          Game.coins -= t.cost;
          Game.stats.expense += t.cost;
          Game.talismans.push(t.id);
          save(); render();
          if(window.Sfx) Sfx.success();
          toast('已装备：' + t.name + '（仅下一局）');
        };
      });

      $('nextDay').onclick = function(){
        $('scr-shop').classList.remove('on');
        /* v31.2：新的一天正式开始，解除日终退出的锁 */
        Game._dayEndLeft = false;
        resolve();
      };

      /* v31.2：店铺管理页的「返回主菜单」。
         与结算页同理 —— 必须先把这一天收尾（护符消费 + day++），
         否则玩家能靠"这里退出→继续游戏"重玩同一天刷金币。
         也**不能**沿用被删掉的 #shopBack 的语义：那个按钮原本是
         `remove('on') + resolve()`，等价于"偷偷点了一下开始新的一天"，
         从名字和图标（←）看完全是误导性的。 */
      $('shopHome').onclick = async function(){
        const v = await confirmLeaveFromDayEnd('（新的一天尚未开始，直接离开不会少赚，护符也会正常消耗。）');
        if(v !== 'yes') return;
        $('scr-shop').classList.remove('on');
        finishDayAndLeave();
        /* 同结算页：收尾已由 finishDayAndLeave 完成，紧接 resolve 让
           runOneDay 恢复、撞上 dead() 后干净退栈，不会重复 day++。 */
        resolve();
      };
    }
    render();
  });
}

function openCollection(){
  const list = $('colGrid');
  list.className = 'inv-grid';
  list.innerHTML = '';
  $('colCount').textContent = '已收藏 ' + Game.collection.length + ' / 100';
  if(!Game.collection.length){
    list.innerHTML = '<div style="text-align:center;color:var(--muted);padding:40px 0;font-size:13px">还没有收藏任何唱片<br>点击下方输入种子码预览并导入</div>';
  } else {
    Game.collection.forEach(function(tid){
      const t = getTrackById(tid); if(!t) return;
      const gold = isGold(t);
      const card = document.createElement('div');
      card.className = 'inv-card' + (t.rarity === 3 ? ' r3' : t.rarity === 2 ? ' r2' : '') + (gold ? ' gold' : '');
      card.style.position = 'relative';
      card.dataset.tid = String(tid);
      card.innerHTML = '<div class="inv-thumb"><img src="' + getCoverCanvas(t, 200).toDataURL('image/jpeg', 0.85) + '" alt="">' +
        (t.rarity > 1 ? '<div class="rbadge">' + '★'.repeat(t.rarity) + '</div>' : '') +
        (gold ? '<div class="gbadge">金边</div>' : '') +
        '</div><div class="inv-info"><div class="nm">' + t.name + '</div><div class="tags"><span class="tag-pill genre">' + t.genre + '</span>' + t.moods.map(function(m){return '<span class="tag-pill mood">' + m + '</span>'}).join('') + '</div><div class="meta">' + t.bpm + ' BPM · 种子 ' + t.seed + '</div></div>' +
        '<button class="col-del" data-del="' + tid + '" title="移除" style="position:absolute;top:8px;right:8px;width:32px;height:32px;border:none;background:rgba(255,46,136,.55);color:#fff;font-size:18px;font-weight:800;cursor:pointer;z-index:20;line-height:1;padding:0">×</button>';
      list.appendChild(card);
    });
  }
  /* 事件委托：无论卡片怎么重建，只绑定一次 */
  if(!list._bound){
    list._bound = true;
    list.addEventListener('click', function(e){
      /* 删除按钮：优先处理，绝不冒泡 */
      const del = e.target.closest('.col-del');
      if(del){
        e.stopPropagation();
        e.preventDefault();
        const idRaw = del.getAttribute('data-del');
        let idx = -1;
        for(let i = 0; i < Game.collection.length; i++){
          if(String(Game.collection[i]) === String(idRaw)){ idx = i; break; }
        }
        if(idx >= 0){
          Game.collection.splice(idx, 1);
          save();
          toast('已移除');
          openCollection();
        }
        return;
      }
      /* 点卡片 → 打开观赏 */
      const card = e.target.closest('.inv-card');
      if(card){
        const tid = card.dataset.tid;
        const t = getTrackById(tid);
        if(!t) return;
        showScreen(null);
        RecView.open(t).then(function(){
          openCollection();
          showScreen('scr-collection');
        });
      }
    }, true);
  }
  /* 种子码导入 */
  const wrap = document.createElement('div');
  wrap.style.cssText = 'margin-top:24px;padding:16px;border-top:1px solid rgba(255,255,255,.08)';
  wrap.innerHTML = '<div style="font-size:11px;letter-spacing:.2em;color:var(--gold);font-weight:800;margin-bottom:10px">种子码预览与导入</div><div style="display:flex;gap:8px"><input id="seedInput" type="number" placeholder="输入任意数字" style="flex:1;padding:12px;background:#0a0612;border:1px solid rgba(255,255,255,.2);color:var(--bone);font-family:inherit;font-size:14px"><button id="seedImport" style="padding:12px 20px;border:none;background:var(--gold);color:#2a1a00;font-weight:800;font-family:inherit;font-size:13px">预览</button></div>';
  list.appendChild(wrap);
  setTimeout(function(){
    const btn = document.getElementById('seedImport');
    if(btn) btn.onclick = function(){
      const v = parseInt(document.getElementById('seedInput').value, 10);
      if(!v || isNaN(v)){ toast('请输入数字'); return; }
      const track = generateTrackFromSeed(v);
      if(!track){ toast('无法生成唱片'); return; }

      preview.innerHTML = '<div style="width:100%;max-width:340px;background:linear-gradient(160deg,#1a0d2e,#0a0612);border:1px solid rgba(255,46,136,.5);border-top:5px solid #ff2e88;padding:24px 20px;text-align:center;box-shadow:0 0 60px rgba(255,46,136,.25)"><img src="' + getCoverCanvas(track, 300).toDataURL('image/jpeg', 0.85) + '" style="width:180px;height:180px;border-radius:4px;margin-bottom:14px"><h3 style="font-size:20px;font-weight:900;font-style:italic;margin-bottom:8px">' + track.name + '</h3><p style="font-size:12px;color:rgba(180,165,220,.7);margin-bottom:18px">' + track.genre + ' · ' + track.moods.join(' / ') + ' · ' + track.bpm + ' BPM</p><div style="display:flex;gap:10px;justify-content:center"><button id="pvAdd" style="padding:12px 24px;border:none;background:#ff2e88;color:#fff;font-weight:800;font-family:inherit;font-size:14px">加入收藏</button><button id="pvCancel" style="padding:12px 24px;border:2px solid rgba(255,255,255,.25);background:transparent;color:#f2ede4;font-weight:800;font-family:inherit;font-size:14px">取消</button></div></div>';
      document.body.appendChild(preview);
      document.getElementById('pvAdd').onclick = function(){
        if(!Game.collection.includes(track.id)){
          Game.collection.push(track.id);

      };

  }, 30);

}

/* 无限随机唱片生成
   ── v31.3：这里才是"接近无限专辑"的正主 ──
   本函数只由 seed 决定一切（名字/风格/情绪/BPM/根音/颜色/封面/曲子），
   所以任意数字都能生成一张唯一且可复现的专辑 —— 空间是 2^31 量级，
   配合 trackNameFrom() 的 710 万种名字，长期游玩几乎不会撞名。
   用途有两处：
     · 收藏页的「种子码预览与导入」（玩家手输任意数字）
     · 进货时按需扩容（见 drawBatch 的 v31.3 分支） */

/* PATCH v16 反查动态唱片 */
function getTrackById(tid){
  if(TRACK_BY_ID[tid]) return TRACK_BY_ID[tid];
  var s = String(tid);
  if(s.charAt(0) === 's'){
    var sd = parseInt(s.slice(1), 10);
    if(!isNaN(sd)) return generateTrackFromSeed(sd);
  }
  return null;
}
function generateTrackFromSeed(seed){
  const r = mulberry32(Math.abs(seed) | 0);
  const genre = GENRES[Math.floor(r()*GENRES.length)];
  const moodN = r() < 0.55 ? 1 : 2;
  const moods = [];
  let guard = 0;
  while(moods.length < moodN && guard++ < 40){
    const m = MOODS[Math.floor(r()*MOODS.length)];
    if(!moods.includes(m)) moods.push(m);
  }
  /* v31.3：名字与 BPM 改走纯函数（与固定曲库 TRACKS 用同一套规则）。
     这样"固定 100 张"和"种子生成"两条路的命名/速度风格完全一致，
     玩家不会觉得"种子码生成的那批名字特别粗糙"。 */
  const name = trackNameFrom(seed);
  const bpm = pickBpm(genre, seed);
  const rootMidi = 48 + Math.floor(r()*12);
  const rr = r();
  const rarity = rr < 0.05 ? 3 : (rr < 0.25 ? 2 : 1);
  const id = 's' + seed;
  const track = {
    id: id, name, genre, moods, bpm, rootMidi,
    seed: seed, rarity,
    scaleName: GENRE_SCALE[genre] || 'minor',
    /* v31.5：与固定曲库一致 —— 每张动态专辑也有自己的配色 */
    colors: paletteFromSeed(seed, genre),
    basePrice: Math.round(55 + r()*75)
  };
  TRACK_BY_ID[id] = track;
  return track;
}
function openAchievements(){
  const list = $('achList');
  list.innerHTML = ACHIEVEMENTS.map(a=>{
    const got = Game.achievements.includes(a.id);
    return `<div class="card ${got?'gold':'locked'}">
      <div style="font-size:20px">${got?'🏆':'🔒'}</div>
      <div style="flex:1">
        <div class="cn">${got ? a.name : '???'}</div>
        <div class="cd">${got ? a.desc : '（未解锁）'}</div>
      </div>
    </div>`;
  }).join('') + `<div style="text-align:center;color:var(--muted);font-size:12px;margin-top:16px">已解锁 ${Game.achievements.length} / ${ACHIEVEMENTS.length}</div>`;
  showScreen('scr-ach');
}

/* ------------------------- 20.5 会话复位（v28） -------------------------
   ── 为什么必须把这段抽出来 ──
   「返回主菜单」和「重新开始（清空存档）」都要"彻底离开当前局内会话"。
   之前只有 home 分支手写了这套流程，而 btnReset 只调了一句 resetGame()，
   于是留下了一个真实卡死 bug（玩家已复现）：

     暂停菜单 → 设置 → 重新开始
       · resetGame() 把 inventory 清成了 []，但没有补回初始库存
       · 日循环协程仍然活着，暂停也没解除，屏幕还停在设置页
       · 玩家以为回到了游戏，其实库存为空 → 无片可给客人
       · openInventoryForGuest() 永远等不到卡片点击
       · serveOneGuest 卡在 await 上：客人永远无法成交，游戏彻底卡死

   现在拆成两个函数：abort 只负责"作废"，两个出口各自决定去哪。 */

/* 只作废：把当前局内会话的所有"等待中的东西"全部解掉并让旧协程退栈。
   不切屏、不改 BGM 面——由调用者决定接下来去哪。 */
function abortGameSession(){
  /* 1) 作废日循环：自增世代令牌 + 置 abort。
        旧循环醒来发现令牌过期会立刻退栈，不会和新循环抢客人。 */
  Game._gen = (Game._gen || 0) + 1;
  Game.abort = true;
  /* v31.1：同时作废"会话令牌"。
     为什么两个都要 —— `_gen` 只是 gameLoop 的 while 条件，它管不住
     循环体内那些已经 await 到一半的协程；而 `Game.abort` 会被新会话
     （beginNewGame）复位成 false。两个都靠不住的时候，就需要一个
     **只增不减、且不被任何重启路径复位**的令牌：sessionGen。
     旧协程在每个 await 之后比对它，发现不是自己那一代就无条件退栈。 */
  bumpSessionGen();

  /* 2) 解掉所有"挂起的等待"。这是本次修复的核心：
        库存选择 / 唱片界面各自持有一个永不 resolve 的 Promise，
        不解掉的话对应协程会永远卡在 await 上（真死锁，不报错）。 */
  cancelInvWait();
  if(typeof RecView !== 'undefined' && RecView.cancel) RecView.cancel();

  /* v31：教程中途离开会话时，把被污染的累计字段还原掉。
     漏了这一句的后果：玩家在教程里返回主菜单，演示那一单的
     stats / 成就 / seenStories 会原样落进存档 —— 凭空多出几个成就、
     累计收入虚高，而且再也弹不出那些成就提示。
     位置放在第 3 步（撤对话框）之后：restoreStats() 本身不碰 DOM/协程，
     但放在会话复位的中段可以让"数据回滚"和"界面清场"读起来是一件事。 */
  if(typeof Tutorial !== 'undefined' && Tutorial.restoreStats){
    try{ Tutorial.restoreStats(); }catch(e){}
    /* 教练条与需求面板是 DOM 状态，不会自己消失 —— 它们挂在 body 上，
       不归 showScreen() 管（showScreen 只切换 .screen）。不主动收掉的话，
       回到主菜单后顶部还会浮着一条"点屏幕任意位置可以让对话往下走"。 */
    try{ Coach.hide(); }catch(e){}
    try{ TutDemand.hide(); }catch(e){}
    try{ Tutorial.active = false; Tutorial._aborted = false; }catch(e){}
  }

  /* 3) 撤对话框，并作废"因暂停被推迟、尚未执行"的 Dialogue.play() */
  hideDialogue(true);

  /* 4) 清掉暂停现场，避免残留的 _prePauseScreen 影响下一次暂停 */
  takePauseRestore();

  /* 5) 撤掉台上还站着的客人 */
  try{ if(guestGroup){ shopScene.remove(guestGroup); guestGroup = null; } }catch(e){}

  /* 6) 关掉一切浮层：通用弹窗、抽卡页（它不在 SCREENS 里，showScreen 管不到） */
  try{ $('modal').classList.remove('on'); }catch(e){}
  try{ var _d = $('scr-draw'); if(_d) _d.classList.remove('on'); }catch(e){}

  /* 7) 解除暂停。此时 Game.abort 仍为 true，
        _pauseCtrl.resume() 会据此把被推迟的旧气泡丢掉而不是还原到新界面上
        （v21 踩过的坑）。调用者若还要继续玩，需在此之后自行把 abort 置回 false。 */
  if(window._pauseCtrl){ try{ window._pauseCtrl.resume(); }catch(e){} }
  hideDialogue(true);
}

/* 出口 A：彻底离开局内，回到主菜单 */
function leaveGameSession(){
  abortGameSession();
  setBgmCtx('menu');
  showScreen('scr-start');
  $('pauseBtn').classList.remove('on');
  refreshSaveInfo();
}

/* ── v31.2：日终页面（结算页 / 店铺管理页）的「返回主菜单」──
   ── 为什么不能直接调 leaveGameSession()（真实漏洞，必须防）──
   这两个页面都处在"这一天已经结完账、但 Game.day 还没自增"的窗口里：
   金币在接待客人时就已经加进 Game.coins 了（serveOneGuest 里
   `Game.coins += price`），而 `Game.day++` 要等玩家点掉「开始新的一天」
   才执行。
   此时存档里的状态是 `_dayInProgress=false, day=N, coins=已含第 N 天营业额`。
   而读档恢复时 canResumeDay() 为 false（_dayInProgress 已置 false）
   → 会从**第 N 天开头**重开，重新抽 5 张卡、重新接待 5 位客人、**再赚一次第 N 天的钱**。
   玩家只要"玩到结算页 → 返回主菜单 → 继续游戏"就能无限刷金币。

   ── 修法 ──
   在两个页面上点「返回主菜单」时，先把这一天**收尾**（推进到第 N+1 天），
   再离开会话。收尾 = 消费护符 + day++ + 落盘，与 runOneDay() 尾部
   正常的"点掉 #nextDay"路径保持一致。
   （护符也必须在这里消费：否则玩家在结算页退出，护符会被留到下次
     —— 而下次读档是"第 N 天重开"，等于护符白用了一局还在手上。）

   ── 为什么要传 fromShop 区分 ──
   · 在结算页退出：玩家还没进店铺管理，没机会花这一天赚的钱。
     这与"正常点进店铺管理再开始新一天"只差一个逛街步骤，
     不会造成任何收益差异 —— 可以安全地直接收尾。
   · 在店铺管理页退出：同样已经过了结算，收益已定，直接收尾即可。 */
function finishDayAndLeave(){
  /* 幂等保护：连点两次「返回主菜单」时不能 +2 天。
     ⚠ 不能用 sessionGen 当钥匙 —— leaveGameSession() 内部会 bumpSessionGen()，
       两次调用读到的世代不同，反而判不出"已经收尾过了"。
       用一个显式布尔锁，并在"新的一天开始时"与 resetGame/load 里清掉。 */
  if(Game._dayEndLeft) return;
  Game._dayEndLeft = true;

  consumeTalismans();
  Game.day++;
  Game._dayInProgress = false;
  save();
  checkAchievements();
  leaveGameSession();
}
window.finishDayAndLeave = finishDayAndLeave;

/* 日终页面的「返回主菜单」二次确认。
   文案要说清"这一天已经结完账，回来会从下一天开始"，
   否则玩家会以为进度丢了（实际不会丢）。 */
function confirmLeaveFromDayEnd(when){
  return modal(`
    <h3>返回主菜单</h3>
    <p>第 ${Game.day} 天已经结完账，金币已入袋。<br>
       回到主菜单后再继续，会从<b>第 ${Game.day + 1} 天</b>开始。<br>
       ${when}</p>
    <button data-val="yes">返回主菜单</button>
    <button class="ghost" data-val="no">留在这里</button>
  `, { bypassPause: true });
}

/* 出口 B：立刻开一局全新的（清空存档后用）。
   用户要求"清除缓存后直接重新开始游戏"，而不是回到一个空库存的旧局。 */
function beginNewGame(){
  abortGameSession();
  setBgmCtx('game');
  showScreen(null);
  VIEW.mode = 'shop';
  $('pauseBtn').classList.add('on');
  Game.abort = false;
  save();
  gameLoop(Game._gen);
}

/* ------------------------- 21. 菜单事件绑定 ------------------------- */
document.querySelectorAll('#scr-start .menu-item, #scr-pause .menu-item').forEach(btn=>{
  btn.addEventListener('click', async ()=>{
    const act = btn.dataset.act;
    if(act === 'play'){
      $('pauseBtn').classList.remove('on');
      /* v28：让可能还在跑的旧日循环彻底作废（返回主菜单的瞬间又点开始的情况） */
      Game._gen = (Game._gen || 0) + 1;
      Game.abort = true;
      if(hasSave()){
        const v = await modal(`
          <h3>继续游戏？</h3>
          <p>检测到存档：第 ${Game.day} 天\n金币 ${Game.coins}</p>
          <button data-val="continue">继续 第 ${Game.day} 天</button>
          <button class="ghost" data-val="new">重新开始</button>
        `, { bypassPause: true });
        if(v === 'new'){ resetGame(); loadDefaults(); }
      } else {
        resetGame();
        loadDefaults();
      }
      /* v28：统一入口。内含「显式声明 game 音乐面」——
         scr-start → null 单看目标屏名无法区分"回局内"和"从主菜单进局内"，
         少了这一步，开局第一声还停在主菜单曲（v26 踩过的坑）。 */
      beginNewGame();
    }
    else if(act === 'collection'){ window._backTarget = $('scr-pause').classList.contains('on') ? 'scr-pause' : 'scr-start'; openCollection(); }
    else if(act === 'ach'){ openAchievements(); }
    else if(act === 'settings'){ window._backTarget = $('scr-pause').classList.contains('on') ? 'scr-pause' : 'scr-start'; openSettings(); }
    else if(act === 'resume'){
      if(window._pauseCtrl) window._pauseCtrl.resume();
      /* v26：还原暂停前的现场（关键修复）。
         之前这里写死 showScreen(null)，会把暂停前打开的 scr-rec 一并抹掉，
         导致 RecView.open() 的 Promise 永远等不到 resolve、
         serveOneGuest 卡在 await —— 客人无法成交、游戏软锁。
         现在改成"从哪暂停就回哪"。
         music 面：仅当暂停前确实在局内面时才切回 game。 */
      const back = takePauseRestore();
      if(back.inGame) setBgmCtx('game');
      showScreen(back.screen);
      if(Game._dayInProgress) $('pauseBtn').classList.add('on');
      /* scr-rec 上的 ☰ 已经不在视野里（我们刚从暂停回来），
         按原先的设计：唱片界面用顶部 ☰ 暂停，所以这里保持暂停按钮隐藏 */
      if(back.screen === 'scr-rec') $('pauseBtn').classList.remove('on');
    }
    else if(act === 'home'){
      const v = await modal(`
        <h3>返回主菜单</h3>
        <p>进度已自动保存。<br>确定要回到主菜单吗？</p>
        <button data-val="yes">返回主菜单</button>
        <button class="ghost" data-val="no">继续营业</button>
      `, { bypassPause: true });
      if(v === 'yes'){
        window._fromPauseMenu = false; window._backTarget = null;
        /* v28：先落盘保留进度，再走统一的会话复位。
           顺序不能反 —— leaveGameSession() 会置 abort 并发起各种"解挂"，
           进度必须在局面还完整时先存下来。 */
        save();
        leaveGameSession();
      }
    }
  });

function loadDefaults(){
  // 初始金币与库存
  Game.coins = 200;
  Game.inventory = [];
  /* ── v31.4：开局 6 张必须**不重复**（真实缺陷，玩家已报告）──
     ── 玩家反馈 ──
     「有时候两个专辑名字相同，内容好像也一样，检查一下生成器是否存在问题」
     ── 原来错在哪 ──
     旧写法 `pool[rnd(pool.length)]` 是**有放回抽样**：
     每次都从同一个 pool 里独立随机取，取完不放回。
     6 次抽取里出现重复的概率约 1−∏(1−i/100) ≈ 14%，
     而且一旦重复就是 **id 完全相同** —— 同一张唱片在库存里出现两次，
     玩家看到的就是"名字一样、内容也一样"。
     这条路径与 drawBatch 无关（它不发 fixed 曲库的重复），
     所以之前的所有 drawBatch 测试都测不到它。
     ── 现在 ──
     无放回抽样：抽一张就把它从候选里移除，6 张必然互不相同。
     （这 6 张不登记 seenTracks —— 理由见函数末尾注释。） */
  const pool = TRACKS.slice();
  const seenNames = new Set();
  for(let i=0;i<6;i++){
    /* 无放回：随机挑一个下标，取出后 swap 到末尾再缩容 */
    let pick = -1;
    for(let guard = 0; guard < 40; guard++){
      const idx = rnd(pool.length);
      const cand = pool[idx];
      if(cand && !seenNames.has(cand.name)){ pick = idx; break; }
      /* 撞名（理论上不该发生，因为固定 100 张已内部去重）→ 换个位置再试 */
    }
    if(pick < 0) pick = rnd(pool.length);
    const t = pool[pick];
    pool[pick] = pool[pool.length - 1];
    pool.pop();
    if(!t) break;
    Game.inventory.push(t.id);
    seenNames.add(t.name);
  }
  /* ── v31.5：这 6 张**不**登记进 seenTracks ──
     loadDefaults() 的 6 张是"角色面板不要显示 0 张"的占位品：
     紧接着的 stockScreen() 会按"每日清空"把库存整个换成本批新货，
     这 6 张玩家一次都不会看到。
     旧代码把它们 markTracksSeen()，等于每开一局就永久烧掉固定曲库里
     6 个名额（玩家没抽到、也没见过，却再也不会出现）——
     纯粹的资源泄漏，删掉即可。
     真正上架的那一批由 stockScreen() 里的 markTracksSeen(Game.inventory) 登记。 */

  Game.stats = { income:0, expense:0, served:0, sold:0, good:0, ok:0, bad:0, history:[] };
  Game.seenStories = [];
  Game.goodStories = [];
  Game.usedStories = [];
  Game._rareSold = 0;
  /* v30：金边只在进货时按概率产生，开局送的 6 张一律不是金边。
     清一下是为了防止"上一局的金边标记泄漏到新局"（resetGame 已清，
     但点「重新开始」走的是 resetGame → loadDefaults 之外的路径时也要稳）。 */
  clearGoldMarks();
}

async function gameLoop(gen){
  /* v21：世代令牌。重新点「开始游戏」时 _gen 会自增，
     旧循环发现自己的令牌过期就立刻退栈，不会和新循环抢客人。 */
  if(typeof gen !== 'number') gen = Game._gen;
  /* v31.1：会话令牌也要在入口捕获。
     `_gen` 只能拦住"下一轮 while 判断"，拦不住循环体内 await 到一半的协程；
     两者一起看才严密（详见 Canceller 说明）。 */
  const myGen = currentSessionGen();
  const dead = () => Game.abort || Game._gen !== gen || sessionGen !== myGen;
  while(!dead()){
    /* v31：新手教程是"第 1 天开始之前"的独立阶段。
       ── 为什么放在 runOneDay 之前、而不是塞进 runOneDay ──
       塞进去就必须"改造第 1 天"（v30 的做法），于是教程跑完 day 已经
       变成 2、演示唱片还留在库存里 —— 用户明确否掉了这个效果。
       放在这里，教程跑完时 day 仍是 1、库存已被 Tutorial.finish() 清空，
       紧接着的 runOneDay 就是一条**干净的第 1 天**：抽 5 张卡进库存。
       ── 为什么每轮循环都判一次 ──
       shouldRun() 读的是 localStorage 的 TUTORIAL_KEY。玩家在教程中途
       返回主菜单时它还没写入，下次进来就会重演一遍 —— 这是刻意的
       （见 Tutorial 顶部的状态机说明）。 */
    if(Tutorial.shouldRun()){
      await Tutorial.runDemo();
      if(dead()) break;
    }
    /* ── v31.1 关键修复：教程段落结束后必须清掉 _aborted ──
       ── 不清会怎样（真实 bug，玩家已报告"进了第一天却不能玩"）──
       _aborted = "这一次 runDemo 被玩家跳过"。它的生命周期**只到
       runDemo 返回为止**，但没有任何地方会把它清回 false：
         · finish() 里不敢清 —— abort() 靠它在同一个微任务里让
           "正飞着"的 serveOneGuest 从 await 处干净退栈（清了就等于
           教程被跳过了却还在演，v30 踩过这个坑）；
         · abortGameSession() 会清，但它只在"回主菜单 / 清档"时走，
           跳过教程**不会**经过它。
       于是 `_aborted` 永久停在 true。而 serveOneGuest 的第一行守卫正是
           if(Game.abort || Tutorial._aborted) return;
       → 此后**每一天的每一位客人**一进门就被这条路 return 掉：
         没有对话、没有需求、打不开「选唱片」界面、
         stats.sold 永远是 0，玩家在店里干看着，赚不到任何金币。
       ── 为什么修在这里 ──
       gameLoop 是教程阶段的**唯一**拥有者（runDemo 只在这里被 await）。
       runDemo 一返回，"教程"这个概念就结束了，标志也该随之作废 ——
       下一行 runOneDay() 开始的就是一条普通营业日。
       放在 runOneDay() 里也行，但那里语义上不拥有教程状态，
       将来若有人新增 runOneDay 的调用点就会再次漏掉。 */
    Tutorial._aborted = false;
    await runOneDay();
  }
  /* 只有"自己仍然是当前世代"时才清 abort，
     否则会把新循环刚设好的 abort=false 覆盖掉。
     v31.1：会话令牌同样要判 —— 旧循环退栈时不能去动新会话的 abort。 */
  if(Game._gen === gen && sessionGen === myGen) Game.abort = false;
}

   集中在「启动」之前，因为它们要引用主流程里已定义好的东西

/* ------------------------- 27.1 防连点误触 -------------------------
   ── 症状 ──
   连点两下「交给客人」：第一下关掉唱片界面，第二下穿透到屏幕下方那个
   此刻刚露出来的按钮上。表现就是"点快了会跳到下一个界面"。

   ── 为什么不用"给每个按钮加冷却" ──
   本文件可点元素上百个，逐个加既容易漏（以后新加的按钮忘了加），
   也必然误伤"同一按钮连点两次"这种**正常**操作 ——
   对话要连点推进、抽卡后要连点继续，这些不该被拦。

   ── 采用方案：界面切换期的输入锁 ──
   核心想法是"界面正在动的时候不接受点击"：
     · 每次 showScreen / 弹窗 / 抽卡页打开 → 上一把**很短**的锁
     · 锁 = 给 body 加 .input-lock，使所有顶层元素 pointer-events:none
     · 锁只覆盖切换那一小段（150~280ms），不是页面存在期间常驻
   三个好处：
     ✓ 穿透被物理阻断 —— 事件根本没落到元素上，
       与 document 上那堆捕获监听器的注册顺序完全无关
     ✓ 正常操作不受影响 —— 单次点击落在开锁之后；同一按钮连点也只在
       **真的发生界面切换**时才被拦，且拦的时间短于人的连续两击间隔
     ✓ 不会因为"漏加某个按钮"而失效 —— 锁的是容器，不是按钮清单

   ── 为什么把 #dlg 排除在外 ──
   #dlg 用 pointerdown 推进对话，且常常与屏幕同时存在。
   一起锁死会让"点一下跳过打字机"失效，反而制造阻塞感。 */
const INPUT_LOCK_MS = 220;
let _lockTimer = null;
function lockInput(ms){
  if(!document.body) return;
  document.body.classList.add('input-lock');
  if(_lockTimer) clearTimeout(_lockTimer);
  _lockTimer = setTimeout(function(){
    document.body.classList.remove('input-lock');
    _lockTimer = null;
  }, ms || INPUT_LOCK_MS);
}
function unlockInputNow(){
  if(_lockTimer){ clearTimeout(_lockTimer); _lockTimer = null; }
  if(document.body) document.body.classList.remove('input-lock');
}
window.lockInput = lockInput;
window.unlockInputNow = unlockInputNow;

/* .input-lock 会连 #dlg 一起冻住，补一条更高优先级的规则放开它。
   注意 #toast 保持不可点（它本来就是 pointer-events:none 的提示）。 */
(function injectInputLockStyle(){
  const st = document.createElement('style');
  st.textContent =
    'body.input-lock>*{pointer-events:none!important}' +
    'body.input-lock #dlg,body.input-lock #dlg *{pointer-events:auto!important}';
  document.head.appendChild(st);
})();

/* 给 showScreen 挂钩子：真正发生换屏时才上锁。
   判据用"本次 id 与上次不同"，而不是"当前屏没变" ——
   像 openCollection() 会先 showScreen(null) 再 showScreen('scr-collection')，
   两次都该各锁一次（中间那一瞬正是穿透最容易发生的时候）。 */
let _lastShownScreen = null;
(function hookShowScreen(){
  const orig = window.showScreen;
  if(typeof orig !== 'function') return;
  window.showScreen = function(id){
    const nextKey = (id === undefined) ? null : id;
    const changed = (nextKey !== _lastShownScreen);
    _lastShownScreen = nextKey;
    const r = orig.apply(this, arguments);
    if(changed) lockInput(nextKey === null ? 150 : INPUT_LOCK_MS);
    return r;
  };
})();

/* 弹窗与抽卡页不走 showScreen，单独上锁。 */
(function hookModalLock(){
  const om = window.modal;
  if(typeof om === 'function'){
    window.modal = function(){
      lockInput(INPUT_LOCK_MS);
      return om.apply(this, arguments);
    };
  }
  const od = window.showDrawScreen;
  if(typeof od === 'function'){
    window.showDrawScreen = function(){
      lockInput(280);
      return od.apply(this, arguments);
    };
  }
})();

/* 「收入库存」在翻牌动画结束前是 disabled 的，但双击的第二下可能正好
   落在"刚解禁"的那一瞬。这里给按钮加一道 320ms 自我锁 ——
   作用域只在按钮上，不影响别处操作。 */
(function hardenDrawDone(){
  document.addEventListener('click', function(e){
    const t = e.target;
    if(!t || !t.closest) return;
    const b = t.closest('#drawDone');
    if(!b) return;
    if(b._armed){ e.stopPropagation(); e.preventDefault(); return; }
    b._armed = true;
    setTimeout(function(){ b._armed = false; }, 320);
  }, true);
})();

/* ------------------------- 27.2 结算特效与结算音效 ------------------------- */
/* 结算音效：一段"翻账本 → 数金币 → 落袋"的 8bit 小旋律。
   上行音阶的长度跟当天满意人数挂钩，所以"今天做得越好，收尾越漂亮"。
   复用 window.Sfx（内部走 AudioEngine 的方波合成），不新建音频上下文。 */
function sfxSettle(goodCount){
  if(!window.Sfx) return;
  const S = window.Sfx;
  if(!S._play) return;
  try{
    /* 前奏两下三角波，像翻页 / 拨算盘 */
    S._play(392, 0.06, 0.34, 'triangle');
    setTimeout(function(){ S._play(523, 0.06, 0.34, 'triangle'); }, 92);
    const up = goodCount >= 5 ? [523,659,784,1047,1319]
             : goodCount >= 3 ? [523,659,784,1047]
             : goodCount >= 1 ? [440,523,659]
             : [349,440];
    up.forEach(function(f, k){
      setTimeout(function(){ S._play(f, 0.10, 0.44, 'square'); }, 205 + k * 78);
    });
    const tail = 205 + up.length * 78 + 40;
    setTimeout(function(){ S._play(1568, 0.07, 0.32, 'square'); }, tail);
    setTimeout(function(){ S._play(196, 0.20, 0.30, 'triangle'); }, tail + 72);
    /* 完美一天：再加一串上行铃音，与页面上的金色爆闪同步 */
    if(goodCount >= 5){
      [2093, 2637, 2093, 1568].forEach(function(f, k){
        setTimeout(function(){ S._play(f, 0.06, 0.26, 'square'); }, tail + 185 + k * 70);
      });
    }
  }catch(e){}
}
window.sfxSettle = sfxSettle;

/* 营业额数字滚动。为什么值得做：静态贴一个大数字很难让人感到"今天赚到了"，
   滚动 + 每跳一档一个极短高音，能把结算这段"演"出来。 */
function rollNumber(el, target, ms){
  if(!el) return;
  const dur = ms || 720;
  const t0 = performance.now();
  let lastBlip = 0;
  function step(){
    const p = Math.min(1, (performance.now() - t0) / dur);
    /* easeOutCubic：先快后慢，收尾"停住"更有分量 */
    const e = 1 - Math.pow(1 - p, 3);
    const v = Math.round(target * e);
    el.textContent = '+' + v;
    if(p < 1){
      const now = performance.now();
      if(now - lastBlip > 58 && window.Sfx && Sfx._play){
        lastBlip = now;
        Sfx._play(880 + Math.random() * 280, 0.018, 0.15, 'square');
      }
      requestAnimationFrame(step);
    } else {
      el.textContent = '+' + target;
    }
  }
  step();
}
window.rollNumber = rollNumber;

/* ------------------------- 27.3 新手教程 -------------------------
   ── 需求 ──
   在"第一次开店之前"（第一天抽库存之前），用对话 + 演示教会：
     1) 与人对话
     2) 根据需求去看库存
     3) 查看光碟建模 / 试听音乐，决定交付哪一张

   ── 取舍一：复用真实流程，而不是写一套独立演出 ──
   一开始想的是"单独写一段教学脚本让玩家照着点"。那样有两个隐患：
     · 教学脚本永远和真实玩法有细微差异，教出来的操作到正片会失效
     · "等玩家点库存卡片""等玩家按交付"需要一整套可取消的 Promise，
       一旦和暂停 / 返回主菜单交互就极易留下死锁（v28 刚修过同类问题）
   所以改成**在真实流程上贴教练条**：教程跑的就是 serveOneGuest 本身。
   与正片只有 4 个耦合点（serveOneGuest 里 3 个 + runOneDay 里 1 个），
   全部形如 if(Tutorial.active) ... ，教程未激活时零行为变化。

   ── 取舍二：为什么教程里把"客人需求"显性化 ──
   正片里需求要靠对话话头揣摩（"要听了会笑的"），这本身是玩法。
   但教程的目标是教**操作**。第一次就让玩家在 9 句对话里猜需求，
   他卡住的是"我不知道该干什么"而不是"我不会点"。
   所以教程期间额外挂 #tutDemand 面板，教程一结束永久隐藏。

   ── 预设小剧情 ──
   客人「修收音机的老人」，需求：爵士 / 宁静·温暖。
   三张演示唱片分别对应 good / ok / bad，"按需求挑"会立刻得到正反馈。
   万一挑错，教程会讲清**为什么**不对并让他免费重挑一次 ——
   "交错了"本身就是最有价值的一课，不该被一句安慰带过。 */

/* 教程演示唱片，固定 id 保证每次教学结果一致（已用 judge 实测）：
   #4  静止木吉他 · 爵士 · 希望/温暖 · ★★ → 风格+氛围都中 = good
   #7  白噪列车   · 爵士 · 无重合        · ★  → 只有风格中  = ok
   #2  琥珀房间   · 摇滚 · 无重合        · ★  → 都不中      = bad */
const TUT_GOOD_ID = 4, TUT_OK_ID = 7, TUT_BAD_ID = 2;
const TUT_DEMO_IDS = [TUT_GOOD_ID, TUT_OK_ID, TUT_BAD_ID];

const TUT_STORY = {
  id: '__tutorial_radio__',
  title: '修收音机的老人',
  wants: { moods: ['宁静','温暖'], genres: ['爵士'] },
  lines: [
    ['g','（推门进来，把一台旧收音机轻轻放在柜台上）……老板，我不太懂唱片。'],
    ['m','您说。'],
    ['g','我老伴走了三年。她以前总在厨房开着收音机，一边听一边哼。那台机器上周坏了，修不回来了。'],
    ['m','……'],
    ['g','我就想问问，声音能不能换个东西留下来。唱片能吗？'],
    ['m','能。您还记得她常听的是什么吗？'],
    ['g','我说不上名字。就是那种……慢慢悠悠的，有萨克斯的，听着让人心里安静下来的。'],
    ['m','那就是爵士。要让人"安静"又"暖和"的那种，对吧。'],
    ['g','（点头）对，就是这两个字。安静，暖和。']
  ],
  endings: {
    good: '（把唱片抱在怀里，很久没说话）……就是这个。谢谢你，老板。',
    ok:   '（听完，慢慢点头）嗯，是这个调子。我拿回去试试。',
    bad:  '（愣了一会儿，轻轻把唱片推回来）不是这个……太吵了，她不会喜欢。'
  }
};

/* 教程的"已看过"标记（TUTORIAL_KEY / tutorialDone / markTutorialDone）
   定义在第 8 节「存档」里 —— resetGame() 需要用到它，必须在之前。 */

/* -------- 教练条 -------- */
const Coach = {
  steps: [], idx: 0, _t: null, _raf: null, _resolveTarget: null, _lastShowAt: 0,
  /* 一组步骤至少展示这么久才允许推进。
     为什么需要它：推进是"点屏幕任意位置"触发的（见下面 bindAdvance），
     而玩家常常正连点着让对话往前走 —— 没有这个下限的话，
     一组两条提示会被一次连点直接冲过去，第二条等于没显示。
     1100ms 的依据：读一句 20 字左右的提示约需 1 秒，
     而"连点两下"的间隔通常只有 100~250ms，所以不会被误推进。 */
  MIN_STEP_MS: 1100,
  init(){
    const el = $('coach');
    if(!el || el._bound) return;
    el._bound = true;
    const skip = $('coachSkip');
    if(skip) skip.onclick = function(e){
      if(e) e.stopPropagation();
      Tutorial.abort();
    };
    this.bindAdvance();
  },
  /* 推进交互：点屏幕任意位置 → 让教练条往前走一格。
     ── 为什么不放个"下一步"按钮 ──
     教程要教的手感就是"点哪都能往下走"，多一个必须瞄准的按钮反而
     偏离正片操作；而且教练条本身在屏幕顶部、高亮目标在别处，
     玩家视线来回跳会很累。
     ── 为什么用捕获且不 stopPropagation ──
     不能拦截原操作：玩家点「试听」既要推进教练条、也要真的出声。
     所以这里只"顺带"推进，不改变事件原本的去向。 */
  bindAdvance(){
    if(this._advBound) return;
    this._advBound = true;
    const self = this;
    document.addEventListener('pointerdown', function(e){
      const box = $('coach');
      if(!box || !box.classList.contains('on')) return;
      const t = e.target;
      /* 「跳过」自己有 handler，这里不重复处理 */
      if(t && t.closest && t.closest('#coachSkip')) return;
      self.next();
    }, true);
  },
  show(steps){
    this.init();
    this.steps = steps || [];
    this.idx = 0;
    this._lastShowAt = Date.now();
    const el = $('coach');
    if(el) el.classList.add('on');
    this.render();
    if(window.Sfx && Sfx.open) try{ Sfx.open(); }catch(e){}
  },
  /* 换整组步骤（跳到新阶段） */
  set(steps){ this.show(steps); },
  /* 在同组步骤里推进一格。等 90ms 让界面先稳定，
     否则"高亮库存第一张卡"会在卡片还没渲染出来时算到 (0,0)。 */
  next(){
    if(!this.steps.length) return;
    /* 换组后一小段时间内不推进，避免"刚显示就被上一下连点冲掉" */
    if(Date.now() - this._lastShowAt < this.MIN_STEP_MS) return;
    if(this.idx >= this.steps.length - 1) return;
    this.idx++;
    const self = this;
    clearTimeout(this._t);
    this._t = setTimeout(function(){ self.render(); }, 90);
  },
  render(){
    const s = this.steps[this.idx];
    if(!s) return;
    const ic = $('coachIc'), tx = $('coachTx'), dots = $('coachDots');
    if(ic) ic.textContent = s.ic || '📖';
    /* 文案里用 **粗体** 标出要点的名字，渲染成下划线强调 */
    if(tx) tx.innerHTML = String(s.text).replace(/\*\*(.+?)\*\*/g, '<u>$1</u>') +
      (s.sub ? '<small>' + s.sub + '</small>' : '');
    if(dots){
      dots.innerHTML = this.steps.map(function(_, k){
        return '<i class="' + (k < Coach.idx ? 'done' : (k === Coach.idx ? 'cur' : '')) + '"></i>';
      }).join('');
    }
    this.highlight(s.target);
  },
  /* 高亮：用 fixed 定位的方框套住目标。
     目标可以是函数（用于每次重建 DOM 的元素），所以每帧重算位置，
     避免玩家滚动或换屏后框跑偏。 */
  highlight(target){
    const hi = $('coachHi');
    if(!hi) return;
    this._resolveTarget = (typeof target === 'function') ? target
      : (target ? function(){ return document.querySelector(target); } : null);
    if(!this._resolveTarget){ hi.classList.remove('on'); this._stopTick(); return; }
    this._tick();
  },
  _tick(){
    const self = this;
    this._stopTick();
    let frames = 0;
    function loop(){
      const hi = $('coachHi');
      if(!hi){ self._raf = null; return; }
      let node = null;
      try{ node = self._resolveTarget ? self._resolveTarget() : null; }catch(e){ node = null; }
      if(!node){
        hi.classList.remove('on');
      } else {
        const r = node.getBoundingClientRect();
        if(r.width < 2 || r.height < 2 || r.bottom < 0 || r.top > window.innerHeight){
          hi.classList.remove('on');
        } else {
          const pad = 7;
          hi.style.left = (r.left - pad) + 'px';
          hi.style.top = (r.top - pad) + 'px';
          hi.style.width = (r.width + pad * 2) + 'px';
          hi.style.height = (r.height + pad * 2) + 'px';
          hi.classList.add('on');
        }
      }
      frames++;
      /* 跑约 6 秒就够（覆盖换屏动画 + 卡片渲染），之后停下省电；
         需要时由 highlight() 重新启动。 */
      if(frames < 360) self._raf = requestAnimationFrame(loop);
      else self._raf = null;
    }
    loop();
  },
  _stopTick(){ if(this._raf){ cancelAnimationFrame(this._raf); this._raf = null; } },
  hide(){
    clearTimeout(this._t);
    this._stopTick();
    this._resolveTarget = null;
    const el = $('coach'); if(el) el.classList.remove('on');
    const hi = $('coachHi'); if(hi) hi.classList.remove('on');
  }
};
window.Coach = Coach;

/* -------- 需求面板（仅教程期间出现） -------- */
const TutDemand = {
  show(story){
    const d = $('tutDemand');
    if(!d || !story) return;
    const w = story.wants || {};
    d.innerHTML = '<div class="td-t">客人的需求</div>' +
      '<div class="td-r"><span>风格</span>' + (w.genres || []).join(' / ') + '</div>' +
      '<div class="td-r"><span>氛围</span>' + (w.moods || []).join(' / ') + '</div>';
    d.classList.add('on');
