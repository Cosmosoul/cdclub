<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0612">
<!-- v19：内联空 favicon，避免浏览器请求 /favicon.ico 产生 404 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%230a0612' stroke='%23ff2e88' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23ff2e88'/%3E%3C/svg%3E">
<title>唱片店模拟器 v0.4</title>
<style>
:root{
  --bg:#0a0612; --panel:#1a0d2e; --magenta:#ff2e88; --cyan:#5fe8ff;
  --gold:#ffd166; --bone:#f2ede4; --muted:rgba(180,165,220,.7);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--bone);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none;}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:1;touch-action:none;}
.num{font-variant-numeric:tabular-nums;}

/* ---------- 通用屏幕 ---------- */
/* === PATCH v05a === */.screen{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;background:#0a0612}#scr-rec{background:transparent!important}
.screen.on{display:flex;}
.halftone{position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.055) 1px,transparent 1px);
  background-size:5px 5px;}
.deco{position:absolute;right:-10px;top:22%;font-size:84px;font-weight:900;font-style:italic;
  color:rgba(255,255,255,.028);letter-spacing:-4px;pointer-events:none;white-space:nowrap;
  transform:rotate(-90deg);transform-origin:right top;}

/* ---------- 标题 ---------- */
.title-blk{padding:0 26px;margin-top:11vh;position:relative;}
.title-en{display:block;font-size:15px;font-weight:800;letter-spacing:.5em;color:var(--magenta);
  transform:skewX(-12deg);margin-bottom:6px;}
.title-cn{display:block;font-size:52px;font-weight:900;font-style:italic;line-height:1.02;
  letter-spacing:-1px;text-shadow:3px 3px 0 var(--magenta),6px 6px 0 rgba(255,46,136,.25);}
.title-cn2{display:block;font-size:30px;font-weight:900;font-style:italic;color:var(--cyan);
  text-shadow:3px 3px 0 rgba(95,232,255,.2);transform:skewX(-8deg);margin-top:2px;}

/* ---------- 菜单 ---------- */
.menu-wrap{margin-top:5vh;padding:0 22px;display:flex;flex-direction:column;gap:12px;}
.menu-item{position:relative;display:flex;align-items:center;gap:12px;height:60px;padding:0 16px;
  background:linear-gradient(100deg,rgba(255,46,136,.14),rgba(26,13,46,.9) 60%);
  border:none;border-left:4px solid var(--magenta);color:var(--bone);
  font-size:19px;font-weight:800;letter-spacing:.12em;font-family:inherit;
  transform:skewX(-8deg);transition:transform .12s ease-out,box-shadow .12s;
  box-shadow:4px 4px 0 rgba(0,0,0,.45);overflow:hidden;text-align:left;}
.menu-item>*{transform:skewX(8deg);}
.menu-item .idx{font-size:12px;font-weight:700;color:var(--magenta);opacity:.85;min-width:20px;}
.menu-item .ic{font-size:17px;width:22px;text-align:center;}
.menu-item .tx{flex:1;}
.menu-item:active{transform:skewX(-8deg) scale(.96);box-shadow:0 0 22px rgba(255,46,136,.6);}
.menu-item::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent);
  transform:skewX(-20deg);transition:left .35s;}
.menu-item:active::after{left:120%;}
.menu-item.cy{border-left-color:var(--cyan);background:linear-gradient(100deg,rgba(95,232,255,.12),rgba(26,13,46,.9) 60%);}
.menu-item.cy .idx{color:var(--cyan);}
.menu-item.gd{border-left-color:var(--gold);background:linear-gradient(100deg,rgba(255,209,102,.12),rgba(26,13,46,.9) 60%);}
.menu-item.gd .idx{color:var(--gold);}

.foot{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));left:0;right:0;
  text-align:center;font-size:11px;color:var(--muted);letter-spacing:.1em;}

/* ---------- 顶栏 ---------- */
.topbar{display:flex;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top)) 16px 12px;
  border-bottom:1px solid rgba(255,255,255,.07);flex-shrink:0;background:rgba(10,6,18,.86);}
.topbar h2{font-size:18px;font-weight:900;font-style:italic;letter-spacing:.1em;flex:1;}
.tbtn{background:none;border:none;color:var(--bone);font-size:15px;font-family:inherit;
  padding:10px 12px;min-width:48px;min-height:48px;display:flex;align-items:center;justify-content:center;
  font-weight:700;}
.tbtn:active{opacity:.5;}
.body-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px calc(30px + env(safe-area-inset-bottom));
  touch-action:pan-y;}

/* ---------- 卡片 / 列表 ---------- */
.card{background:linear-gradient(120deg,rgba(255,255,255,.05),rgba(26,13,46,.95));
  border-left:3px solid var(--magenta);padding:13px 14px;margin-bottom:10px;
  transform:skewX(-1.6deg);display:flex;align-items:center;gap:12px;}
.card>*{transform:skewX(1.6deg);}
.card .cn{font-size:15px;font-weight:800;letter-spacing:.04em;}
.card .cd{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.5;}
.card.gold{border-left-color:var(--gold);}
.card.cyan{border-left-color:var(--cyan);}
.card.locked{opacity:.4;}

/* ---------- 库存 ---------- */
.inv-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.inv-item{position:relative;aspect-ratio:1;border:2px solid rgba(255,255,255,.1);
  background:#12081f;overflow:hidden;transform:skewX(-2deg);transition:transform .12s;}
.inv-item:active{transform:skewX(-2deg) scale(.94);border-color:var(--magenta);}
.inv-item img{width:100%;height:100%;object-fit:cover;display:block;}
.inv-item .badge{position:absolute;top:3px;right:3px;font-size:9px;font-weight:800;
  background:var(--gold);color:#2a1a00;padding:1px 4px;letter-spacing:.05em;}
.inv-item .nm{position:absolute;left:0;right:0;bottom:0;font-size:9.5px;font-weight:700;
  background:rgba(10,6,18,.85);padding:4px 5px;line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* ---------- 唱片观赏 UI ---------- */
#scr-rec{background:transparent;pointer-events:auto;}
.rec-top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;
  padding:calc(14px + env(safe-area-inset-top)) 18px 0;z-index:5;}
.rec-bottom{position:absolute;left:0;right:0;bottom:0;padding:0 20px calc(24px + env(safe-area-inset-bottom));
  text-align:center;z-index:5;pointer-events:none;}
.rec-bottom>*{pointer-events:auto;}
.rec-name{font-size:23px;font-weight:900;font-style:italic;letter-spacing:.04em;
  text-shadow:2px 2px 0 rgba(255,46,136,.55);}
.rec-tags{font-size:11.5px;color:var(--muted);letter-spacing:.14em;margin-top:5px;}
.rec-btns{display:flex;gap:10px;margin-top:18px;justify-content:center;}
.rbtn{flex:1;max-width:120px;height:52px;border:none;font-family:inherit;font-size:15px;font-weight:800;
  letter-spacing:.1em;background:rgba(26,13,46,.92);color:var(--bone);border-bottom:3px solid var(--magenta);
  transform:skewX(-7deg);transition:transform .1s;}
.rbtn:active{transform:skewX(-7deg) scale(.94);}
.rbtn.pri{background:var(--magenta);color:#fff;border-bottom-color:#a1004f;box-shadow:0 0 22px rgba(255,46,136,.5);}

/* ---------- 对话框 ---------- */
.dlg{position:fixed;left:0;right:0;bottom:0;z-index:30;display:none;}
.dlg.on{display:block;}
.dlg-panel{margin:0 10px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(170deg,rgba(26,13,46,.97),rgba(10,6,18,.98));
  border:1px solid rgba(255,46,136,.45);border-left:5px solid var(--magenta);
  padding:15px 17px 13px;min-height:132px;position:relative;
  box-shadow:0 -6px 40px rgba(255,46,136,.18);}
.dlg-name{position:absolute;top:-13px;left:14px;background:var(--magenta);color:#fff;
  font-size:11.5px;font-weight:900;letter-spacing:.2em;padding:3px 12px;transform:skewX(-10deg);}
.dlg-name.me{background:var(--cyan);color:#06222c;}
.dlg-text{font-size:15.5px;line-height:1.85;letter-spacing:.03em;min-height:60px;padding-top:6px;}
.dlg-next{position:absolute;right:14px;bottom:8px;font-size:11px;color:var(--magenta);
  animation:blink 1.1s infinite;letter-spacing:.1em;}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}

/* ---------- 播放器 ---------- */
#scr-player{background:#0a0612;}
#viz{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:70%;height:60%;opacity:0.75;pointer-events:none;z-index:0}
.pl-wrap{position:relative;z-index:2;display:flex;flex-direction:column;height:100%;
  padding:calc(14px + env(safe-area-inset-top)) 22px calc(22px + env(safe-area-inset-bottom));}
.pl-top{display:flex;justify-content:space-between;align-items:center;font-size:11px;
  letter-spacing:.3em;color:var(--cyan);font-weight:800;}
.vinyl{width:min(62vw,250px);aspect-ratio:1;margin:auto;border-radius:50%;
  background:repeating-radial-gradient(circle at 50% 50%,#12101a 0 2px,#1c1a26 2px 4px);
  box-shadow:0 0 60px rgba(255,46,136,.3),inset 0 0 40px rgba(0,0,0,.9);
  position:relative;animation:spin 4s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.vinyl::before{content:'';position:absolute;inset:26%;border-radius:50%;
  background:radial-gradient(circle,var(--vc1,#ff2e88),var(--vc2,#5c2f16));
  box-shadow:0 0 24px rgba(0,0,0,.7);}
.vinyl::after{content:'';position:absolute;inset:47%;border-radius:50%;background:#000;
  box-shadow:0 0 0 3px rgba(220,215,240,.5);}
.pl-name{text-align:center;font-size:24px;font-weight:900;font-style:italic;
  text-shadow:2px 2px 0 rgba(255,46,136,.55);}
.pl-sub{text-align:center;font-size:11.5px;color:var(--muted);letter-spacing:.16em;margin-top:6px;}
.pl-bar{margin-top:20px;height:5px;background:rgba(255,255,255,.12);position:relative;overflow:hidden;}
.pl-bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--magenta),var(--cyan));
  box-shadow:0 0 12px rgba(255,46,136,.8);}
.pl-times{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px;}
.pl-ctrl{display:flex;justify-content:center;gap:16px;margin-top:16px;}
.pl-ctrl button{width:52px;height:52px;border-radius:0;border:1px solid rgba(255,255,255,.18);
  background:rgba(26,13,46,.9);color:var(--bone);font-size:19px;font-family:inherit;
  transform:skewX(-7deg);transition:transform .1s;}
.pl-ctrl button:active{transform:skewX(-7deg) scale(.9);}
.pl-ctrl button.big{width:64px;height:64px;background:var(--magenta);border-color:var(--magenta);}
.pl-collect{margin:16px auto 0;height:46px;padding:0 26px;border:none;font-family:inherit;
  font-size:13px;font-weight:800;letter-spacing:.16em;background:transparent;color:var(--gold);
  border:2px solid var(--gold);transform:skewX(-8deg);}
.pl-collect:active{background:var(--gold);color:#2a1a00;}
.pl-collect.done{border-color:var(--muted);color:var(--muted);}

/* ---------- 弹窗 ---------- */
.modal{position:fixed;inset:0;z-index:50;background:rgba(6,3,12,.82);display:none;
  align-items:center;justify-content:center;padding:24px;}
.modal.on{display:flex;}
.modal-box{width:100%;max-width:360px;background:linear-gradient(160deg,#1a0d2e,#0a0612);
  border:1px solid rgba(255,46,136,.5);border-top:5px solid var(--magenta);
  padding:24px 20px 20px;text-align:center;box-shadow:0 0 60px rgba(255,46,136,.25);
  animation:pop .26s cubic-bezier(.2,1.2,.4,1);}
@keyframes pop{from{transform:scale(.85) translateY(14px);opacity:0}to{transform:none;opacity:1}}
.modal-box h3{font-size:22px;font-weight:900;font-style:italic;letter-spacing:.08em;margin-bottom:12px;}
.modal-box p{font-size:13.5px;line-height:1.8;color:var(--muted);margin-bottom:16px;white-space:pre-line;}
.modal-box .big{font-size:34px;font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums;
  margin:6px 0 14px;}
.modal-box button{width:100%;height:50px;border:none;font-family:inherit;font-size:15px;font-weight:800;
  letter-spacing:.14em;background:var(--magenta);color:#fff;transform:skewX(-7deg);margin-top:8px;}
.modal-box button.ghost{background:transparent;border:2px solid rgba(255,255,255,.25);color:var(--bone);}
.modal-box button:active{transform:skewX(-7deg) scale(.96);}

/* ---------- 日结 ---------- */
.rep-row{display:flex;justify-content:space-between;font-size:13.5px;padding:7px 0;
  border-bottom:1px dashed rgba(255,255,255,.08);}
.rep-row b{font-variant-numeric:tabular-nums;font-weight:800;}
.sep{height:1px;background:linear-gradient(90deg,var(--magenta),transparent);margin:14px 0;}
.h-sec{font-size:11px;letter-spacing:.28em;color:var(--magenta);font-weight:800;margin:16px 0 8px;}

/* ---------- 设置 ---------- */
.set-row{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.06);}
.set-row label{flex:1;font-size:14px;letter-spacing:.06em;font-weight:600;}
input[type=range]{-webkit-appearance:none;width:130px;height:4px;background:rgba(255,255,255,.15);outline:none;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;background:var(--magenta);
  box-shadow:0 0 10px rgba(255,46,136,.8);}
.sw{width:52px;height:28px;background:rgba(255,255,255,.14);position:relative;transition:.2s;}
.sw i{position:absolute;top:3px;left:3px;width:22px;height:22px;background:var(--muted);transition:.2s;}
.sw.on{background:rgba(255,46,136,.35);}
.sw.on i{left:27px;background:var(--magenta);}

/* ---------- 暂停按钮 ---------- */
#pauseBtn{position:fixed;top:calc(12px + env(safe-area-inset-top));right:14px;z-index:15;
  width:48px;height:48px;display:none;align-items:center;justify-content:center;
  background:rgba(26,13,46,.7);border:1px solid rgba(255,255,255,.14);color:var(--bone);
  font-size:20px;transform:skewX(-6deg);}
#pauseBtn.on{display:flex;}

.toast{position:fixed;top:calc(16px + env(safe-area-inset-top));left:50%;transform:translateX(-50%) skewX(-10deg);
  background:var(--gold);color:#2a1a00;padding:10px 22px;font-size:13px;font-weight:900;letter-spacing:.14em;
  z-index:99;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;white-space:nowrap;}
.toast.on{opacity:1;transform:translateX(-50%) skewX(-10deg) translateY(6px);}

.tag{display:inline-block;font-size:10px;padding:2px 7px;background:rgba(255,255,255,.09);
  margin:2px 4px 2px 0;letter-spacing:.08em;color:var(--bone);}
/* === PATCH v05 === */
.inv-grid{display:flex!important;flex-direction:column;gap:10px;padding:4px 0}
.inv-card{display:flex;gap:14px;padding:12px;background:linear-gradient(100deg,rgba(255,255,255,.045),rgba(26,13,46,.92));border-left:3px solid var(--magenta);transform:skewX(-1.2deg);transition:transform .12s;box-shadow:0 2px 14px rgba(0,0,0,.4);position:relative;overflow:hidden}
.inv-card>*{transform:skewX(1.2deg)}
.inv-card:active{transform:skewX(-1.2deg) scale(.98);border-left-color:var(--cyan)}
.inv-card.r2{border-left-color:var(--gold)}
.inv-card.r3{border-left-color:var(--magenta);box-shadow:0 0 20px rgba(255,46,136,.35)}
.inv-thumb{width:82px;height:82px;flex-shrink:0;position:relative}
.inv-thumb img{width:100%;height:100%;object-fit:cover;display:block;border-radius:2px}
.inv-thumb .rbadge{position:absolute;top:2px;right:2px;font-size:9px;font-weight:800;background:var(--gold);color:#2a1a00;padding:1px 5px;letter-spacing:.05em}
.inv-info{flex:1;display:flex;flex-direction:column;justify-content:center;min-width:0}
.inv-info .nm{font-size:16px;font-weight:800;letter-spacing:.04em;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inv-info .tags{display:flex;flex-wrap:wrap;gap:4px}
.tag-pill{font-size:10px;padding:2px 8px;background:rgba(255,255,255,.08);color:var(--bone);letter-spacing:.06em;border-radius:2px}
.tag-pill.genre{background:rgba(255,46,136,.25);color:#ffb8d5}
.tag-pill.mood{background:rgba(95,232,255,.22);color:#b8f0ff}
.inv-info .meta{font-size:10.5px;color:var(--muted);margin-top:6px;letter-spacing:.12em}
#scr-draw{background:radial-gradient(circle at 50% 40%,#1a0d2e,#0a0612 70%);z-index:40;display:none;flex-direction:column}
#scr-draw.on{display:flex}
.draw-bg{position:absolute;inset:0;background-image:radial-gradient(rgba(255,46,136,.08) 1px,transparent 1px);background-size:18px 18px;pointer-events:none}
.draw-header{text-align:center;padding:calc(50px + env(safe-area-inset-top)) 0 20px;font-size:24px;font-weight:900;font-style:italic;letter-spacing:.2em;color:var(--cyan);text-shadow:2px 2px 0 rgba(95,232,255,.3);position:relative;z-index:2}
.draw-grid{flex:1;display:grid;grid-template-columns:repeat(2,1fr);gap:16px;padding:0 24px;align-content:center;max-width:440px;margin:0 auto;width:100%;position:relative;z-index:2}
/* v19：付费进货会出 6 张，改成 3 列 2 行，避免小屏把按钮挤出屏幕 */
.draw-grid.n6{grid-template-columns:repeat(3,1fr);gap:12px;max-width:440px}
.draw-grid.n6 .draw-card{aspect-ratio:1}
.draw-card{aspect-ratio:1;position:relative;perspective:900px;animation:drawPop .5s cubic-bezier(.2,1.4,.4,1) both}
@media (max-height:700px){
  .draw-header{padding:calc(24px + env(safe-area-inset-top)) 0 12px;font-size:20px}
  .draw-footer{padding:14px 24px calc(18px + env(safe-area-inset-bottom))}
  .draw-btn{height:48px;font-size:15px}
}
@keyframes drawPop{from{transform:scale(.5) rotate(-12deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
.draw-inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.4,.0,.2,1);transform:rotateY(180deg)}
.draw-card.flipped .draw-inner{transform:rotateY(0deg)}
.draw-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:6px;overflow:hidden}
.draw-back{background:linear-gradient(135deg,#2a1740,#0a0612);border:2px solid var(--magenta);display:flex;align-items:center;justify-content:center;font-size:60px;font-weight:900;color:var(--magenta);text-shadow:0 0 20px var(--magenta);transform:rotateY(180deg)}
.draw-front{background-size:cover;background-position:center;border:2px solid var(--cyan);box-shadow:0 0 24px rgba(95,232,255,.4)}
.draw-glow{position:absolute;inset:-6px;border-radius:8px;pointer-events:none}
.draw-glow.r2{background:radial-gradient(circle,rgba(255,209,102,.4),transparent 70%)}
.draw-glow.r3{background:radial-gradient(circle,rgba(255,46,136,.55),transparent 70%);animation:drawGlow 1.5s ease-in-out infinite}
@keyframes drawGlow{0%,100%{opacity:.6}50%{opacity:1}}
.draw-footer{padding:24px 24px calc(40px + env(safe-area-inset-bottom));text-align:center;position:relative;z-index:2}
.draw-btn{height:56px;padding:0 50px;border:none;font-family:inherit;font-size:16px;font-weight:900;letter-spacing:.15em;background:linear-gradient(180deg,var(--magenta),#a1004f);color:#fff;transform:skewX(-6deg);border-bottom:3px solid #6b0034;box-shadow:0 0 24px rgba(255,46,136,.5)}
.draw-btn:disabled{opacity:.35;box-shadow:none}
.draw-btn:active{transform:skewX(-6deg) scale(.96)}
#scr-player{background:#0a0612;overflow:hidden}
#scr-player::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,var(--vc1,#ff2e88) 0%,transparent 55%),radial-gradient(circle at 50% 80%,var(--vc2,#5c2f16) 0%,transparent 60%),#0a0612;opacity:.3;filter:blur(70px);z-index:0;pointer-events:none}
.pl-wrap{position:relative;z-index:2;display:flex;flex-direction:column;height:100%;padding:calc(14px + env(safe-area-inset-top)) 0 calc(24px + env(safe-area-inset-bottom))}
.pl-top{display:flex;justify-content:space-between;align-items:center;padding:0 20px;font-size:10.5px;letter-spacing:.3em;color:var(--cyan);font-weight:800}

<script>
/* v19：CDN 离线兜底。若外网 CDN 不可达，自动加载同目录的 three.min.js，
   避免整个游戏因为一个 CDN 挂掉而白屏。 */

<script src="story.js"></script>
<script>
/* =========================================================================
   唱片店模拟器 v0.4  —  主程序
   ========================================================================= */
'use strict';

/* ------------------------- 0. 工具 ------------------------- */
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const mtof  = m => 440 * Math.pow(2,(m-69)/12);
const wait = ms => { if(window._pauseCtrl && window._pauseCtrl.paused && window._pauseCtrl.promise){ return window._pauseCtrl.promise.then(function(){ return new Promise(function(r){ setTimeout(r, ms); }); }); } return new Promise(function(r){ setTimeout(r, ms); }); };
const $     = id => document.getElementById(id);
const rnd   = n => Math.floor(Math.random()*n);

/* ------------------------- 1. 唱片数据 ------------------------- */
const NAME_A = ['雨夜','午夜','失重','霓虹','旧','漂浮','破碎','静止','沉默','琥珀','深蓝','夏日','黄昏','白噪','孤岛','银河','清晨','锈色','褪色','回声','潮湿','零度','逆光','缓慢'];
const NAME_B = ['木吉他','机房','独白','高速公路','档案','信号','房间','走廊','车站','胶片','舞厅','电台','邮局','花园','列车','漩涡','灯塔','钟摆','碎片','密码','萤火','雨伞','磁带','天际线'];

const GENRES = ['民谣','电子','摇滚','爵士','Lo-Fi','钢琴','后摇','City Pop','氛围','朋克'];
const MOODS  = ['怀旧','宁静','温暖','孤独','热烈','忧郁','希望','迷幻','活力','思念'];

/* v28：GENRE_SCALE 与 SCALES 已随「按风格分派的编曲引擎」一起下移到作曲器
   附近定义（那里还引入了 blues/lydian/mixo/aeolian 等新音阶）。
   此处只保留封面配色表。 */
const GENRE_COLORS = {
  '民谣':     ['#ffb26b','#5c2f16'],
  '电子':     ['#5fe8ff','#1b0b3a'],
  '摇滚':     ['#ff2e88','#2a0a1a'],
  '爵士':     ['#ffd166','#3a2408'],
  'Lo-Fi':    ['#c9a0ff','#241436'],
  '钢琴':     ['#9fd8ff','#0e2033'],
  '后摇':     ['#7b8cff','#101433'],
  'City Pop': ['#ff9ecb','#33102a'],
  '氛围':     ['#8affd6','#0b2b24'],
  '朋克':     ['#ff5a3c','#2b0d06']
};

/* 风格 → 音阶/调式优先采用 GENRE_STYLE 的设定，颜色沿用 GENRE_COLORS。
   注意：必须定义在 TRACKS 之前 —— TRACKS 生成时会用它填 scaleName。
   v28 扩充了音阶种类：aeolian(自然小调)/mixo(混合利底亚)/lydian(利底亚)，
   不同风格用不同调式，这是"同质化"问题的一半解法（另一半是编曲分派）。 */
const GENRE_SCALE = {
  '民谣':'major','电子':'aeolian','摇滚':'mixo','爵士':'dorian','Lo-Fi':'dorian',
  '钢琴':'major','后摇':'aeolian','City Pop':'lydian','氛围':'penta','朋克':'mixo'
};

const TRACKS = (function(){
  const out = [];
  for(let i=1;i<=100;i++){
    const r = mulberry32(1000 + i*7919);
    const genre = GENRES[Math.floor(r()*GENRES.length)];
    const moodN = r() < 0.55 ? 1 : 2;
    const moods = [];
    let guard = 0;
    while(moods.length < moodN && guard++ < 40){
      const m = MOODS[Math.floor(r()*MOODS.length)];
      if(!moods.includes(m)) moods.push(m);
    }
    const name = NAME_A[Math.floor(r()*NAME_A.length)] + NAME_B[Math.floor(r()*NAME_B.length)];
    const bpm  = 60 + Math.floor(r()*80);
    const rootMidi = 48 + Math.floor(r()*12);
    const rr = r();
    const rarity = rr < 0.05 ? 3 : (rr < 0.25 ? 2 : 1);
    out.push({
      id:i, name, genre, moods, bpm, rootMidi,
      seed: 7777 + i*7919,
      rarity,
      scaleName: GENRE_SCALE[genre] || 'minor',
      colors: GENRE_COLORS[genre],
      basePrice: Math.round(55 + r()*75)
    });
  }
  return out;
})();

const TRACK_BY_ID = {};
TRACKS.forEach(t=>TRACK_BY_ID[t.id]=t);

/* ------------------------- 2. 封面绘制 ------------------------- */
const coverCache = new Map();

function drawCover(ctx, S, track){
  const r = mulberry32(track.seed);
  const [c1,c2] = track.colors;
  ctx.fillStyle = c2; ctx.fillRect(0,0,S,S);
  const pat = Math.floor(r()*5);

  if(pat===0){                       // 同心圆
    for(let i=13;i>=0;i--){
      ctx.beginPath();
      ctx.arc(S/2,S/2, S*0.048*i, 0, Math.PI*2);
      ctx.fillStyle = i%2 ? c1 : c2;
      ctx.fill();
    }
  } else if(pat===1){                // 斜条纹
    ctx.save();
    ctx.translate(S/2,S/2); ctx.rotate(-Math.PI/7); ctx.translate(-S/2,-S/2);
    for(let i=-16;i<40;i++){
      ctx.fillStyle = i%2 ? c1 : 'rgba(0,0,0,.22)';
      ctx.fillRect(0, i*S*0.062, S, S*0.031);
    }
    ctx.restore();
  } else if(pat===2){                // 大圆
    ctx.fillStyle = c1;
    ctx.beginPath(); ctx.arc(S*0.5,S*0.48,S*0.33,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.3)';
    ctx.beginPath(); ctx.arc(S*0.5,S*0.48,S*0.17,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.14)';
    ctx.beginPath(); ctx.arc(S*0.5,S*0.48,S*0.08,0,Math.PI*2); ctx.fill();
  } else if(pat===3){                // 点阵
    const step = S/15;
    for(let y=0;y<15;y++) for(let x=0;x<15;x++){
      if((x+y)%2===0){
        ctx.fillStyle = c1;
        ctx.beginPath();
        ctx.arc(x*step+step/2, y*step+step/2, step*(0.18+r()*0.16), 0, Math.PI*2);
        ctx.fill();
      }
    }
  } else {                           // 波纹
    ctx.lineWidth = S*0.012;
    for(let i=1;i<=24;i++){
      ctx.strokeStyle = i%2 ? c1 : 'rgba(255,255,255,.13)';
      ctx.beginPath();
      ctx.arc(S*0.5,S*0.5, S*0.042*i, 0, Math.PI*2);
      ctx.stroke();
    }
  }

  // 标题条
  ctx.fillStyle = 'rgba(10,6,18,.78)';
  ctx.fillRect(0, S*0.755, S, S*0.245);
  ctx.fillStyle = c1;
  ctx.fillRect(0, S*0.755, S, S*0.018);
  ctx.fillStyle = '#f2ede4';
  ctx.font = '900 ' + Math.round(S*0.078) + 'px sans-serif';
  ctx.fillText(track.name, S*0.06, S*0.862);
  ctx.font = Math.round(S*0.048) + 'px sans-serif';
  ctx.fillStyle = 'rgba(200,190,230,.85)';
  ctx.fillText(track.genre + ' · ' + track.moods.join(' / '), S*0.06, S*0.935);
}

function getCoverCanvas(track, size){
  size = size || 512;
  const key = track.id + '_' + size;
  if(coverCache.has(key)) return coverCache.get(key);
  const c = document.createElement('canvas');
  c.width = c.height = size;
  drawCover(c.getContext('2d'), size, track);
  coverCache.set(key, c);
  return c;
}

/* ------------------------- 3. 音频引擎 ------------------------- */
const AudioEngine = {
  ctx:null, master:null, analyser:null, freq:null, trackOut:null, noiseBuf:null,

  init(){
    if(this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.55;
    this.analyser = this.ctx.createAnalyser();
    this.analyser.fftSize = 256;
    this.freq = new Uint8Array(this.analyser.frequencyBinCount);
    this.master.connect(this.analyser);
    this.analyser.connect(this.ctx.destination);
  },

  noise(){
    if(this.noiseBuf) return this.noiseBuf;
    const ctx = this.ctx, len = ctx.sampleRate * 1.0;
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
    this.noiseBuf = buf;
    return buf;
  },

  stop(){
    if(!this.ctx) return;
    if(this.trackOut){
      const t = this.ctx.currentTime, o = this.trackOut;
      try{
        o.gain.cancelScheduledValues(t);
        o.gain.setValueAtTime(o.gain.value, t);
        o.gain.linearRampToValueAtTime(0, t+0.08);
      }catch(e){}
      setTimeout(()=>{ try{o.disconnect();}catch(e){} }, 260);
      this.trackOut = null;
    }
  },

  play(track, seconds, offset){
    this.init();
    if(!this.ctx) return;
    /* v28：只有实时上下文才需要（且才允许）resume。
       OfflineAudioContext 的 state 也是 'suspended'，但 resume() 会抛
       "cannot resume an offline context that has not started" ——
       而且是异步 reject，try/catch 抓不到，会变成未处理的 Promise 警告。
       离线渲染（工具/测试会复用本方法）因此被噪声污染，故加上类型判断。 */
    if(this.ctx.state === 'suspended' && typeof this.ctx.startRendering !== 'function'){
      const p = this.ctx.resume();
      if(p && p.catch) p.catch(function(){});
    }
    offset = offset || 0;
    this.stop();

    const ctx = this.ctx;
    const t0  = ctx.currentTime + 0.1;
    const out = ctx.createGain();
    out.gain.value = 0;
    out.gain.linearRampToValueAtTime(1, t0 + 0.2);
    out.connect(this.master);
    this.trackOut = out;

    // 延迟回声
    const delay = ctx.createDelay(1.2);
    delay.delayTime.value = 60/track.bpm * 0.75;
    const fb = ctx.createGain(); fb.gain.value = 0.28;
    const wet = ctx.createGain(); wet.gain.value = 0.3;
    delay.connect(fb); fb.connect(delay);
    delay.connect(wet); wet.connect(out);

    const events = composeTrack(track, seconds);
    events.forEach(ev => {
      const evT = ev.t - offset; if (evT < -0.15) return; const st = t0 + Math.max(0, evT);
      if(st > t0 + seconds + 0.2) return;

      if(ev.kind === 'kick'){
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(130, st);
        o.frequency.exponentialRampToValueAtTime(42, st + 0.12);
        g.gain.setValueAtTime(ev.v, st);
        g.gain.exponentialRampToValueAtTime(0.001, st + 0.22);
        o.connect(g); g.connect(out);
        o.start(st); o.stop(st + 0.25);
        return;
      }
      if(ev.kind === 'snare' || ev.kind === 'hat'){
        const s = ctx.createBufferSource(); s.buffer = this.noise();
        const f = ctx.createBiquadFilter();
        f.type = ev.kind === 'snare' ? 'bandpass' : 'highpass';
        f.frequency.value = ev.kind === 'snare' ? 1800 : 7000;
        const g = ctx.createGain();
        g.gain.setValueAtTime(ev.v, st);
        g.gain.exponentialRampToValueAtTime(0.001, st + ev.d);
        s.connect(f); f.connect(g); g.connect(out);
        s.start(st); s.stop(st + ev.d + 0.05);
        return;
      }
      // 普通音符
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = ev.wave || 'square';
      o.frequency.value = ev.f;
      /* v28：支持每个音符自带起音/释音（作曲器按音色给出）。
         没有这两个字段时回落到旧行为（12ms 起音 / 指数衰减到音符尾），
         因此这条改动对老调用方是向后兼容的。 */
      const atk = (typeof ev.atk === 'number') ? Math.max(0.002, ev.atk) : 0.012;
      const rel = (typeof ev.rel === 'number') ? Math.max(0.02, ev.rel) : 0;
      g.gain.setValueAtTime(0.0001, st);
      g.gain.linearRampToValueAtTime(ev.v, st + atk);
      if(rel > 0){
        /* 有释音：保持到 "音符末 - rel"，再做一段线性收尾（听感更自然，
           长音不会像被突然掐断） */
        const holdT = Math.max(st + atk, st + ev.d - rel);
        g.gain.setValueAtTime(ev.v, holdT);
        g.gain.linearRampToValueAtTime(0.0001, st + ev.d);
      } else {
        g.gain.exponentialRampToValueAtTime(0.0001, st + ev.d);
      }
      o.connect(g);
      g.connect(out);
      if(ev.lead) g.connect(delay);
      o.start(st); o.stop(st + ev.d + 0.06);
    });
  },

  volume(v){ if(this.master) this.master.gain.value = v; }
};

/* -------- 作曲器 v2（按风格分派的程序化编曲引擎） --------
   ── 为什么要重写 ──
   旧版 composeTrack 只有一套固定逻辑：
     prog = [0,5,3,4]（永远是同一个和弦进行）
     RHYTHMS 5 种固定节奏型
     和声垫永远是 [0,2,4]（根音三和弦）
     鼓组永远是 kick/snare/hat 的固定位置
   于是 10 种风格听起来都差不多，玩家反馈"随机歌曲同质化太严重"。

   ── 新架构 ──
   把"编曲"拆成 6 个可随机化的维度，每个风格给一套候选池：
     1) 和弦进行   prog    —— 每风格 3~4 条，长度 4/8 小节，含七/九/十一音色彩
     2) 和声节奏   comp    —— 垫音落在哪些拍（整小节/切分/半小节脉冲）
     3) 低音织体   bass    —— 长音 / 每拍走动 / 八分律动 / 交替根五度
     4) 鼓组       drums   —— 有无、四踩、backbeat、shuffle、breakbeat
     5) 音色       voicing —— 波形 / 音量 / 起音 / 释音 / 叠接
     6) 旋律生成   melody  —— 动机发展（陈述→模进→转位→变奏），而非逐音乱抽

   组合数：prog(3~4) × comp(3~6) × bass(3~5) × drums(3~6) × voicing(3~5) × 动机(∞)
          ⇒ 每风格至少 100+ 种，十风格合计 >10⁴；叠加随机旋律与韵律后实际近乎无限。

   ── 关键约束：种子可分享 ──
   整张专辑（名称/风格/情绪/BPM/根音/颜色/封面/曲子）全部只由 seed 决定：
   所有随机数都来自同一个 mulberry32(seed)，没有任何 Math.random()。
   因此同一个 seed 在任何设备、任何时间都必然复现同一张专辑 —— 分享种子即分享专辑。 */

function scaleMidi(root, scale, degree){
  const oct = Math.floor(degree / scale.length);
  const idx = ((degree % scale.length) + scale.length) % scale.length;
  return root + oct*12 + scale[idx];
}

/* 风格 → 音阶映射见文件上方（紧邻 TRACKS 定义处），此处不再重复声明。 */

/* --- 鼓组模式：返回一小节内的事件（beat 位置，单位=拍） ---
   每风格给 3~5 种候选。鼓组是"风格脸"最明显的地方，
   所以这里按流派特征给足差异（四踩 / backbeat / shuffle / breakbeat / bossa…）。 */
function drumPattern(kind, r){
  const K = [], S = [], H = [], G = [];   /* G = ghost note（极轻的小鼓点缀） */
  switch(kind){
    case 'none':
      break;
    case 'soft':
      if(r()<0.7) K.push(0);
      if(r()<0.4) K.push(2);
      S.push(2);
      for(let i=0;i<8;i++) if(r()<0.35) H.push(i*0.5);
      break;
    case 'brush':
      K.push(0); if(r()<0.6) K.push(2.5);
      S.push(2);
      for(let i=0;i<8;i++) H.push(i*0.5);
      if(r()<0.7) G.push(1.5 + (r()<0.5?0.25:0));
      break;
    case 'four':
      /* v28：底鼓四踩 + 小鼓 2/4 是这个鼓型的"身份"，必须固定，否则就不是四踩了。
         变化只能放在装饰层 —— 踩镲的开合与鬼音落点，真鼓手每小节也是这么弹的。 */
      K.push(0,1,2,3);
      S.push(1,3);
      for(let i=0;i<8;i++){ if(i%2===0 || r()<0.72) H.push(i*0.5); }
      if(r()<0.5) G.push(2.75);
      if(r()<0.35) H.push(3.75);
      if(r()<0.30) G.push(0.75);
      break;
    case 'rock':
      K.push(0); if(r()<0.5) K.push(2.5); K.push(2);
      S.push(1,3);
      for(let i=0;i<8;i++) if(i%2===1||r()<0.6) H.push(i*0.5);
      if(r()<0.6) K.push(3.75);
      break;
    case 'backbeat':
      K.push(0); if(r()<0.75) K.push(2);
      S.push(1,3);
      for(let i=0;i<8;i++) if(r()<0.7) H.push(i*0.5);
      if(r()<0.6) G.push(1.75);
      break;
    case 'shuffle':
      /* 三连音感的 hi-hat：落在 0, 0.67, 1, 1.67 ...
         v28：原来 8 个帽子位置全固定，导致整个鼓型零变化。
         真实 shuffle 里三连音的中间那个音是"有时点有时不点"的，
         所以这里随机挑一个弱位省略（不是固定省最后一个，否则又变成确定型）。 */
      K.push(0); if(r()<0.5) K.push(2);
      S.push(2);
      for(let i=0;i<4;i++){ H.push(i); H.push(i+2/3); }
      (function(){
        const weak = H.map((x,i)=>[x,i]).filter(p => Math.abs(p[0]%1 - 2/3) < 1e-6);
        if(weak.length && r()<0.55){
          const pick = weak[Math.floor(r()*weak.length)][1];
          H.splice(pick,1);
        }
      })();
      if(r()<0.40) G.push(2 + 2/3);
      break;
    case 'breakbeat':
      K.push(0,2.5);
      S.push(1,3); if(r()<0.5) S.push(2.75);
      for(let i=0;i<16;i++) if(r()<0.30) H.push(i*0.25);
      break;
    case 'electro':
      /* v28：底鼓 0/2 与反拍小鼓是电子的身份，固定；
         原来 16 分帽子全固定在奇数位 → 零变化。改为按概率取舍 + 偶发开镲。 */
      K.push(0,2); if(r()<0.6) K.push(3.5);
      S.push(1,3);
      for(let i=0;i<16;i++){ if(i%2===1 && (i%4===1 || r()<0.7)) H.push(i*0.25); }
      if(r()<0.4) H.push(3.75);
      if(r()<0.35) G.push(2.75);
      break;
    /* --- v28 新增：补足"变化量"，让鼓组不再单调 --- */
    case 'halftime':                    /* 半速感：小鼓只在第 3 拍 */
      K.push(0); if(r()<0.5) K.push(2.5);
      S.push(2);
      for(let i=0;i<8;i++) if(r()<0.5) H.push(i*0.5);
      break;
    case 'bossa':                       /* 波萨诺瓦：两小节循环的拉丁节奏 */
      K.push(0); if(r()<0.7) K.push(1.5); if(r()<0.7) K.push(3);
      S.push(1.5); if(r()<0.6) S.push(3.5);
      for(let i=0;i<8;i++) if(r()<0.8) H.push(i*0.5);
      G.push(2.25);
      break;
    case 'latin':
      /* v28：拉丁的骨架（底鼓 0/2.5、小鼓 1/3）是身份，保留；
         但原来 hi-hat 落点 6 个全固定 → 零变化。改为在骨架外
         按概率叠加弱位切分音，这才是拉丁味道的来源。 */
      K.push(0, 2.5);
      S.push(1, 3);
      [0,0.75,1.5,2,2.75,3.5].forEach(x=>H.push(x));
      if(r()<0.6){ H.push(1.25); }
      if(r()<0.5){ H.push(3.25); }
      if(r()<0.35){ H.push(0.5); }
      if(r()<0.8) G.push(0.75 + (r()<0.5?0:1.5));
      break;
    case 'march':
      /* v28：进行曲"每拍都响"是它的定义，一动就不像了。
         所以只在踩镲与鬼音上做变化（军鼓加花 / 帽子开合）。 */
      K.push(0,1,2,3);
      S.push(0,1,2,3);
      for(let i=0;i<8;i++){ H.push(i*0.5); }
      if(r()<0.35) H.splice(Math.floor(r()*H.length),1);
      if(r()<0.45) G.push(2.5 + (r()<0.5?0:0.25));
      if(r()<0.30) G.push(0.5);
      break;
    case 'trap':
      K.push(0, 1.5, 2.5);
      S.push(2);
      for(let i=0;i<32;i++) if(r()<0.22) H.push(i*0.125);
      break;
    case 'kickroll':                    /* 底鼓滚奏：摇滚/朋克常见 */
      K.push(0); if(r()<0.6) K.push(1.5);
      K.push(2, 2.75); if(r()<0.5) K.push(3.25);
      S.push(1,3);
      for(let i=0;i<8;i++) if(r()<0.55) H.push(i*0.5);
      break;
    case 'sparse':                      /* 极简：只留骨架，适合后摇/氛围 */
      K.push(0);
      if(r()<0.5) S.push(2.5);
      if(r()<0.5) H.push(1); if(r()<0.5) H.push(3);
      break;
    /* --- v28 第二批：给"安静流派"补鼓型 ---
       钢琴 / 氛围 / Lo-Fi 原来的池只有 2~3 套鼓，200 张专辑内就饱和了
       （实测 67%），玩家听到的"重复感"主要来自这里。 */
    case 'tick':                        /* 只有轻微的节奏骨架，像节拍器融进背景 */
      if(r()<0.8) K.push(0);
      if(r()<0.45) S.push(2 + (r()<0.5?0:0.5));
      for(let i=0;i<8;i++){ if(i%4===2 || r()<0.28) H.push(i*0.5); }
      if(r()<0.5) G.push(1 + (r()<0.5?0.5:0));
      if(r()<0.3) G.push(3.25);
      break;
    case 'train':                       /* 民谣的"火车节奏"：稳定的八分推进，温暖 */
      if(r()<0.75) K.push(0); if(r()<0.6) K.push(2);
      if(r()<0.5) S.push(2);
      for(let i=0;i<8;i++){ H.push(i*0.5); }
      if(r()<0.4) H.splice(Math.floor(r()*H.length),1);
      if(r()<0.45) G.push(1.5 + (r()<0.5?0:1));
      if(r()<0.35) K.push(3 + (r()<0.5?0:0.5));
      break;
  }
  return { K, S, H, G };
}

/* --- 低音织体：返回一小节内的 [拍, 音级数偏移, 时值(拍)] --- */
function bassLine(kind, deg, r){
  const out = [];
  switch(kind){
    case 'long':
      out.push([0, deg, 4]);
      break;
    case 'root5th':
      out.push([0, deg, 2]); out.push([2, deg+4, 2]);
      break;
    case 'walk':                      /* 每拍一个音，级进 + 跳进 */
      out.push([0, deg, 1]);
      out.push([1, deg + (r()<0.5?2:4), 1]);
      out.push([2, deg + (r()<0.5?4:6), 1]);
      out.push([3, deg + (r()<0.5?-1:2), 1]);
      break;
    case 'walk8th':                   /* 八分律动，根音为主 */
      for(let i=0;i<8;i++){
        const off = (i===0) ? 0 : (r()<0.45 ? 0 : (r()<0.5?4:(r()<0.5?7:-1)));
        out.push([i*0.5, deg+off, 0.5]);
      }
      break;
    case 'pulse8':
      for(let i=0;i<8;i++) out.push([i*0.5, deg + (i%2?(r()<0.3?7:0):0), 0.5]);
      break;
    case 'octave':
      out.push([0, deg, 1]); out.push([1, deg+7, 1]);
      out.push([2, deg, 1]); out.push([3, deg+(r()<0.5?7:4), 1]);
      break;
  }
  return out;
}

/* --- 乐句/动机生成 ---
   旧版是"逐音丢骰子"，听不出句子结构，这也是同质化的来源。
   新版先造一个小动机（3~5 个音级数），再用音乐上真实的发展手法变化：
     transpose 模进（整体平移）  invert 转位（方向反转）
     retro 逆行  ornament 加装饰音  extend 尾音拉长
   每个 4 小节乐句 = 动机陈述 + 一个发展 + 收束，因此句子有"呼吸"。       */
function makeMotif(r, style){
  const len = 3 + Math.floor(r()*3);            /* 3~5 个音 */
  const shape = [];
  const pool = [0,2,4,1,5,7];
  shape.push(0);                                 /* 动机总从和弦音起 */
  for(let i=1;i<len;i++){
    const stepUp = r()<0.5;
    shape.push(shape[i-1] + (stepUp ? pool[Math.floor(r()*pool.length)] : -pool[Math.floor(r()*pool.length)]));
  }
  return shape;
}
function developMotif(motif, r){
  const k = Math.floor(r()*4);
  if(k===0) return motif.slice();                                  /* 原样陈述 */
  if(k===1) return motif.map(d=>d + (r()<0.5?2:-2));               /* 模进 */
  if(k===2) return motif.map((d,i)=> i===0 ? d : motif[0]-(d-motif[0])); /* 转位 */
  return motif.slice().reverse();                                  /* 逆行 */
}

function composeTrack(track, seconds){
  const r = mulberry32(track.seed ^ 0x9e3779b9);
  const style = GENRE_STYLE[track.genre] || GENRE_STYLE['民谣'];
  const scaleName = style.scale || track.scaleName || 'minor';
  const scale = SCALES[scaleName] || SCALES.minor;
  const beat = 60 / track.bpm;
  const bar  = beat * 4;
  const root = track.rootMidi;
  const bars = Math.ceil(seconds / bar) + 1;
  const evs  = [];

  /* 每次播放都从候选池里挑一套 —— 同一张唱片每次听都一致（seed 固定） */
  const prog  = style.prog[Math.floor(r()*style.prog.length)];
  const comp  = style.comp[Math.floor(r()*style.comp.length)];
  const bassK = style.bass[Math.floor(r()*style.bass.length)];
  const drumK = style.drums[Math.floor(r()*style.drums.length)];
  const vName = style.voice[Math.floor(r()*style.voice.length)];
  const V     = VOICINGS[vName] || VOICINGS.warm;
  const swing = style.swing || 0;

  /* 每隔 4 小节换一个新动机，形成"乐句"而不仅是"小节" */
  let motif = makeMotif(r, style);
  const motifOfBar = b => {
    if(b % 4 === 0) motif = (b === 0) ? motif : developMotif(motif, r);
    return motif;
  };

  for(let b=0;b<bars;b++){
    const deg = prog[b % prog.length];
    const mt  = motifOfBar(b);
    const barT = b*bar;
    const isLast = (b % 4 === 3);

    /* ---- 和声垫 ---- */
    const offsets = comp[1];
    if(comp[0] === 'whole'){
      offsets.forEach(n=>{
        evs.push({ t:barT, f:mtof(scaleMidi(root, scale, deg+n)),
                   d:bar*0.96*V.leadLeg, v:V.leadVol*0.36, wave:V.leadWave,
                   atk:V.attack*1.6, rel:V.release });
      });
    } else if(comp[0] === 'half'){
      for(let h=0;h<2;h++){
        offsets.forEach(n=>{
          evs.push({ t:barT+h*beat*2, f:mtof(scaleMidi(root, scale, deg+n)),
                     d:beat*1.9*V.leadLeg, v:V.leadVol*0.32, wave:V.leadWave,
                     atk:V.attack*1.4, rel:V.release });
        });
      }
    } else if(comp[0] === 'pulse8'){
      for(let p=0;p<8;p++){
        const n = offsets[p % offsets.length];
        evs.push({ t:barT+p*beat*0.5, f:mtof(scaleMidi(root, scale, deg+n)),
                   d:beat*0.45*V.leadLeg, v:V.leadVol*0.25, wave:V.leadWave,
                   atk:V.attack, rel:V.release });
      }
    } else if(comp[0] === 'sync'){
      /* 切分：弱拍起音，最"活"的一种 */
      [0, 1.5, 2.5, 3.5].forEach((bt,i)=>{
        const n = offsets[i % offsets.length];
        evs.push({ t:barT+bt*beat, f:mtof(scaleMidi(root, scale, deg+n)),
                   d:beat*1.1*V.leadLeg, v:V.leadVol*0.30, wave:V.leadWave,
                   atk:V.attack*1.2, rel:V.release });
      });
    } else if(comp[0] === 'arp'){
      /* 琶音：4 个音级按 8 分上行铺开 */
      for(let p=0;p<8;p++){
        const n = offsets[p % offsets.length] + (p>=offsets.length?2:0);
        evs.push({ t:barT+p*beat*0.5, f:mtof(scaleMidi(root, scale, deg+n)),
                   d:beat*0.5*V.leadLeg, v:V.leadVol*0.28, wave:V.leadWave,
                   atk:V.attack, rel:V.release });
      }
    }

    /* ---- 低音 ---- */
    bassLine(bassK, deg, r).forEach(([bt, dg, dur])=>{
      /* 低音保持在中低音区，不跟着和弦一路抬高 */
      let d = dg;
      while(d > 6) d -= 7;
      while(d < -3) d += 7;
      evs.push({ t:barT+bt*beat, f:mtof(scaleMidi(root-12, scale, d)),
                 d:dur*beat*V.bassLeg, v:V.bassVol*0.9, wave:V.bassWave,
                 atk:V.attack, rel:V.release });
    });

    /* ---- 主旋律：动机发展 + 经过音，句尾留长音呼吸 ----
       v28：在动机基础上补"经过音/邻音"装饰。这不只是为了丰富度——
       它是音乐上本来就该做的事：两个音级间隔较大时，中间垫一个过渡音，
       乐句会从"一跳一跳"变得连贯。副作用是音级种类自然增加。 */
    const density = 0.52 + r()*0.30;
    let slot = 0;
    const totalSlots = 8;                 /* 一小节 8 个八分槽 */
    mt.forEach((md, mi)=>{
      /* 经过音：与前一音相隔 ≥3 个音级时，在中点插一个过渡音 */
      if(mi > 0){
        const gap = md - mt[mi-1];
        if(Math.abs(gap) >= 3 && r() < 0.62){
          const pass = mt[mi-1] + (gap > 0 ? 1 : -1) * Math.round(Math.abs(gap)/2);
          const bt = slot * 0.5 - 0.25;
          if(bt >= 0){
            evs.push({
              t: barT + bt*beat,
              f: mtof(scaleMidi(root+12, scale, deg + pass)),
              d: 0.3*beat*V.leadLeg, v: V.leadVol*0.66,
              wave: V.leadWave, lead:true, atk:V.attack, rel:V.release
            });
          }
        }
      }
      if(r() > density) { slot++; return; }
      let bt = slot * 0.5;
      if(swing > 0 && (slot % 2 === 1)) bt += swing*0.5;
      const isTail = (mi === mt.length-1);
      const dur = isTail ? (isLast ? 1.6 : 0.95) : (0.4 + r()*0.35);
      evs.push({
        t: barT + bt*beat,
        f: mtof(scaleMidi(root+12, scale, deg + md)),
        d: dur*beat*V.leadLeg,
        v: V.leadVol*(isTail?0.95:0.86), wave: V.leadWave,
        lead: true, atk: V.attack, rel: V.release
      });
      slot += 1 + Math.floor(r()*2);
      if(slot >= totalSlots) slot = totalSlots - 1;
    });
    /* 句尾（第 4/8 小节）补一个高音长音做落句，并偶发加一个下邻音回绕 */
    if(isLast){
      evs.push({
        t: barT + beat*2.5,
        f: mtof(scaleMidi(root+12, scale, deg + (r()<0.5?4:7))),
        d: beat*1.5*V.leadLeg, v:V.leadVol*0.9, wave:V.leadWave,
        lead:true, atk:V.attack, rel:V.release
      });
      if(r() < 0.45){
        evs.push({
          t: barT + beat*3.6,
          f: mtof(scaleMidi(root+12, scale, deg + 9)),
          d: beat*0.4*V.leadLeg, v:V.leadVol*0.6, wave:V.leadWave,
          lead:true, atk:V.attack, rel:V.release
        });
      }
    }

    /* ---- 鼓组 ----
       v28：加两层变化，避免"整首鼓都一样"。
         ① 每小节有约 28% 概率换用同风格的另一套鼓型（小节级变奏）
         ② 每 4 小节结尾（乐句末）按概率插入 fill（过门）
       这两点让鼓组在 60 首之间的落点组合数大幅上升。 */
    if(drumK !== 'none'){
      /* 小节变奏：从该风格的鼓型池里重抽（跳过 none，保持"有鼓"这件事不变）。
         概率 0.42 —— 实测 0.28 时"唯一鼓组模式数"仍低于旧版（旧版是逐拍乱点缀），
         提高后落点组合数反超，同时因为仍在同一风格的鼓型池内，听感不会跑偏。 */
      let thisK = drumK;
      if(r() < 0.42){
        const pool = style.drums.filter(function(k){ return k !== 'none'; });
        if(pool.length > 1) thisK = pool[Math.floor(r()*pool.length)];
      }
      const dp = drumPattern(thisK, r);
      dp.K.forEach(bt => evs.push({ t:barT+bt*beat, f:0, d:0.22, v:0.30, kind:'kick' }));
      dp.S.forEach(bt => evs.push({ t:barT+bt*beat, f:0, d:0.10, v:0.12, kind:'snare' }));
      dp.H.forEach(bt => evs.push({ t:barT+bt*beat, f:0, d:0.03, v:0.045, kind:'hat' }));
      (dp.G||[]).forEach(bt => evs.push({ t:barT+bt*beat, f:0, d:0.06, v:0.045, kind:'snare' }));
      /* 乐句末过门：最后两拍加密小鼓/鼓 */
      if(isLast && r() < 0.55){
        const n = 3 + Math.floor(r()*3);
        for(let i=0;i<n;i++){
          const bt = 3 + i*(1/n);
          evs.push({ t:barT+bt*beat, f:0, d:0.07, v:0.11, kind: r()<0.5?'snare':'kick' });
        }
      }
    }
  }
  return evs;
}

const LASER_VERT = `
varying vec2 vUv;
varying vec3 vWorldNormal;
varying vec3 vWorldPos;
varying vec3 vWorldTangent;
void main(){
  vUv = uv;
  vec4 wp = modelMatrix * vec4(position, 1.0);
  vWorldPos = wp.xyz;
  vWorldNormal = normalize(mat3(modelMatrix) * normal);
  vec4 centerW = modelMatrix * vec4(0.0, 0.0, 0.0, 1.0);
  vec3 radialDir = wp.xyz - centerW.xyz;
  float rl = length(radialDir);
  vec3 td = vec3(1.0, 0.0, 0.0);
  if(rl > 0.0001){
    radialDir = radialDir / rl;
    td = normalize(cross(vWorldNormal, radialDir));
  }
  vWorldTangent = td;
  gl_Position = projectionMatrix * viewMatrix * wp;
}
`;
const LASER_FRAG = `
uniform float uTime;
uniform vec3 uColorA;
uniform vec3 uColorB;
uniform vec3 uLightPos;
varying vec2 vUv;
varying vec3 vWorldNormal;
varying vec3 vWorldPos;
varying vec3 vWorldTangent;

void main(){
  vec2 p = vUv - 0.5;
  float r = length(p) * 2.0;
  float ang = atan(p.y, p.x);

  vec3 N = normalize(vWorldNormal);
  vec3 V = normalize(cameraPosition - vWorldPos);

  /* 白色高光：一条过圆心的直线
     光源在 UV 空间的投影方向 → 垂直于该方向的直线最亮 */
  vec2 Luv = normalize(uLightPos.xy + vec2(0.0001, 0.0001));
  vec2 perp = vec2(-Luv.y, Luv.x);
  float lineCoord = dot(p, perp);
  float anis = exp(-lineCoord * lineCoord * 180.0);

  /* 银灰底 */
  vec3 silver = vec3(0.86, 0.88, 0.94);
  float fresArg = max(1.0 - abs(dot(N, V)), 0.0);
  float fres = pow(fresArg, 1.5);
  vec3 baseCol = silver * (0.42 + 0.55 * fres);

  /* 8 条辐射彩虹扇形 */
  float hue = ang / 6.28318 * 8.0 + uTime * 0.03;
  vec3 rainbow = 0.5 + 0.5 * cos(6.28318 * (hue + vec3(0.0, 0.33, 0.67)));
  float rainbowIntensity = 0.15 + 0.45 * fresArg;

  vec3 col = baseCol;
  col += rainbow * rainbowIntensity * 0.9;
  col += vec3(1.0) * anis * 0.85;

  /* 同心细纹 */
  col *= 0.96 + 0.04 * sin(r * 200.0);

  /* 中心孔 + 外缘压暗 */
  col *= smoothstep(0.10, 0.20, r);
  col *= smoothstep(1.03, 0.92, r);

  gl_FragColor = vec4(col, 1.0);
}
`;function buildRecord(track){
  // 清空
  while(recordRoot.children.length) {
    const c = recordRoot.children.pop();
    c.traverse(o => {
      if(o.geometry) o.geometry.dispose();
      if(o.material){
        const ms = Array.isArray(o.material) ? o.material : [o.material];
        ms.forEach(m=>{ if(m.map) m.map.dispose(); m.dispose(); });
      }
    });
  }

  const geo = new THREE.CylinderGeometry(1, 1, 0.024, 72, 1, false);
  geo.rotateX(Math.PI/2);

  const coverTex = new THREE.CanvasTexture(getCoverCanvas(track, 512));
  coverTex.anisotropy = 4;

  const coverMat = new THREE.MeshStandardMaterial({ map:coverTex, roughness:0.55, metalness:0.08 });
  const sideMat  = new THREE.MeshStandardMaterial({ color:0x241a34, roughness:0.35, metalness:0.85 });

  laserMat = new THREE.ShaderMaterial({
    uniforms:{ uTime:{ value:0 }, uColorA:{ value:new THREE.Color(track.colors[0]) }, uColorB:{ value:new THREE.Color(track.colors[1]) }, uLightPos:{ value:new THREE.Vector3(2, 3, 4) } },
    vertexShader: LASER_VERT,
    fragmentShader: LASER_FRAG
  });

  recordMesh = new THREE.Mesh(geo, [sideMat, coverMat, laserMat]);
  recordRoot.add(recordMesh);

  // 中心孔
  const holeMat = new THREE.MeshBasicMaterial({ color:0x000000 });
  const hole1 = new THREE.Mesh(new THREE.CircleGeometry(0.10, 32), holeMat);
  hole1.position.z = 0.0126; recordMesh.add(hole1);
  const hole2 = new THREE.Mesh(new THREE.CircleGeometry(0.10, 32), holeMat);
  hole2.position.z = -0.0126; hole2.rotation.y = Math.PI; recordMesh.add(hole2);

  const ringMat = new THREE.MeshBasicMaterial({ color:0xd8d0e8 });
  const ring1 = new THREE.Mesh(new THREE.RingGeometry(0.10, 0.14, 32), ringMat);
  ring1.position.z = 0.0127; recordMesh.add(ring1);
  const ring2 = new THREE.Mesh(new THREE.RingGeometry(0.10, 0.14, 32), ringMat);
  ring2.position.z = -0.0127; ring2.rotation.y = Math.PI; recordMesh.add(ring2);

  // 珍稀唱片光晕
  if(track.rarity >= 3){
    const halo = new THREE.Mesh(
      new THREE.RingGeometry(1.02, 1.12, 64),
      new THREE.MeshBasicMaterial({ color:0xffd166, transparent:true, opacity:0.5, side:THREE.DoubleSide })
    );
    recordRoot.add(halo);
  } else if(track.rarity === 2){
    const halo = new THREE.Mesh(
      new THREE.RingGeometry(1.01, 1.05, 64),
      new THREE.MeshBasicMaterial({ color:0xffd166, transparent:true, opacity:0.55, side:THREE.DoubleSide })

  }

  recState.rotY = 0; recState.rotX = 0;
  recState.targetY = 0; recState.targetX = 0;
  recState.scale = 1;
  recState.spinning = true;
  recState.lastInput = performance.now();
  recordRoot.rotation.set(0,0,0);
  recordRoot.scale.setScalar(1);

}

/* -------- 主循环 -------- */
function loop(){
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05);
  const now = performance.now();

  if(VIEW.mode === 'record'){
    // 缓动
    recState.rotY += (recState.targetY - recState.rotY) * Math.min(1, dt*9);
    recState.rotX += (recState.targetX - recState.rotX) * Math.min(1, dt*9);
    recordRoot.rotation.y = recState.rotY;
    recordRoot.rotation.x = recState.rotX;
    recordRoot.scale.setScalar(recordRoot.scale.x + (recState.scale - recordRoot.scale.x) * Math.min(1, dt*10));

    if(recState.spinning && !recState.dragging && now - recState.lastInput > 1000){
      recordMesh.rotation.z += dt * 0.55;
    }
    if(laserMat) laserMat.uniforms.uTime.value = now / 1000;

    renderer.render(recScene, recCam);
  } else {
    // 店铺场景
    if(shopScene.userData.plate) shopScene.userData.plate.rotation.y += dt * 0.4;
    if(guestGroup){
      // 待机呼吸
      guestGroup.position.y = Math.sin(now/700) * 0.015;
    }
    renderer.render(shopScene, shopCam);
  }
}

const RecView = {
  resolve:null,
  track:null,
  /* v26：进入观赏界面前，暂停按钮原本是否显示。
     为什么需要记忆：观赏唱片有两条入口——
       · 局内给客人选唱片：进之前 pauseBtn 是 on 的，关闭后要还回来
       · 主菜单收藏页点开唱片：进之前 pauseBtn 是 off 的，关闭后必须保持 off
     原先 close() 里无条件 add('on')，于是从主菜单看完唱片回到收藏页时，
     暂停按钮被误置为显示状态（虽然它 z-index 低于 .screen 通常看不出来，
     但状态已错，属于残留 bug）。改成"还原进门前状态"后就两边都对了。 */
  _pauseBtnBefore: false,

  open(track){
    return new Promise(resolve => {
      this.resolve = resolve;
      this.track = track;
      this._pauseBtnBefore = $('pauseBtn').classList.contains('on');
      buildRecord(track);
      $('recName').textContent = track.name;
      $('recTags').textContent =
        track.genre + ' · ' + track.moods.join(' / ') + '  ·  ' + track.bpm + ' BPM' +
        '  ' + '★'.repeat(track.rarity);
      VIEW.mode = 'record';
      showScreen('scr-rec');
      $('pauseBtn').classList.remove('on');
    });
  },

  close(action){
    showScreen(null);
    VIEW.mode = 'shop';
    /* v26：还原进门前状态，而不是无脑显示（见上方 _pauseBtnBefore 说明） */
    $('pauseBtn').classList.toggle('on', !!this._pauseBtnBefore);
    const r = this.resolve;
    this.resolve = null;
    if(r) r(action);
  },

  /* v26：「返回主菜单」时调用。
     若不主动 resolve，open() 返回的 Promise 会永远挂起，
     留下一条永不结束的 serveOneGuest 协程（虽不致命，但属状态泄漏）。
     解成 'abort' 后，serveOneGuest 紧随其后的 if(Game.abort) return 会干净退栈。 */
  cancel(){
    const r = this.resolve;
    this.resolve = null;
    if(r) r('abort');
  }
};

(function bindRecGestures(){
  const el = $('scr-rec');
  const S = recState;

  function ptDist(){
    const arr = [...S.pointers.values()];
    if(arr.length < 2) return 0;
    const dx = arr[0].x - arr[1].x, dy = arr[0].y - arr[1].y;
    return Math.hypot(dx, dy);
  }

  el.addEventListener('pointerdown', e => {
    if(e.target.closest('button')) return;
    el.setPointerCapture(e.pointerId);
    S.pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
    S.moved = false;

    if(S.pointers.size === 1){
      S.dragging = true;
      S.lastX = e.clientX; S.lastY = e.clientY;
      S.lastInput = performance.now();

      // 长按
      S.longPressTimer = setTimeout(() => {
        if(!S.moved){
          toast(RecView.track ? (RecView.track.genre + ' · ' + RecView.track.moods.join('/') + ' · ★'.repeat(RecView.track.rarity)) : '');
          S.longPressTimer = null;
        }
      }, 500);

      // 双击检测
      const now = performance.now();
      if(now - S.lastTapTime < 300 && Math.hypot(e.clientX - S.lastTapX, e.clientY - S.lastTapY) < 30){
        flipRecord();
        S.lastTapTime = 0;
      } else {
        S.lastTapTime = now; S.lastTapX = e.clientX; S.lastTapY = e.clientY;
      }
    } else if(S.pointers.size === 2){
      S.pinchDist = ptDist();
      S.dragging = false;
      if(S.longPressTimer){ clearTimeout(S.longPressTimer); S.longPressTimer = null; }
    }
  });

  el.addEventListener('pointermove', e => {
    if(!S.pointers.has(e.pointerId)) return;
    const p = S.pointers.get(e.pointerId);
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    if(Math.hypot(dx,dy) > 3) S.moved = true;

    if(S.pointers.size === 1 && S.dragging){
      S.targetY += dx * 0.011;
      S.targetX = clamp(S.targetX + dy * 0.008, -0.9, 0.9);
      S.lastInput = performance.now();
      if(S.longPressTimer && S.moved){ clearTimeout(S.longPressTimer); S.longPressTimer = null; }
    } else if(S.pointers.size === 2){
      const d = ptDist();
      if(S.pinchDist > 0){
        S.scale = clamp(S.scale * (d / S.pinchDist), 0.7, 1.7);
      }
      S.pinchDist = d;
      S.lastInput = performance.now();
    }
  });

  function up(e){
    S.pointers.delete(e.pointerId);
    if(S.pointers.size === 0) S.dragging = false;
    if(S.pointers.size < 2) S.pinchDist = 0;
    if(S.longPressTimer){ clearTimeout(S.longPressTimer); S.longPressTimer = null; }
    S.lastInput = performance.now();
  }
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
  el.addEventListener('pointerleave', up);

  function flipRecord(){
    const cur = S.targetY;
    const turns = Math.round((cur + Math.PI) / Math.PI);
    S.targetY = turns * Math.PI;
    S.lastInput = performance.now();
  }
  window.__flipRecord = flipRecord;
})();

/* ------------------------- 6. 界面管理 ------------------------- */
const SCREENS = ['scr-boot','scr-start','scr-pause','scr-inv','scr-rec','scr-player','scr-collection','scr-ach','scr-settings','scr-report','scr-shop'];

/* v21：属于"菜单/非局内"的界面。进入这些界面必须撤掉对话框。 */
const MENU_SCREENS = ['scr-boot','scr-start','scr-collection','scr-ach','scr-settings'];

/* v21：真正"离开局内会话"的界面。
   只有进入这些界面才做硬重置（清掉挂起的 Dialogue.play 状态）。
   注意不能把 scr-collection / scr-settings 也算进来——
   它们在暂停菜单里也能进，硬重置会让对话协程永久挂起、返回局内后卡死。 */
const LEAVE_GAME_SCREENS = ['scr-boot','scr-start'];

/* v21：撤掉对话框。
   permanent=true 时连 Dialogue 的挂起状态一起清掉，
   避免回到主菜单后又被 _pauseCtrl.resume() 还原出来。 */
function hideDialogue(permanent){
  const d = $('dlg');
  if(!d) return;
  d.classList.remove('on');
  if(!permanent) return;
  d.dataset.wasOn = '';
  try{
    if(typeof Dialogue !== 'undefined' && Dialogue){
      /* v21：作废所有"因暂停而被推迟、尚未执行"的 play()。
         没有这一步，解除暂停时 _do 会在主菜单上把气泡重新挂出来。 */
      Dialogue._epoch = (Dialogue._epoch || 0) + 1;
      if(Dialogue.timer){ clearInterval(Dialogue.timer); Dialogue.timer = null; }
      Dialogue.typing = false;
      Dialogue._timerPaused = false;
      Dialogue.lines = [];
      Dialogue.idx = 0;
      /* 关键：把挂起的 play() 唤醒而不是丢弃。
         丢弃会让 serveOneGuest 里的 await 永远不返回，
         留下一条永不结束的协程；唤醒后它会顺着 Game.abort 立刻 return，
         整条 runOneDay 调用栈干净退出（并把已成交的客人结算掉）。 */
      const r = Dialogue.resolve;
      Dialogue.resolve = null;
      if(r){ try{ r(); }catch(e){} }
    }
  }catch(e){}
}

/* v21：切屏时切换 8bit BGM。
   v26 重写：不再"一屏一映射"，因为那样必然出错（见下方 BGM_CTX 说明）。

   ── 模型：3 个"音乐面" + 任意多个"子屏" ──
   游戏里有三个互不相同的音乐面（正是需求要的三首 BGM）：
     主界面 / 暂停菜单 / 局内
   其余界面（收藏、成就、设置、观赏唱片、进货、日结、店铺管理…）
   都不是音乐面，而是**从某个音乐面打开的子屏**——
   它们一律继承"打开它时所处的音乐面"。

   于是「局内 → 暂停 → 收藏」听的是暂停曲（人还在暂停里），
        「主菜单 → 收藏」听的是主菜单曲，
        「局内 → 选唱片」听的是局内曲。
   子屏与音乐面是多对多的（收藏从主菜单和暂停菜单都能进），
   这正是"按屏名写死一首"必然出错的原因。 */
const BGM_FIXED_MAP = {
  'scr-boot':   'menu',   /* 启动页归在主界面音乐面 */
  'scr-start':  'menu',
  'scr-pause':  'pause',
  'scr-player': 'none'    /* 试听/播放唱片时让位给唱片本身 */
};

/* v26：BGM 音乐面（会话语境）。
   ── 为什么必须显式维护，而不能靠屏名反推 ──
   scr-rec（观赏唱片）、null（无屏 = 店铺视角）这两个"屏名"
   在**不同音乐面**下都会出现：
     · 主菜单收藏页点开一张唱片 → scr-rec / null
     · 局内接待客人时选唱片     → 同样是 scr-rec / null
   光按屏名映射，必然有一边张冠李戴。
   最典型的表现：在**主菜单**的收藏页点开一张唱片，
   BGM 会错播成**局内曲**。

   一开始试过"进 scr-collection 就置 menu、进 scr-pause 就置 game"，
   但那条路同样是错的：scr-collection / scr-ach / scr-settings
   这仨**从主菜单和暂停菜单都能进**，也都能原路返回。
   「局内 → 暂停 → 收藏 → 返回 → 继续营业」这条路径上，
   中途任何一次误置 menu，都会让返回局内后错播主菜单曲。

   所以定下一条硬规则：
     BGM_CTX 只在**音乐面边界**变化，子屏进出不改变它。
   音乐面边界：
     · 落回主界面两屏      → 自动归位 'menu'
     · 进入暂停菜单        → 自动置 'pause'
     · 从主菜单进局内      → 显式 setBgmCtx('game')
       （唯一无法从屏名推断的一处：scr-start → null 与
         scr-pause → null 目标屏名相同，但含义不同） */
let BGM_CTX = 'menu';   /* 'menu' | 'pause' | 'game' */
function setBgmCtx(ctx){
  BGM_CTX = (ctx === 'game' || ctx === 'pause') ? ctx : 'menu';
}
function getBgmCtx(){ return BGM_CTX; }

function applyBgmForScreen(id){
  try{
    if(typeof Bgm === 'undefined' || !Bgm) return;

    /* 1) 音乐面自动归位：屏名本身足以判定"人在哪个面"时，就地更新语境。
          这样"回到主菜单"无需任何调用点记得手动重置。 */
    if(id === 'scr-boot' || id === 'scr-start') BGM_CTX = 'menu';
    else if(id === 'scr-pause') BGM_CTX = 'pause';

    /* 2) 再决定放哪首：固定面放固定曲，子屏继承当前音乐面 */
    let key;
    if(Object.prototype.hasOwnProperty.call(BGM_FIXED_MAP, id)){
      key = BGM_FIXED_MAP[id];
    } else {
      key = BGM_CTX;          /* 'menu' | 'pause' | 'game' 恰好就是三个曲目 key */
    }
    Bgm.set(key);
  }catch(e){}
}
/* v26：暴露给外部自检用（脚本作用域的 const/let 不在 window 上） */
window.setBgmCtx         = setBgmCtx;
window.getBgmCtx         = getBgmCtx;
window.applyBgmForScreen = applyBgmForScreen;

function showScreen(id){
  SCREENS.forEach(s => $(s).classList.toggle('on', s === id));
  /* v21：离开局内时撤掉对话框。
     - 回到主菜单/启动页：硬重置（同时清 dataset.wasOn，防 _pauseCtrl.resume() 复活气泡）
     - 收藏/成就/设置：只隐藏。这些界面在暂停菜单里也能进，
       此时对话被打断但尚未结束，硬重置会让对话协程永远等不到 resolve。 */
  if(LEAVE_GAME_SCREENS.indexOf(id) >= 0) hideDialogue(true);
  else if(MENU_SCREENS.indexOf(id) >= 0) hideDialogue(false);
  applyBgmForScreen(id);
}
/* v26：当前正在显示的是哪个界面；都没开则返回 null（= 店铺视角） */
function currentOnScreen(){
  for(let i = 0; i < SCREENS.length; i++){
    const el = $(SCREENS[i]);
    if(el && el.classList.contains('on')) return SCREENS[i];
  }
  return null;
}

/* v26：暂停前的"现场"，用于「继续营业」时原样还原。
   ── 为什么必须有它（这是一处真实软锁的根因）──
   之前 resume 一律 showScreen(null)，等于把暂停前打开的界面全抹掉。
   而局内给客人选唱片的流程是这样的：
     openInventoryForGuest()  → 玩家点卡片
     RecView.open(track)      → 显示 scr-rec，并返回一个 Promise
     玩家在唱片界面点 ☰ 暂停    → scr-pause
     「继续营业」              → showScreen(null) ← scr-rec 被抹掉
   于是 RecView.open() 的 resolve 永远等不到 RecView.close()，
   serveOneGuest 卡在 await 上：客人永远无法成交、剧情永远不推进。
   表现就是"暂停回来画面回到店铺视角、客人交付不了、游戏卡死"。
   修法：暂停时记住现场，继续营业时还原它。 */
let _prePauseScreen = null;   /* null = 店铺视角；'scr-rec' = 唱片界面 */
let _prePauseCtx    = 'game'; /* 暂停时所处的音乐面，决定还原后放哪首曲 */

function beginPause(screenId){
  _prePauseScreen = (screenId === undefined) ? currentOnScreen() : screenId;
  _prePauseCtx    = getBgmCtx();
}
function takePauseRestore(){
  const back = _prePauseScreen;
  const inGame = (_prePauseCtx === 'game');
  _prePauseScreen = null;
  _prePauseCtx = 'game';
  return { screen: back, inGame: inGame };
}
function toast(msg, ms){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(t._t);
  t._t = setTimeout(()=>t.classList.remove('on'), ms || 1800);
}

function modal(html, opts){
  opts = opts || {};
  return new Promise(resolve => {
    var _do = function(){ if(!opts.bypassPause && window._pauseCtrl && window._pauseCtrl.paused && window._pauseCtrl.promise){ window._pauseCtrl.promise.then(_do); return; }
    const box = $('modalBox');
    box.innerHTML = html;
    $('modal').classList.add('on');
    box.querySelectorAll('button[data-val]').forEach(b=>{
      b.onclick = () => {
        $('modal').classList.remove('on');
        resolve(b.dataset.val);
      };
    });
    };
    _do();
  });
}

const SAVE_KEY = 'record_shop_save_v04';

function save(){
  try{
    const data = {
      day: Game.day, coins: Game.coins, inventory: Game.inventory,
      shopLevel: Game.shopLevel, recordPlayerLevel: Game.recordPlayerLevel,
      decor: Game.decor, repGood: Game.repGood, repBad: Game.repBad,

      _dayInProgress: !!Game._dayInProgress,

      _dayGood: Game._dayGood || 0,
      /* v20：成就依赖的跨天字段之前没存，导致读档后部分成就判定丢失 */
      seenStories: Game.seenStories || [],
      goodStories: Game.goodStories || [],
      usedStories: Game.usedStories || [],
      _rareSold: Game._rareSold || 0,
      _bigSale: !!Game._bigSale,
      _perfectDay: !!Game._perfectDay,
      _usedAd: !!Game._usedAd,
      /* v21：正在服务第几位客人 / 该客人是否已成交（防止中途退出后重复计价） */
      _curGuest: (typeof Game._curGuest === 'number' ? Game._curGuest : -1),
      _curGuestDone: !!Game._curGuestDone
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
    refreshSaveInfo();
  }catch(e){}
}
function load(){
  try{
    const s = localStorage.getItem(SAVE_KEY);
    if(!s) return false;
    const d = JSON.parse(s);
    Object.assign(Game, {
      day: d.day ?? 1, coins: d.coins ?? 0, inventory: d.inventory ?? [],
      shopLevel: d.shopLevel ?? 1, recordPlayerLevel: d.recordPlayerLevel ?? 1,
      decor: d.decor ?? Game.decor, repGood: d.repGood ?? 0, repBad: d.repBad ?? 0,
      stats: d.stats ?? Game.stats, collection: d.collection ?? [],
      achievements: d.achievements ?? [], adBoost: d.adBoost ?? 0,
      /* v20 当天进度 */
      _dayInProgress: !!d._dayInProgress,
      guestsToday: d.guestsToday || 0,
      dayStories: d.dayStories || [],
      daySoldList: d.daySoldList || [],
      dayIncome: d.dayIncome || 0,
      dayExpense: d.dayExpense || 0,
      dayCollected: d.dayCollected || [],
      _dayMoods: new Set(d._dayMoods || []),
      _dayGood: d._dayGood || 0,
      seenStories: d.seenStories || [],
      goodStories: d.goodStories || [],
      usedStories: d.usedStories || [],
      _rareSold: d._rareSold || 0,
      _bigSale: !!d._bigSale,
      _perfectDay: !!d._perfectDay,
      _usedAd: !!d._usedAd,
      /* v21：局内进度原子性 */
      _curGuest: (typeof d._curGuest === 'number' ? d._curGuest : -1),
      _curGuestDone: !!d._curGuestDone
    });
    /* v21：读档时若发现"正在服务中且已成交"的残留标记（异常退出），
       把它结算掉，避免这位客人被重复接待。 */
    if(Game._curGuestDone && Game._curGuest >= 0 && Game._curGuest >= Game.guestsToday){
      Game.guestsToday = Math.min(5, Game._curGuest + 1);
    }
    Game._curGuest = -1;
    Game._curGuestDone = false;
    return true;
  }catch(e){ return false; }
}
/* v20：本次会话是否可续跑当天（已抽完卡、当天未结束、客人未服务满） */
function canResumeDay(){
  return !!Game._dayInProgress

    && (Game.guestsToday || 0) < 5;

function hasSave(){ return !!localStorage.getItem(SAVE_KEY); }

  const si = $('saveInfo'); if(si) si.textContent = txt;

/* ------------------------- 10. 对话系统 ------------------------- */
const Dialogue = {
  lines: [], idx:0, typing:false, charIdx:0, timer:null, resolve:null,
  /* v21：世代号。离开局内会话（回主菜单/启动页）时自增，
     用来作废"暂停期间被推迟、解除暂停后才执行"的 _do。
     否则气泡会在主菜单上被重新挂出来。 */
  _epoch: 0,

  play(lines){
    var self = this;
    var ep = this._epoch;          /* 捕获发起时的世代 */
    return new Promise(function(resolve){
      var _do = function(){
        /* v21：等待暂停解除的这段时间里，玩家可能已经离开局内会话
           （走「暂停 → 返回主菜单」这条路）。此时必须让这次对话作废，
           否则气泡会被挂到主菜单上。
           判据只用两个，不能用"是否有菜单界面在显示"——
           「继续营业」路径里 showScreen(null) 排在 resume() 之后，
           那一刻 scr-pause 还亮着，那样会误伤正常恢复。 */
        var leftGame = false;
        try{
          if(typeof Game !== 'undefined' && Game && Game.abort) leftGame = true;
        }catch(e){}
        if(ep !== self._epoch || leftGame){ resolve(); return; }
        self.lines = lines;
        self.idx = 0;
        self.resolve = resolve;
        $('dlg').classList.add('on');
        /* v19：对话开场提示音 */
        if(window.Sfx) Sfx.open();
        self.render();
      };
      if(window._pauseCtrl && window._pauseCtrl.paused && window._pauseCtrl.promise){ window._pauseCtrl.promise.then(_do); } else { _do(); }
    });
  },

  render(){
    const line = this.lines[this.idx];
    if(!line){ this.finish(); return; }
    const [who, text] = line;
    const nameEl = $('dlgName');
    if(who === 'g'){ nameEl.textContent = '客人'; nameEl.classList.remove('me'); }
    else { nameEl.textContent = '店主'; nameEl.classList.add('me'); }

    this.full = text;
    this.charIdx = 0;
    this.typing = true;
    $('dlgNext').style.opacity = '0';
    $('dlgText').textContent = '';

    clearInterval(this.timer);
    this.timer = setInterval(()=>{
      this.charIdx++;
      /* PATCH v19 逐字说话音效：时长与整句文本长度相关 */
      if(window.Sfx && this.full){
        var ch = this.full.charAt(this.charIdx - 1);
        if(ch && !/[\s，。！？、；：""''《》（）…—]/.test(ch)){
          Sfx.speak(this.full, this.charIdx);
        }
      }
      $('dlgText').textContent = this.full.slice(0, this.charIdx);
      if(this.charIdx >= this.full.length){
        clearInterval(this.timer);
        this.typing = false;
        $('dlgNext').style.opacity = '1';
      }
    }, 28);
  },

  advance(){
    if(this.typing){
      clearInterval(this.timer);
      this.typing = false;
      $('dlgText').textContent = this.full;
      $('dlgNext').style.opacity = '1';
      /* 跳过打字机时，补一段与整句长度相符的电子音 */
      if(window.Sfx && this.full) Sfx.speakAll(this.full);
      return;
    }
    this.idx++;
    if(this.idx >= this.lines.length){ this.finish(); return; }
    this.render();
  },

  finish(){
    clearInterval(this.timer);
    $('dlg').classList.remove('on');
    const r = this.resolve;
    this.resolve = null;
    if(r) r();
  }
};

function pickStory(){
  const pool = (window.STORIES || []).filter(s => !Game.usedStories.includes(s.id));
  const list = pool.length ? pool : (window.STORIES || []);
  if(!list.length) return null;
  const s = list[rnd(list.length)];
  Game.usedStories.push(s.id);
  if(Game.usedStories.length > 40) Game.usedStories.shift();

/* ------------------------- 12. 契合度判定 ------------------------- */
function judge(track, story){
  const wants = story.wants || {};
  let score = 0;
  const genreHit = (wants.genres||[]).includes(track.genre);
  if(genreHit) score += 2;
  let moodHits = 0;
  (wants.moods||[]).forEach(m => { if(track.moods.includes(m)) moodHits++; });
  score += moodHits;

  let result;
  if(score >= 3) result = 'good';
  else if(score >= 1) result = 'ok';
  else result = 'bad';
  return { result, score, genreHit, moodHits };
}

/* PATCH v10 可视化 */
function hexA(hex, a){
  const hh = hex.replace('#','');
  const r = parseInt(hh.substr(0,2), 16);
  const g = parseInt(hh.substr(2,2), 16);
  const b = parseInt(hh.substr(4,2), 16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
}
function drawViz(track){
  var c = document.getElementById('viz');
  if(!c) return;
  var ctx = c.getContext('2d');
  if(!c.width){ c.width = Math.floor(window.innerWidth * 0.6); c.height = Math.floor(window.innerHeight * 0.6); }
  var w = c.width, hh = c.height;
  ctx.fillStyle = 'rgba(10,6,18,0.26)';
  ctx.fillRect(0, 0, w, hh);
  var vol = 0.35;
  if(AudioEngine.analyser && AudioEngine.freq){
    AudioEngine.analyser.getByteFrequencyData(AudioEngine.freq);
    var sum = 0;
    for(var i=0;i<32;i++) sum += AudioEngine.freq[i];
    vol = clamp(sum / (32*255), 0.1, 1);
  }
  var t = performance.now() / 1000;
  var cx = w/2, cy = hh*0.40;
  var c1 = (track && track.colors[0]) || '#ff2e88';
  var c2 = (track && track.colors[1]) || '#5fe8ff';
  for(var k=0;k<5;k++){
    var p = ((t*0.32 + k*0.2) % 1);
    var radius = p * Math.max(w,hh) * 0.75;
    var alpha = (1-p) * (0.16 + vol*0.42);
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI*2);
    ctx.strokeStyle = k%2 ? hexA(c1, alpha) : hexA(c2, alpha);
    ctx.lineWidth = 2 + vol*14;
    ctx.stroke();
  }
  if(AudioEngine.freq){
    var n = 40, bw = w / n;
    for(var j=0;j<n;j++){
      var v = AudioEngine.freq[j*2] / 255;
      var bh = v * hh * 0.22;
      ctx.fillStyle = hexA(c1, 0.55);
      ctx.fillRect(j*bw + bw*0.18, hh - bh - hh*0.06, bw*0.64, bh);
    }
  }
}

async function spawnGuest(story){
  // 清掉旧客人
  if(guestGroup){
    shopScene.remove(guestGroup);
    guestGroup.traverse(o=>{ if(o.geometry) o.geometry.dispose(); if(o.material) o.material.dispose(); });
    guestGroup = null;
  }

  guestGroup = makeGuest(story);
  guestGroup.position.set(4.2, 0, 0.15);
  guestGroup.rotation.y = -Math.PI/2;
  shopScene.add(guestGroup);

  // 走进来
  await walkTo(0.2, 0.15, 1300);
  // 转身面向镜头
  await tweenRot(guestGroup, -Math.PI/2, 0, 420);

function hashStr(s){
  let h = 0;
  for(let i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) | 0;
  return Math.abs(h);
}

function walkTo(tx, tz, dur){
  return new Promise(resolve => {
    const sx = guestGroup.position.x, sz = guestGroup.position.z;
    const t0 = performance.now();
    const step = () => {
      const p = clamp((performance.now()-t0)/dur, 0, 1);
      const e = p<0.5 ? 2*p*p : 1-Math.pow(-2*p+2,2)/2;
      guestGroup.position.x = sx + (tx-sx)*e;
      guestGroup.position.z = sz + (tz-sz)*e;
      // 走路摆动
      const sw = Math.sin(performance.now()/110) * 0.35 * (1-p);
      const u = guestGroup.userData;
      if(u.legL){ u.legL.rotation.x = sw; u.legR.rotation.x = -sw; }
      if(u.armL){ u.armL.rotation.x = -sw*0.7; u.armR.rotation.x = sw*0.7; }
      if(p < 1) requestAnimationFrame(step);
      else {
        if(u.legL){ u.legL.rotation.x = 0; u.legR.rotation.x = 0; }
        if(u.armL){ u.armL.rotation.x = 0; u.armR.rotation.x = 0; }
        resolve();
      }
    };
    step();
  });
}

function tweenRot(obj, from, to, dur){
  return new Promise(resolve => {
    const t0 = performance.now();
    const step = () => {
      const p = clamp((performance.now()-t0)/dur, 0, 1);
      obj.rotation.y = from + (to-from) * (1-Math.pow(1-p,3));
      if(p<1) requestAnimationFrame(step); else resolve();
    };
    step();
  });
}

async function guestLeave(){

  await tweenRot(guestGroup, 0, Math.PI/2, 380);
  await walkTo(4.6, 0.15, 1200);

}

async function serveOneGuest(story){
  if(!story){
    /* 兜底：从故事池里拿一个 */
    const pool = window.STORIES || [];
    if(!pool.length){ toast('故事库为空'); return; }
    story = pool[rnd(pool.length)];
  }

  /* v19 修复：成就 a07「雨夜之约」/ a11「来自未来的客人」依赖 Game.seenStories，
     但记录它的 pickStory() 从未被调用 → 这两个成就永远解锁不了。
     现在在真正接待客人时登记。 */
  if(!Game.seenStories) Game.seenStories = [];
  if(Game.seenStories.indexOf(story.id) < 0) Game.seenStories.push(story.id);

  await spawnGuest(story);
  await Dialogue.play(story.lines);
  if(Game.abort) return;

  let chosen = null;
  while(!chosen){
    if(Game.abort) return;
    const track = await openInventoryForGuest();
    /* v28：null = 会话被作废（清空存档 / 回主菜单），干净退栈。
       少了这一句，null 会被拿去 RecView.open()，进而读 track.name 报错。 */
    if(track === null || track === undefined) return;
    if(Game.abort) return;
    const action = await RecView.open(track);
    if(action === 'give'){ chosen = track; }
    if(Game.abort) return;
  }

  const j = judge(chosen, story);
  let price = 0;
  if(j.result === 'good') price = Math.round(chosen.basePrice * rarityMult(chosen.rarity) * decorMult() * shopMult() * 1.6);
  else if(j.result === 'ok') price = Math.round(chosen.basePrice * rarityMult(chosen.rarity) * decorMult() * shopMult() * 1.0);

  const idx = Game.inventory.indexOf(chosen.id);
  if(idx >= 0) Game.inventory.splice(idx, 1);

  Game.daySoldList.push({ track:chosen, result:j.result, price });
  if(price > 0){
    Game.coins += price;
    var _hrv = document.getElementById('hudRevenueVal');
    if(_hrv){ var _t=0; for(var _i=0;_i<Game.daySoldList.length;_i++) _t += Game.daySoldList[_i].price; _hrv.textContent = '+' + _t; }
    Game.dayIncome += price;
    Game.stats.income += price;
    Game.stats.sold++;
  }
  if(j.result === 'good'){
    Game.stats.good++; Game._dayGood++; Game.repGood++;
    if(!Game.goodStories) Game.goodStories = [];
    if(Game.goodStories.indexOf(story.id) < 0) Game.goodStories.push(story.id);
  }
  else if(j.result === 'ok'){ Game.stats.ok++; }
  else { Game.stats.bad++; Game.repBad++; }

  Game.stats.served++;
  if(chosen.rarity >= 3 && j.result !== 'bad') Game._rareSold = (Game._rareSold||0) + 1;
  if(price >= 300) Game._bigSale = true;
  chosen.moods.forEach(function(m){ Game._dayMoods.add(m); });

  /* v21：到此为止这位客人的交易已经全部落定（金币已加、库存已扣、统计已记）。
     这段全是同步代码，中途不会被打断，所以在这里打标记是原子的。
     若之后玩家中途返回主菜单，runOneDay 会据此把这位客人计为"已服务"。 */
  Game._curGuestDone = true;

  const endingText = story.endings[j.result];
  await Dialogue.play([['g', endingText]]);

  /* v19：成交结果音效 */
  if(window.Sfx){
    if(j.result === 'good') Sfx.success();
    else if(j.result === 'ok') Sfx.coin();
    else Sfx.fail();
  }

  const icon = j.result === 'good' ? '💖' : (j.result === 'ok' ? '🙂' : '💔');
  const title = j.result === 'good' ? '非常满意' : (j.result === 'ok' ? '还算满意' : '被拒绝了');
  const sub = j.result === 'bad' ? '客人失落地离开了，但故事还在。' :

  await modal(`
    <h3>${icon} ${title}</h3>
    <p>《${chosen.name}》\n${chosen.genre} · ${chosen.moods.join(' / ')}</p>
    ${price>0 ? `<div class="big">+${price} 金币</div>` : `<div class="big" style="color:var(--muted)">0 金币</div>`}
    <p>${sub}</p>
    <button data-val="ok">继续</button>
  `);

  await guestLeave();
  checkAchievements();
  save();
}
/* PATCH v12 进货配平 */
function permute5(){
  const result = [];
  const perm = [];
  const used = [false, false, false, false, false];
  function bt(){
    if(perm.length === 5){ result.push(perm.slice()); return; }
    for(let i = 0; i < 5; i++){
      if(used[i]) continue;
      used[i] = true;
      perm.push(i);
      bt();
      perm.pop();
      used[i] = false;
    }
  }
  bt();
  return result;
}
const ALL_PERMS = permute5();

function checkMatch(inventory, stories){
  for(let pi = 0; pi < ALL_PERMS.length; pi++){
    const perm = ALL_PERMS[pi];
    let good = 0, nonBad = 0;
    for(let i = 0; i < 5; i++){
      const t = TRACK_BY_ID[inventory[perm[i]]];
      if(!t) continue;
      const j = judge(t, stories[i]);
      if(j.result === 'good') good++;
      if(j.result !== 'bad') nonBad++;
    }

function stockScreen(){
  return new Promise(resolve => {
    const c2Lock = Game.day < 3, c3Lock = Game.day < 7;
    const html = '<h3>今日进货</h3><p>第 ' + Game.day + ' 天 · 金币 <b style="color:var(--gold)">' + Game.coins + '</b></p>' +
      '<button data-val="normal">普通进货 · 免费<br><span style="font-size:11px;opacity:.8">随机 5 张</span></button>' +
      '<button data-val="fine" ' + (c2Lock?'disabled style="opacity:.4"':'') + '>精选 · 150 金币<br><span style="font-size:11px;opacity:.8">' + (c2Lock?'第 3 天解锁':'5 张 + 1 张指定情绪') + '</span></button>' +
      '<button data-val="rare" ' + (c3Lock?'disabled style="opacity:.4"':'') + '>稀有 · 450 金币<br><span style="font-size:11px;opacity:.8">' + (c3Lock?'第 7 天解锁':'5 张 + 1 张 ★★ 以上') + '</span></button>';
    modal(html).then(async val => {
      let cost = 0, bonus = null;
      if(val === 'fine'){ cost = 150; bonus = 'mood'; }
      if(val === 'rare'){ cost = 450; bonus = 'rare'; }
      if(Game.coins < cost){ toast('金币不足，改为普通进货'); cost = 0; bonus = null; }
      Game.coins -= cost; Game.dayExpense += cost; Game.stats.expense += cost;

      /* 广告推广效果：投放期内每批进货额外赠送 1 张稀有唱片 */
      if(Game.adBoost > 0){ bonus = bonus || 'ad'; }

      /* 循环抽取直到满足配平条件 */
      let finalInv = null, finalStories = null;
      const storyPoolMaster = (window.STORIES || []).slice();
      function makeBonus(list){
        if(bonus === 'mood'){
          const moods = MOODS[rnd(MOODS.length)];
          const cand = TRACKS.filter(function(t){ return t.moods.indexOf(moods) >= 0; });
          if(cand.length) list.push(cand[rnd(cand.length)].id);
        } else if(bonus === 'rare' || bonus === 'ad'){
          const cand = TRACKS.filter(function(t){ return t.rarity >= 2; });
          if(cand.length) list.push(cand[rnd(cand.length)].id);
        }
      }
      for(let attempt = 0; attempt < 300; attempt++){
        const inv = [];
        for(let i = 0; i < 5; i++) inv.push(TRACKS[rnd(TRACKS.length)].id);
        makeBonus(inv);
        /* 抽 5 个不重复故事 */
        const pool = storyPoolMaster.slice();
        const stories = [];
        for(let i = 0; i < 5 && pool.length > 0; i++){
          const idx = rnd(pool.length);
          stories.push(pool[idx]);
          pool.splice(idx, 1);
        }
        if(stories.length < 5) continue;
        if(checkMatch(inv.slice(0, 5), stories)){
          finalInv = inv; finalStories = stories;
          break;
        }
      }
      /* 兜底：兜不住也存 */
      if(!finalInv){
        finalInv = [];
        for(let i = 0; i < 5; i++) finalInv.push(TRACKS[rnd(TRACKS.length)].id);
        makeBonus(finalInv);
        finalStories = [];
        const pool = storyPoolMaster.slice();
        for(let i = 0; i < 5; i++){ const idx = rnd(pool.length); finalStories.push(pool[idx]); pool.splice(idx,1); }
      }

      /* v19 修复：付费/广告赠送的那张唱片原被 slice(0,5) 丢弃，玩家花了钱却拿不到。
         现在完整保留 6 张，多出的 1 张是额外选择。 */
      Game.inventory = finalInv.slice();
      Game.dayStories = finalStories;
      const drawn = finalInv.map(function(id){ return getTrackById(id); }).filter(Boolean);
      save();
      await showDrawScreen(drawn);
      resolve();
    });
  });
}

/* PATCH v16 反查动态唱片 */
function getTrackById(tid){
  if(TRACK_BY_ID[tid]) return TRACK_BY_ID[tid];
  var s = String(tid);
  if(s.charAt(0) === 's'){
    var sd = parseInt(s.slice(1), 10);
    if(!isNaN(sd)) return generateTrackFromSeed(sd);
  }
  return null;
}
function generateTrackFromSeed(seed){
  const r = mulberry32(Math.abs(seed) | 0);
  const genre = GENRES[Math.floor(r()*GENRES.length)];
  const moodN = r() < 0.55 ? 1 : 2;
  const moods = [];
  let guard = 0;
  while(moods.length < moodN && guard++ < 40){
    const m = MOODS[Math.floor(r()*MOODS.length)];
    if(!moods.includes(m)) moods.push(m);
  }
  const name = NAME_A[Math.floor(r()*NAME_A.length)] + NAME_B[Math.floor(r()*NAME_B.length)];
  const bpm = 60 + Math.floor(r()*80);
  const rootMidi = 48 + Math.floor(r()*12);
  const rr = r();
  const rarity = rr < 0.05 ? 3 : (rr < 0.25 ? 2 : 1);
  const id = 's' + seed;
  const track = {
    id: id, name, genre, moods, bpm, rootMidi,
    seed: seed, rarity,
    scaleName: GENRE_SCALE[genre] || 'minor',
    colors: GENRE_COLORS[genre],
    basePrice: Math.round(55 + r()*75)
  };
  TRACK_BY_ID[id] = track;
  return track;
}
