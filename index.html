  hide(){ const d = $('tutDemand'); if(d) d.classList.remove('on'); }
};

/* -------- 教程主体 -------- */
/* v31 重构：教程从"改造第 1 天"改成"第 1 天之前的一个独立阶段"。
   ── 用户的要求 ──
   「新手教学发生在第一天之前，无论是跳过还是正常结束，结束后都应该
     重新进入第一天流程：抽 5 张卡进库存；确保第一天开始前库存是空的！」
   ── v30 的做法为什么不合要求 ──
   v30 把第 1 天布置成"教程日"（预设客人 + 3 张演示唱片 + _tutorialDay，
   并让 canResumeDay() 返回 true 来跳过抽卡）。三个后果：
     · 教程跑完时 day 已经 ++ 成 2 —— 玩家真正的"第 1 天"变成了第 2 天
     · 演示用的 3 张唱片一直留在库存里，第 2 天抽卡前库存不干净
     · 用户报告的"教程结束后点开始游戏又回到教程界面"：
       resetGame() 会删掉 TUTORIAL_KEY，于是"清除存档后重开"永远重念教程
   ── 现在的状态机（只有一个判据）──
   教程是否跑过，完全由 localStorage 里的 TUTORIAL_KEY 决定：
     · 没跑过  → gameLoop 先跑 runDemo()，跑完（或跳过）才进第 1 天
     · 跑过了  → 直接进第 1 天
   这就同时解决了三件事：
     · day 全程保持 1，教程结束时 runOneDay 会照常走 stockScreen() 抽 5 张
     · runDemo 结束时会显式清空库存（用户要求"第一天开始前库存是空的"）
     · TUTORIAL_KEY 不再被 resetGame() 删除，所以"清除存档后重开"
       不会再撞回教程；想重看请用设置里的「重看新手教程」。
   ── 为什么中途退出不需要"续跑"逻辑 ──
   教程结束才 markTutorialDone()。玩家在教程中途返回主菜单，TUTORIAL_KEY
   仍未写入，下次进来 shouldRun() 照样为真 → 从头演一遍。教程只有 1 位客人、
   3 张唱片、且不结算任何真实营业数据，重演的成本极低，换来的是
   完全不需要维护"教程进度存档"这一套易错的状态。 */
const Tutorial = {
  active: false,
  /* 玩家点了「跳过」。与 Game.abort 的区别：它只结束教程这一段，
     整局会话仍然有效 —— serveOneGuest 里的守卫同时看这两个标志。
     ── v31.1：生命周期必须**显式管理**（这里踩过一个很贵的坑）──
     这个标志只描述"这一次 runDemo 被跳过"，所以它必须在 runDemo 返回后
     就失效，否则 serveOneGuest 的守卫会把**之后每一天的每一位客人**
     都当成"教程已经跳过"而直接 return —— 玩家进得了店，但客人不开口、
     打不开库存、sold 恒为 0、金币再也不涨。
     清除点有两处（都在"教程阶段真正结束"这个边界上）：
       1) gameLoop 里 `await Tutorial.runDemo()` 之后 —— 主要修复点
       2) runOneDay 开头 —— 防御性兜底，让不变量在营业日边界自我闭合
     千万不要在 finish() 里清：abort() 依赖这个标志让"正飞着"的
     serveOneGuest 从 await 处退栈（见 finish() 里的详细说明）。 */
  _aborted: false,
  _retried: false,

  /* 该不该跑：没看过教程。
     为什么只看 TUTORIAL_KEY，不额外看 day / 存档：见上方状态机说明。 */
  shouldRun(){
    return !tutorialDone();
  },

  abort(){
    if(!this.active) return;
    this._aborted = true;
    /* 先把两个"挂起的等待"解掉，再收尾 ——
       否则 serveOneGuest 会永远卡在 await 上（v28 修过的同类死锁）。 */
    cancelInvWait();
    if(typeof RecView !== 'undefined' && RecView.cancel) RecView.cancel();
    this.finish();
    toast('已跳过教程，开始第 1 天');
  },

  /* 回滚"累计"字段：教程是演练，不该污染真实进度。
     单独抽出来是因为它有两个调用点：
       · finish()        正常结束 / 跳过
       · abortGameSession() 教程中途「暂停 → 返回主菜单」
     第二处很容易漏 —— 漏了的话，玩家中途退出时会把这些脏数据
     留在存档里（例如凭空解锁几个成就、累计收入虚高）。
     幂等：_statSnap 只存在一次，回滚后置 null，重复调用是空操作。 */
  restoreStats(){
    if(!this._statSnap) return;
    const s = this._statSnap;
    this._statSnap = null;
    /* 演示那一位客人走的是**完整的** serveOneGuest，会顺带累加
       stats.served / stats.sold / stats.income、把 TUT_STORY.id 写进
       seenStories、把 __tutorial_radio__ 写进 goodStories、
       还可能点亮「第一桶金」这类按累计值判定的成就。
       这些都不是玩家真的做出来的业绩（第 1 天还没开始），
       所以整体还原 —— 教程只留下"学会了"这一个结果。 */
    Game.stats        = s.stats;
    Game.seenStories  = s.seenStories;
    Game.goodStories  = s.goodStories;
    Game.usedStories  = s.usedStories;
    Game.repGood      = s.repGood;
    Game.repBad       = s.repBad;
    Game._rareSold    = s._rareSold;
    Game._bigSale     = s._bigSale;
    Game._perfectDay  = s._perfectDay;
    Game.goldSold     = s.goldSold;
    /* 成就列表也要还原：checkAchievements() 在教程里已经 toast 过了。
       不还原的话玩家会"白拿"几个成就（而且之后再也弹不出提示）。 */
    Game.achievements = s.achievements;
    /* 金币刻意**不回滚**：演示的第一单是真实到账的，玩家在弹窗里
       看到了"+N 金币"，收走会显得像 bug。金额很小（约 100~160），
       而且第 1 天的普通进货免费，不会因此破坏经济平衡。 */
  },

  /* 教程收尾（正常结束 与 跳过 共用）。
     用户的核心要求在这里落实：**库存清空**、当日统计归零、
     教程标志落盘，然后交给 runOneDay 走一条干干净净的"第 1 天"。 */
  finish(){
    this.active = false;
    /* ⚠ 这里**不能**把 _aborted 复位（v31 踩过的坑）。
       ── 为什么 ──
       abort() 的调用点在「跳过」按钮的 click 里，而 runDemo 那一刻
       正挂在 await wait(1600) 上。abort() 先置 _aborted=true、
       再调 finish()；如果 finish() 顺手把 _aborted 清回 false，
       那么 runDemo 醒来时看到的仍是 false，于是**继续往下跑**
       await serveOneGuest() —— 教程被"跳过"了却还在演，
       而且 runOneDay() 永远轮不到执行：
       玩家看到的正是"跳过之后没有进入第一天"。
       _aborted 的生命周期应该是"一次 runDemo 之内"，
       由 runDemo() 自己在开头复位、由 gameLoop / runOneDay 在教程
       阶段结束后清除（见 Tutorial._aborted 的定义处）。
       finish() 踩过两次坑，一次都不能再错：
         · v30：顺手清了 → 跳过后教程继续演，runOneDay 永远轮不到
         · v31：忘了在别处清 → 之后每一天的客人都被守卫 return 掉
       （TUTORIAL_KEY 落盘后 runDemo 不会再跑，所以残留的 true 无害。） */
    Coach.hide();
    TutDemand.hide();
    /* 收掉对话框并作废挂起的 Dialogue.play()（跳过时会用到） */
    hideDialogue(true);
    unlockInputNow();

    this.restoreStats();

    /* ── 清场：这是"第一天开始前库存是空的"的实现 ──
       演示用的 3 张唱片（TUT_DEMO_IDS）绝不能留到第 1 天：
       它们只是教具，第 1 天的 5 张必须来自 stockScreen() 的抽卡。 */
    Game.inventory = [];
    Game.dayStories = [];
    Game._dayInProgress = false;
    Game.guestsToday = 0;
    Game.daySoldList = [];
    Game.dayIncome = 0; Game.dayExpense = 0;
    Game._dayMoods = new Set(); Game._dayGood = 0;
    Game.dayCollected = [];
    Game._curGuest = -1; Game._curGuestDone = false;
    /* 金边标记跟着演示唱片一起清掉（它们不是玩家买的货） */
    clearGoldMarks();

    markTutorialDone();
    save();
  },

  /* 教程演示主体。由 gameLoop 在第 1 天营业之前调用。
     复用真实的 serveOneGuest —— 玩家学到的就是之后每天要做的操作。 */
  async runDemo(){
    this.active = true;
    this._aborted = false;
    this._retried = false;

    /* 快照"累计"字段，供 finish() 回滚（见那里的说明）。
       stats 要深拷贝 —— 它是对象，serveOneGuest 就地改它。 */
    this._statSnap = {
      stats:        JSON.parse(JSON.stringify(Game.stats || {})),
      seenStories:  (Game.seenStories || []).slice(),
      goodStories:  (Game.goodStories || []).slice(),
      usedStories:  (Game.usedStories || []).slice(),
      repGood:      Game.repGood || 0,
      repBad:       Game.repBad || 0,
      _rareSold:    Game._rareSold || 0,
      _bigSale:     !!Game._bigSale,
      _perfectDay:  !!Game._perfectDay,
      goldSold:     Game.goldSold || 0,
      achievements: (Game.achievements || []).slice()
    };

    /* 布置演示现场。注意 day 保持 1 —— 教程不是"第 0 天"，
       它只是第 1 天开始前的一段。 */
    Game.guestsToday = 0;
    Game.daySoldList = [];
    Game.dayIncome = 0; Game.dayExpense = 0;
    Game._dayMoods = new Set(); Game._dayGood = 0;
    Game.dayCollected = [];
    Game.dayStories = [TUT_STORY, TUT_STORY, TUT_STORY, TUT_STORY, TUT_STORY];
    Game.inventory = TUT_DEMO_IDS.slice();
    /* ⚠ _dayInProgress 必须是 false（v30 在这里置了 true）：
       置 true 会让 canResumeDay() 在教程结束后返回 true，
       runOneDay 就会**跳过 stockScreen()** —— 玩家一张卡都抽不到，
       正是用户说的"没有进入第一天流程"。 */
    Game._dayInProgress = false;
    clearGoldMarks();
    save();

    Coach.show([
      { ic:'📖', text:'欢迎来到你的**唱片店**。开始营业之前，我们慢一点走一遍。',
        sub:'右上角随时可以跳过，跳过之后就是正常营业', target:null },
      { ic:'💬', text:'客人马上推门。**点屏幕任意位置**可以让对话往下走。',
        sub:'字还没打完时点一下 = 立刻显示整句；再点一下 = 下一句', target:'#dlg' }
    ]);

    /* 给开场语留出阅读时间（短了形同虚设，长了显得卡） */
    await wait(1600);
    if(Game.abort || this._aborted) return;

    await serveOneGuest(TUT_STORY);
    /* 两条出路都要在这里干净返回：
         Game.abort      → 整局会话作废（回主菜单 / 清档）
         this._aborted   → 玩家点了「跳过」，finish() 已经跑过了 */
    if(Game.abort || this._aborted) return;

    /* 收尾解说，然后把舞台交还给 runOneDay */
    this.deliveredGood();
    await wait(2400);
    if(Game.abort || this._aborted) return;
    this.finish();
  },

  /* ---- 以下四个是 serveOneGuest 会调用的解说点 ---- */

  /* 客人进门。这里是教程的"第二段开场"，但玩家此刻还停在
     runDemo() 的欢迎语上（"+点屏幕任意位置让对话往下走"），

/* ------------------------- 27. 启动 ------------------------- */
function boot(){
  /* v30：读档必须排在 initThree() 之前。
     原因：buildShopScene() 现在按 Game.theme 决定整间店的灯光/配色/陈设。
     如果先建场景再读档，玩家每次进游戏看到的第一眼都是默认霓虹店，
     要等下一次切场景才变 —— 存档里的装潢"不生效"是很明显的 bug。
     旧版没有这个顺序依赖（场景写死），所以原来是 initThree() 打头。 */
  load();
  initThree();
  onResize();
  refreshSaveInfo();

  /* v21：音频解锁。浏览器自动播放策略要求必须有用户手势，
     所以把解锁放在「点击开始游戏」上，顺带把 BGM 一起起播。 */
  function unlockAudio(){
    AudioEngine.init();
    if(AudioEngine.ctx && AudioEngine.ctx.state === 'suspended') AudioEngine.ctx.resume();
    if(window.Sfx && Sfx.init) Sfx.init();
  }

  // 启动页默认显示（其后进入主菜单 / 局内时会自动切 BGM）
  showScreen('scr-boot');
  applyBgmForScreen('scr-boot');

  /* v21：点击开始游戏 —— 解锁音频 → 进入主菜单 */
  var bootBtn = document.getElementById('bootStart');
  if(bootBtn){
    bootBtn.addEventListener('click', function(e){
      e.preventDefault();
      if(bootBtn._used) return;
      bootBtn._used = true;
      unlockAudio();
      try{ if(window.Sfx) Sfx.click(); }catch(err){}
      /* 主菜单 BGM 起播（此时已有用户手势，不会被自动播放策略拦下） */
      try{ if(window.Bgm) Bgm.set('menu'); }catch(err){}
      showScreen('scr-start');
    });
  }

  /* 兜底：任意位置首次点按也解锁音频（避免用户从别处进入时静音） */
  document.addEventListener('pointerdown', function once(){
    unlockAudio();
    document.removeEventListener('pointerdown', once);
  }, { once:true });

/* PATCH v09 自动加载
   v30：这段原本在 boot() 里再 load() 一次。现在 boot() 开头已经读过档，
   再读一次纯属重复；但因为读档会影响"该建哪套装潢"，这里保留一段
   兜底：如果发现当前场景的主题和存档不一致，重建一次。
   注意不能无条件 applyShopTheme() —— 那会在每次启动时多建一整间店。 */
(function(){
  try{
    if(!hasSave()) return;
    const want = (typeof Game !== 'undefined' && Game.theme) ? Game.theme : 'neon';
    const nowScene = (shopScene && shopScene.userData && shopScene.userData.themeId);
    if(nowScene !== want) applyShopTheme();
    console.log('[自动存档] 已恢复 第 ' + Game.day + ' 天 · 装潢 ' + themeDef(Game.theme).name);
  }catch(e){ console.warn('自动加载失败', e); }
})();
}

if(document.readyState === 'complete' || document.readyState === 'interactive'){

} else {

/* 点击水波纹 FX 层（P5 风联动） */
(function(){
  var fx = document.getElementById('fx');
  if(!fx) return;
  var ctx = fx.getContext('2d');
  var waves = [];
  function resize(){ fx.width = window.innerWidth; fx.height = window.innerHeight; }
  resize();
  window.addEventListener('resize', resize);
  function pickColor(target){
    if(!target) return '#ff2e88';
    if(target.closest('#recGive, .draw-btn, .menu-item[data-act="play"], .pl-ctrl button.big')) return '#ff2e88';
    if(target.closest('#recFlip, .pl-collect, #pauseBtn')) return '#ffd166';
    if(target.closest('.menu-item, .tbtn, .rbtn, .act-btn')) return '#5fe8ff';
    return '#c9a0ff';
  }
  document.addEventListener('pointerdown', function(e){
    waves.push({ x: e.clientX, y: e.clientY, t0: performance.now(), color: pickColor(e.target) });
    if(waves.length > 14) waves.shift();
  }, true);
  function loop(){
    requestAnimationFrame(loop);
    var now = performance.now();
    ctx.clearRect(0, 0, fx.width, fx.height);
    waves = waves.filter(function(w){ return now - w.t0 < 1300; });
    for(var i = 0; i < waves.length; i++){
      var w = waves[i];
      var p = (now - w.t0) / 1300;
      var alpha = (1 - p) * (1 - p);
      var maxR = Math.max(fx.width, fx.height) * 0.9;
      var r = p * maxR;
      ctx.save();
      ctx.globalAlpha = alpha * 0.8;
      ctx.strokeStyle = w.color;
      ctx.lineWidth = 2 + (1 - p) * 10;
      ctx.beginPath(); ctx.arc(w.x, w.y, r, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = alpha * 0.45;
      ctx.lineWidth = 1 + (1 - p) * 4;
      ctx.beginPath(); ctx.arc(w.x, w.y, r * 0.82, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = alpha * 0.22;
      ctx.beginPath(); ctx.arc(w.x, w.y, r * 1.15, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }
  }
  loop();
})();

/* 按钮点击碎片粒子 */
(function(){
  function burst(btn){
    var rect = btn.getBoundingClientRect();
    var cx = rect.left + rect.width / 2;
    var cy = rect.top + rect.height / 2;
    var fx = document.getElementById('fx');
    if(!fx) return;
    var ctx = fx.getContext('2d');
    var parts = [];
    for(var i = 0; i < 10; i++){
      var ang = (i / 10) * Math.PI * 2 + Math.random() * 0.6;
      var sp = 3 + Math.random() * 3;
      parts.push({ x: cx, y: cy, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp });
    }
    var t0 = performance.now();
    (function anim(){
      var el = (performance.now() - t0) / 480;
      if(el >= 1) return;
      requestAnimationFrame(anim);
      ctx.save();
      var a = 1 - el;
      for(var i = 0; i < parts.length; i++){
        var pp = parts[i];
        ctx.globalAlpha = a;
        ctx.fillStyle = i % 2 ? '#ff2e88' : '#5fe8ff';
        var xx = pp.x + pp.vx * (1 - a) * 18;
        var yy = pp.y + pp.vy * (1 - a) * 18;
        var sz = 2 + (1 - a) * 4;
        ctx.fillRect(xx - sz/2, yy - sz/2, sz, sz);
      }
      ctx.restore();
    })();
  }
  document.addEventListener('click', function(e){
    var b = e.target.closest('.menu-item, .rbtn, .act-btn, .draw-btn, .pl-collect, .tbtn, #pauseBtn, .card');
    if(b) burst(b);
  }, true);
})();

/* PATCH v13 暂停控制（v19 修复：兼容脚本作用域内的 Dialogue，原 window.Dialogue 恒为 undefined） */
(function(){
  /* 取当前 Dialogue：优先脚本作用域，其次 window */
  function D(){
    try{ if(typeof Dialogue !== 'undefined' && Dialogue) return Dialogue; }catch(e){}
    return window.Dialogue || null;
  }
  var pc = {
    paused: false,
    promise: null,
    resolver: null,
    pause: function(){
      if(this.paused) return;
      this.paused = true;
      var self = this;
      this.promise = new Promise(function(r){ self.resolver = r; });
      var d = D();
      if(d && d.timer){ clearInterval(d.timer); d._timerPaused = true; }
      var _dlgP = document.getElementById('dlg');
      if(_dlgP && _dlgP.classList.contains('on')){
        _dlgP.dataset.wasOn = '1';
        _dlgP.classList.remove('on');
      }
    },
    resume: function(){
      if(!this.paused) return;
      this.paused = false;
      if(this.resolver){ this.resolver(); }
      this.promise = null;
      this.resolver = null;
      var d = D();
      if(d && d._timerPaused){
        d._timerPaused = false;
        if(d.typing){
          d.charIdx = d.full.length;
          d.typing = false;
          document.getElementById('dlgText').textContent = d.full;
          document.getElementById('dlgNext').style.opacity = '1';
        }
      }
      var _dlgR = document.getElementById('dlg');
      if(_dlgR && _dlgR.dataset.wasOn === '1'){
        /* v21：只有当玩家还在局内时才还原气泡。
           判据用 Game.abort（「返回主菜单」会置 true，「继续营业」保持 false），
           不能用"是否还有菜单界面在显示"——resume() 在两个调用点里
           都排在 showScreen(null) 之前，那一刻 scrub-pause 还亮着。 */
        var _stillInGame = true;
        try{ if(typeof Game !== 'undefined' && Game && Game.abort) _stillInGame = false; }catch(e){}
        if(_stillInGame && d && d.resolve){ _dlgR.classList.add('on'); }
        else { _dlgR.classList.remove('on'); }
        _dlgR.dataset.wasOn = '';
      }
    }
  };
  window._pauseCtrl = pc;
  console.log('[v13] 暂停控制已加载');
})();

/* PATCH v19 Sfx 8bit 音效引擎
   修复：
   1) 原 v18 用 window.AudioEngine 判断，但 AudioEngine 是脚本作用域 const，
      不在 window 上 → this.ctx 永远为 null → 全局静音（已实测）。
      现在直接引用脚本作用域的 AudioEngine。
   2) speak() 原本固定 0.07s，与文本长度无关。现在整句语音总时长 ∝ 文本长度，
      并支持传入 (整句文本, 当前字符下标) 形成有语调的逐字电子音。
*/
(function(){
  /* 单个有效字符对应的"音节"基准时长（秒）。文本越长，整句语音越长。 */
  var SPEAK_PER_CHAR = 0.062;
  var SPEAK_MIN_TOTAL = 0.09;   /* 最短整句时长 */
  var SPEAK_MAX_TOTAL = 3.20;   /* 最长整句时长，防止超长文本拖太久 */

  var Sfx = {
    enabled: true,
    volume: 0.5,
    ctx: null,
    _lastSpeak: 0,
    _speakQueue: 0,

    /* 取得（必要时创建）音频上下文。直接引用脚本作用域的 AudioEngine。 */
    init: function(){
      try{
        if(window.AudioEngine) window.AudioEngine.init();
        else if(typeof AudioEngine !== 'undefined') AudioEngine.init();
      }catch(e){}
      var c = null;
      try{
        c = (typeof AudioEngine !== 'undefined' && AudioEngine.ctx)
          ? AudioEngine.ctx
          : (window.AudioEngine && window.AudioEngine.ctx) || null;
      }catch(e){ c = null; }
      this.ctx = c;
      if(c && c.state === 'suspended'){ try{ c.resume(); }catch(e){} }
      return c;
    },

    /* 单个 8bit 音。dest 可指定输出节点（默认直连扬声器）。 */
    _play: function(freq, dur, vol, type, dest){
      if(!this.enabled || this.volume <= 0) return;
      var ctx = this.init();
      if(!ctx) return;
      try{
        var t = ctx.currentTime;
        var o = ctx.createOscillator();
        var g = ctx.createGain();
        o.type = type || 'square';
        o.frequency.setValueAtTime(Math.max(40, freq), t);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(Math.max(0.0001, vol * this.volume), t + 0.003);
        g.gain.exponentialRampToValueAtTime(0.0001, t + Math.max(0.012, dur));
        o.connect(g);
        g.connect(dest || ctx.destination);
        o.start(t);
        o.stop(t + Math.max(0.012, dur) + 0.02);
      }catch(e){}
    },

    /* ---------- 整句语音时长：与文本长度线性相关 ---------- */
    speechDuration: function(text){
      var n = this.effCharCount(text);
      var total = SPEAK_MIN_TOTAL + n * SPEAK_PER_CHAR;
      return Math.max(SPEAK_MIN_TOTAL, Math.min(SPEAK_MAX_TOTAL, total));
    },

    /* 有效字符数（忽略空白与标点，它们不发声） */
    effCharCount: function(text){
      var s = String(text == null ? '' : text).replace(/[\s，。！？、；：""''《》（）…—,.!?;:()"']/g, '');
      return Math.max(1, s.length);
    },

    /* 逐字说话音。text=整句，idx=当前字符下标（从 1 开始）。 */
    speak: function(text, idx){
      if(!this.enabled || this.volume <= 0) return;
      var now = performance.now();
      /* 打字机间隔 28ms，节流放到 22ms 以免语音断续 */
      if(now - this._lastSpeak < 22) return;
      this._lastSpeak = now;

      var ctx = this.init();
      if(!ctx) return;

      var n = this.effCharCount(text);
      var total = this.speechDuration(text);
      /* 单音节时长：与"每字均摊时长"相关，但压在 26~60ms，
         让每个音节清晰可辨、连起来又有说话的连续感 */
      var per = total / n;
      var dur = Math.max(0.026, Math.min(0.060, per * 0.55));

      var pos = (typeof idx === 'number' && idx > 0) ? Math.min(1, idx / n) : 0;
      /* 语调：句首偏高、句尾下沉，叠加随机抖动，避免机械重复 */
      var base = 560 - pos * 190 + (Math.random() * 96 - 48);

      try{
        var t = ctx.currentTime;
        var o = ctx.createOscillator();
        var g = ctx.createGain();
        o.type = 'square';
        o.frequency.setValueAtTime(base, t);
        o.frequency.exponentialRampToValueAtTime(Math.max(60, base * 0.62), t + dur);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(0.26 * this.volume, t + 0.005);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g);
        g.connect(ctx.destination);
        o.start(t);
        o.stop(t + dur + 0.02);
      }catch(e){}
    },

    /* 一次说完（点击跳过打字机时用），时长同样与文本长度相关 */
    speakAll: function(text){
      if(!this.enabled || this.volume <= 0) return;
      var ctx = this.init();
      if(!ctx) return;
      var n = this.effCharCount(text);
      var total = Math.min(0.9, this.speechDuration(text) * 0.55);
      var steps = Math.max(2, Math.min(10, Math.round(n / 3)));
      var self = this;
      var stepGap = total / steps * 1000;
      for(var i = 0; i < steps; i++){
        (function(k){
          setTimeout(function(){
            var pos = k / steps;
            var base = 560 - pos * 180 + (Math.random() * 80 - 40);
            self._play(base, Math.max(0.03, total / steps * 0.8), 0.24, 'square');
          }, Math.round(k * stepGap));
        })(i);
      }
    },

    /* ---------- 界面音效 ---------- */
    click: function(){
      var self = this;
      this._play(880, 0.045, 0.55, 'square');
      setTimeout(function(){ self._play(1320, 0.030, 0.45, 'square'); }, 18);
    },

    cancel: function(){
      var self = this;
      this._play(400, 0.06, 0.5, 'square');
      setTimeout(function(){ self._play(280, 0.08, 0.45, 'square'); }, 40);
    },

    open: function(){
      var self = this;
      this._play(660, 0.05, 0.5, 'square');
      setTimeout(function(){ self._play(990, 0.07, 0.5, 'square'); }, 45);
    },

    success: function(){
      var self = this;
      [523, 659, 784, 1047].forEach(function(f, i){
        setTimeout(function(){ self._play(f, 0.09, 0.5, 'square'); }, i * 70);
      });
    },

    /* 高兴/成交 */
    coin: function(){
      var self = this;
      [1047, 1319, 1568, 2093].forEach(function(f, i){
        setTimeout(function(){ self._play(f, 0.055, 0.42, 'square'); }, i * 45);
      });
    },

    fail: function(){
      var self = this;
      this._play(320, 0.12, 0.5, 'square');
      setTimeout(function(){ self._play(220, 0.18, 0.45, 'square'); }, 90);
      setTimeout(function(){ self._play(160, 0.22, 0.4, 'square'); }, 200);
    },

    draw: function(){
      var self = this;
      [880, 1046, 1318, 1568].forEach(function(f, i){
        setTimeout(function(){ self._play(f, 0.06, 0.45, 'square'); }, i * 55);
      });
    },

    /* 抽卡逐个翻牌 */
    flip: function(i){
      this._play(700 + (i || 0) * 120, 0.05, 0.42, 'square');
    }

      }catch(e){}
    },

    /* 前瞻调度：每次把未来 SCHEDULE_AHEAD 秒内的音符全部排好。
       lead / bass 各用独立时间游标，避免两者长度不等时错位。 */
    _tick: function(){
      const ctx = this.ctx, th = THEMES[this.key];
      if(!ctx || !th || !this.out) return;
      /* 上下文还没被用户手势解锁时不要预排音符：
         suspended 状态下 currentTime 不走，预排的音符会在恢复瞬间抢跑，
         并且会让时间轴漂移。这里持续把游标对齐到"现在"。 */
      if(ctx.state !== 'running'){
        this._nextLead = ctx.currentTime + 0.12;
        this._nextBass = ctx.currentTime + 0.12;
        return;
      }
      const spb = 60 / th.bpm / 4;      /* 一个 16 分音符的秒数 */
      const AHEAD = 0.4;
      const now = ctx.currentTime;
      /* 长时间切后台后游标会落在过去 → 直接对齐，避免补排一大堆过期音符 */
      if(this._nextLead < now - 0.5 || this._nextBass < now - 0.5){
        this._nextLead = now + 0.12;
        this._nextBass = now + 0.12;
      }
      const horizon = now + AHEAD;

      /* 旋律声部 */
      let guard = 0;
      while(this._nextLead < horizon && guard++ < 256){
        const L = th.lead[this._li % th.lead.length];
        this._li++;
        if(!L){ this._nextLead += spb; continue; }   /* 空槽也要推进时间，否则死循环 */
          const d = L[1] * spb;
          if(L[0] !== null){
            /* 默认 0.86 留 14% 静音；主题可用 legato 覆盖成 >1 做音垫叠接 */
            const lg = th.legato || 0.86;
            this._note(mtof(th.root + L[0]), this._nextLead, d * lg,
                       th.vol * this.volume, th.wave, this.out, th.fxLead);
          }
        this._nextLead += d;
      }

      /* 低音声部 */
      guard = 0;
      while(this._nextBass < horizon && guard++ < 256){
        const B = th.bass[this._bi % th.bass.length];
        this._bi++;
        if(!B){ this._nextBass += spb; continue; }
          const d = B[1] * spb;
          if(B[0] !== null){
            const lg = th.legatoBass || 0.9;
            this._note(mtof(th.root + B[0]), this._nextBass, d * lg,
                       th.bassVol * this.volume, th.bassWave, this.out, th.fxBass);
          }
        this._nextBass += d;
      }
    },

    set: function(key, force){
      key = key || 'game';
      /* 'none' = 暂不出声（试听唱片时让位给唱片本身），但仍记住这个状态 */
      if(key === 'none'){
        if(this.key === 'none') return;
        this.key = 'none';
        this._pendingKey = null;
        this._stopTimer();
        this._fadeOut(0.25);
        return;
      }
      if(!THEMES[key]) key = 'game';
      /* 同一首且在播 → 什么都不做（避免反复打断）。force=true 时强制重起 */
      if(!force && this.key === key && this._timer) return;
      if(!this.enabled){ this._pendingKey = key; return; }
      this.key = key;
      this._pendingKey = null;
      this._restart();
    },

    _restart: function(){
      const ctx = this.init();
      if(!ctx) return;
      if(ctx.state === 'suspended'){ try{ ctx.resume(); }catch(e){} }
      this._stopTimer();
      this._fadeOut(0.18);
      /* 新建曲目总线，做 0 → 1 的淡入；音量由常驻 bus 统一控制 */
      const out = ctx.createGain();
      out.gain.value = 0;
      out.connect(this.bus());
      const target = 1;
      try{
        const t = ctx.currentTime;
        out.gain.cancelScheduledValues(t);
        out.gain.setValueAtTime(0.0001, t);
        out.gain.linearRampToValueAtTime(target, t + 0.35);
      }catch(e){}
      this.out = out;
      this._li = 0; this._bi = 0;
      this._nextLead = ctx.currentTime + 0.12;
      this._nextBass = ctx.currentTime + 0.12;
      const self = this;
      this._timer = setInterval(function(){ self._tick(); }, 120);
      this._tick();
    },

    _fadeOut: function(sec){
      const ctx = this.ctx, old = this.out;
      if(!ctx || !old) return;
      this.out = null;
      try{
        const t = ctx.currentTime;
        old.gain.cancelScheduledValues(t);
        old.gain.setValueAtTime(Math.max(0.0001, old.gain.value), t);
        old.gain.exponentialRampToValueAtTime(0.0001, t + sec);
        setTimeout(function(){ try{ old.disconnect(); }catch(e){} }, (sec + 0.15) * 1000);
      }catch(e){}
    },

    _stopTimer: function(){ if(this._timer){ clearInterval(this._timer); this._timer = null; } },

    stop: function(){ this._stopTimer(); this._fadeOut(0.2); this.key = null; },

    pauseApp: function(){ this._stopTimer(); this._fadeOut(0.15); },

    resumeApp: function(){ if(this.key && this.key !== 'none' && this.enabled) this._restart(); else if(this._pendingKey) this.set(this._pendingKey); }
  };
  window.Bgm = Bgm;
  /* v28：把音频引擎也挂到 window 上。
     原因：顶层 const 不会成为 window 的属性（只有 var/function 会），
     导致外部工具/测试无法离线复用真实的合成与发音代码路径 —— 只能靠复制一份，
     而复制出来的副本会随源码改动悄悄失配。挂上引用后可以永远走真实代码。
     （typeof 守卫是为了让只截取本 IIFE 的静态分析脚本也能跑通。） */
  if(typeof AudioEngine !== 'undefined') window.AudioEngine = AudioEngine;

  /* 切到后台标签页时停掉 BGM，回来再续上（省电，也避免后台节流导致错拍） */
  document.addEventListener('visibilitychange', function(){
    try{
      if(document.hidden) Bgm.pauseApp();
      else Bgm.resumeApp();
    }catch(e){}
  });

  console.log('[v21] 8bit BGM 引擎已加载（menu / game / pause）');
})();
</script>
</body>
</html>
